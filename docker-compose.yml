# Source-build install. docker-compose.prod.yml is its release-image twin, and
# the two are kept in sync on purpose.
# Neither file uses env_file (it would hand every secret to every container), so
# a setting reaches a container only by being listed in its environment.
# A bare `KEY:` passes the host value through and otherwise leaves the
# Settings default in charge. Explicit `${KEY:-default}` entries stay where an
# empty host value must still get the default, or where Compose needs a value
# of its own. `make env-doc-check` checks which form each entry uses.
x-db-env: &db-env
  # api and worker log in as the opt-in runtime role when one is set; migrate
  # overrides these two with the privileged bootstrap identity.
  POSTGRES_USER: ${GEOLENS_RUNTIME_DB_ROLE:-${POSTGRES_USER}}
  POSTGRES_PASSWORD: ${GEOLENS_RUNTIME_DB_PASSWORD:-${POSTGRES_PASSWORD}}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB}
  # Empty keeps the single-tenant superuser login; a role opts api and worker
  # into the least-privilege boot guard.
  GEOLENS_RUNTIME_DB_ROLE:

x-auth-env: &auth-env
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  GEOLENS_ADMIN_USERNAME: ${GEOLENS_ADMIN_USERNAME}
  GEOLENS_ADMIN_PASSWORD: ${GEOLENS_ADMIN_PASSWORD}
  SECRET_ENCRYPTION_KEY: "${SECRET_ENCRYPTION_KEY:-}"
  SECRET_ENCRYPTION_KEY_PREVIOUS: "${SECRET_ENCRYPTION_KEY_PREVIOUS:-}"
  JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
  ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-15}"
  REFRESH_TOKEN_EXPIRE_DAYS: "${REFRESH_TOKEN_EXPIRE_DAYS:-7}"
  REFRESH_ROTATION_GRACE_SECONDS: "${REFRESH_ROTATION_GRACE_SECONDS:-30}"
  PASSWORD_MIN_LENGTH: "${PASSWORD_MIN_LENGTH:-12}"
  PASSWORD_REQUIRE_CLASSES: "${PASSWORD_REQUIRE_CLASSES:-3}"
  GEOLENS_TENANCY_MODE: "${GEOLENS_TENANCY_MODE:-single_tenant}"
  TENANT_BASE_DOMAIN:
  TENANT_TRUSTED_HOSTS: "${TENANT_TRUSTED_HOSTS:-localhost,127.0.0.1,::1,api,testserver}"

x-db-ssl-env: &db-ssl-env
  DATABASE_URL_OVERRIDE: "${DATABASE_URL_OVERRIDE:-}"
  TILE_DATABASE_URL_OVERRIDE:
  DATABASE_SSL_MODE: "${DATABASE_SSL_MODE:-prefer}"
  DATABASE_SSL_CA_CERT:
  DATABASE_POOL_PRE_PING: "${DATABASE_POOL_PRE_PING:-true}"  # aligned with the Settings default and the .env.example commented default
  DB_USE_EXTERNAL_POOLER: "${DB_USE_EXTERNAL_POOLER:-false}"
  DB_POOL_SIZE: "${DB_POOL_SIZE:-10}"
  DB_MAX_OVERFLOW: "${DB_MAX_OVERFLOW:-3}"  # pool budget: .env.example, DB_MAX_OVERFLOW
  DB_POOL_TIMEOUT: "${DB_POOL_TIMEOUT:-30}"
  DB_POOL_RECYCLE: "${DB_POOL_RECYCLE:-1800}"
  # Every backend process loads it through app.core.config; only get_db applies it.
  DB_STATEMENT_TIMEOUT_SECONDS: "${DB_STATEMENT_TIMEOUT_SECONDS:-300}"

x-storage-env: &storage-env
  STORAGE_PROVIDER: "${STORAGE_PROVIDER:-local}"
  S3_ENDPOINT:
  S3_PUBLIC_ENDPOINT: "${S3_PUBLIC_ENDPOINT:-}"
  S3_BUCKET:
  S3_ACCESS_KEY_ID:
  S3_SECRET_ACCESS_KEY:
  S3_REGION: "${S3_REGION:-us-east-1}"
  S3_ALLOW_HTTP: "${S3_ALLOW_HTTP:-false}"
  S3_ADDRESSING_STYLE: "${S3_ADDRESSING_STYLE:-auto}"
  S3_PRESIGNED_DOWNLOADS: "${S3_PRESIGNED_DOWNLOADS:-false}"
  # Required when STORAGE_PROVIDER=azure; keep Azurite creds in .env, not the image.
  AZURE_STORAGE_CONTAINER:
  AZURE_STORAGE_CONNECTION_STRING:
  AZURE_STORAGE_ACCOUNT_URL:
  AZURE_STORAGE_ACCOUNT_KEY:

x-logging-env: &logging-env
  LOG_JSON: "${LOG_JSON:-false}"
  LOG_LEVEL: "${LOG_LEVEL:-INFO}"
  # Empty falls back to LOG_JSON; production gives a Secure cookie and non-public
  # /docs.
  ENVIRONMENT:

x-ai-env: &ai-env
  ANTHROPIC_API_KEY:
  LLM_MODEL:
  LLM_MODEL_LIGHT:
  ANTHROPIC_PLATFORM: "${ANTHROPIC_PLATFORM:-anthropic}"
  ANTHROPIC_BASE_URL:
  ANTHROPIC_FOUNDRY_API_KEY: "${ANTHROPIC_FOUNDRY_API_KEY:-}"
  ANTHROPIC_FOUNDRY_RESOURCE: "${ANTHROPIC_FOUNDRY_RESOURCE:-}"
  ANTHROPIC_BEDROCK_API_KEY:
  ANTHROPIC_BEDROCK_AWS_REGION:
  ANTHROPIC_BEDROCK_AWS_ACCESS_KEY_ID:
  ANTHROPIC_BEDROCK_AWS_SECRET_ACCESS_KEY:
  CLOUD_ML_REGION: "${CLOUD_ML_REGION:-}"
  ANTHROPIC_VERTEX_PROJECT_ID: "${ANTHROPIC_VERTEX_PROJECT_ID:-}"
  GOOGLE_APPLICATION_CREDENTIALS: "${GOOGLE_APPLICATION_CREDENTIALS:-}"
  OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
  OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o}"
  OPENAI_REASONING_EFFORT:
  OPENAI_API_STYLE:
  OPENAI_MODEL_LIGHT:
  OPENAI_BASE_URL:
  EMBEDDING_MODEL: "${EMBEDDING_MODEL:-text-embedding-3-small}"
  EMBEDDING_DIMS: "${EMBEDDING_DIMS:-1536}"
  EMBEDDING_BASE_URL:

x-edition-env: &edition-env
  # Edition and license inputs must reach every backend process.
  GEOLENS_EDITION:
  GEOLENS_TENANCY_MODE: "${GEOLENS_TENANCY_MODE:-single_tenant}"
  GEOLENS_LICENSE_ENFORCE: "${GEOLENS_LICENSE_ENFORCE:-false}"
  GEOLENS_LICENSE_KEY: "${GEOLENS_LICENSE_KEY:-}"
  GEOLENS_LICENSE_FILE: "${GEOLENS_LICENSE_FILE:-}"
  GEOLENS_LICENSE_AUDIENCE: "${GEOLENS_LICENSE_AUDIENCE:-}"

x-notification-env: &notification-env
  NOTIFICATIONS_ENABLED: "${NOTIFICATIONS_ENABLED:-false}"
  SMTP_HOST:
  SMTP_PORT: "${SMTP_PORT:-587}"
  SMTP_USERNAME:
  SMTP_PASSWORD:
  SMTP_FROM_ADDRESS:
  SMTP_USE_TLS: "${SMTP_USE_TLS:-true}"
  NOTIFICATION_WEBHOOK_URL:
  NOTIFICATION_WEBHOOK_SECRET:
  NOTIFY_ON_SIGNUP: "${NOTIFY_ON_SIGNUP:-false}"
  NOTIFY_ON_INGEST_COMPLETE: "${NOTIFY_ON_INGEST_COMPLETE:-false}"
  NOTIFY_ON_INGEST_FAILED: "${NOTIFY_ON_INGEST_FAILED:-false}"
  NOTIFY_ON_HEALTH_ALERT: "${NOTIFY_ON_HEALTH_ALERT:-false}"
  NOTIFICATION_ADMIN_EMAIL:

x-app-runtime-env: &app-runtime-env
  LANDING_FIRST: "${LANDING_FIRST:-false}"
  BANNER_ENABLED: "${BANNER_ENABLED:-false}"
  BANNER_TEXT:
  BANNER_COLOR: "${BANNER_COLOR:-warning}"
  TITILER_BASE_URL: "${TITILER_BASE_URL:-http://titiler:8000}"
  REMOTE_RASTER_RELAY_BASE_URL: "${REMOTE_RASTER_RELAY_BASE_URL:-http://api:8000}"

# api, worker and migrate start as root, chown their volumes, then setpriv to
# uid 1001; the added caps cover only that. titiler drops all caps and stays out.
x-hardened-base: &hardened-base
  security_opt:
    - no-new-privileges=true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN          # chown -R appuser:appgroup ${STAGING_DIR}
    - DAC_OVERRIDE   # chmod g+rwX inside arbitrary-perm volume mounts
    - FOWNER         # chmod operates on files owned by other UIDs
    - SETGID         # setpriv --regid 1001
    - SETUID         # setpriv --reuid 1001
  read_only: true

services:
  db:
    build:
      context: ./db
    command: postgres -c config_file=/etc/postgresql/custom.conf
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GEOLENS_RUNTIME_DB_ROLE: "${GEOLENS_RUNTIME_DB_ROLE:-}"
      GEOLENS_RUNTIME_DB_PASSWORD: "${GEOLENS_RUNTIME_DB_PASSWORD:-}"
      GEOLENS_RUNTIME_DB_ROLE_ADOPT_EXISTING: "${GEOLENS_RUNTIME_DB_ROLE_ADOPT_EXISTING:-false}"
      # The migration URL holds a credential and never enters db. These presence-only
      # markers let the reconciler ignore an external migrator, and the local flag
      # admits a custom migrator on db.
      GEOLENS_MIGRATION_DB_ROLE: "${GEOLENS_MIGRATION_DB_ROLE:-}"
      GEOLENS_MIGRATION_DB_URL_CONFIGURED: "${MIGRATION_DATABASE_URL_OVERRIDE:+configured}${DATABASE_URL_OVERRIDE:+configured}"
      GEOLENS_MIGRATION_DB_LOCAL: "${GEOLENS_MIGRATION_DB_LOCAL:-false}"
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # PG 18+ images take one mount at /var/lib/postgresql; the legacy .../data path
      # makes the entrypoint refuse to boot.
      - pgdata:/var/lib/postgresql
      # Read-only so a compromised db container cannot rewrite the init script that
      # reruns on every fresh pgdata volume.
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./scripts/lib/configure-runtime-db-role.sh:/usr/local/bin/configure-runtime-db-role:ro
      - ./db/postgresql.conf:/etc/postgresql/custom.conf:ro
    # 2g covers shared_buffers (512 MB) plus work_mem headroom.
    mem_limit: "${DB_MEM_LIMIT:-2g}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    # initdb chowns the data dir, then gosu drops to postgres; these caps cover only
    # that, and no-new-privileges still allows the drop.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    # Skip the api entrypoint for this one-shot.
    entrypoint: []
    # `heads` applies every branch head; bare `head` fails on a multi-head graph.
    command: sh -c "uv run --no-dev alembic upgrade heads"
    # Idempotent; a failure must stop the dependency chain, not retry.
    restart: "no"
    <<: *hardened-base
    # The api entrypoint probe needs a writable /app/staging; migrate writes no
    # uploads, so a small tmpfs serves.
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/appuser:size=64m,uid=1001,gid=1001
      - /app/staging:size=8m,uid=1001,gid=1001
    volumes:
      - ./backend/alembic:/app/alembic
      # env.py and some migrations import application code.
      - ./backend/app:/app/app:ro
    environment:
      <<: [*db-env, *auth-env, *db-ssl-env, *edition-env]
      # Migrations run as the bootstrap identity; DATABASE_URL_OVERRIDE is the runtime
      # login when runtime-role mode is on.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL_OVERRIDE: "${MIGRATION_DATABASE_URL_OVERRIDE:-${DATABASE_URL_OVERRIDE:-}}"
      GEOLENS_RUNTIME_DB_ROLE: ""
      GEOLENS_MIGRATION_DB_ROLE: "${GEOLENS_MIGRATION_DB_ROLE:-${GEOLENS_RUNTIME_DB_ROLE:+${POSTGRES_USER}}}"
      PYTHONPATH: /app
      # Migration 0012 needs an unset dimension to stay empty so stored vectors win
      # over the 1536 fallback; an explicit 1536 stays explicit.
      EMBEDDING_DIMS: "${EMBEDDING_DIMS-}"
      ENV_ONLY_CONFIG: "${ENV_ONLY_CONFIG:-false}"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    # Root only to fix volume ownership; the entrypoint setprivs to uid 1001.
    user: "0:0"
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    # 4g also fits pytest -n 4 with coverage.
    mem_limit: "${API_MEM_LIMIT:-4g}"
    <<: *hardened-base
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/appuser:size=128m,uid=1001,gid=1001
      - /var/run:size=8m
    entrypoint: ["/app/scripts/api-entrypoint.sh"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./.dockerignore:/app/.dockerignore:ro
      - ./.env.example:/app/.env.example:ro
      - ./.github:/app/.github:ro
      - ./CHANGELOG.md:/app/CHANGELOG.md:ro
      - ./CODE_OF_CONDUCT.md:/app/CODE_OF_CONDUCT.md:ro
      - ./Dockerfile:/app/Dockerfile:ro
      - ./README.de.md:/app/README.de.md:ro
      - ./README.es.md:/app/README.es.md:ro
      - ./README.fr.md:/app/README.fr.md:ro
      - ./README.md:/app/README.md:ro
      - ./RUNBOOK.md:/app/RUNBOOK.md:ro
      - ./SUPPORT.md:/app/SUPPORT.md:ro
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend:/app/backend:ro
      - ./backend/tests:/app/tests
      - ./cli:/app/cli:ro
      - ./db:/app/db:ro
      - ./deployment:/app/deployment:ro
      - ./docker-compose.prod.yml:/app/docker-compose.prod.yml:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./e2e:/app/e2e:ro
      - ./examples:/app/examples:ro
      - ./frontend:/app/frontend:ro
      - ./frontend/src/types/api.ts:/app/frontend/src/types/api.ts:ro
      # Single files, never all of ./scripts: a directory mount at /app/scripts would
      # shadow the entrypoints baked from backend/scripts. scripts/lib and
      # scripts/tests have no baked counterpart.
      - ./scripts/flatten_openapi_defs.py:/app/scripts/flatten_openapi_defs.py:ro
      - ./scripts/init-db.sh:/app/scripts/init-db.sh:ro
      - ./scripts/lib:/app/scripts/lib:ro
      - ./scripts/restore.sh:/app/scripts/restore.sh:ro
      - ./scripts/seed-showcase.py:/app/scripts/seed-showcase.py:ro
      - ./scripts/tests:/app/scripts/tests:ro
      - ./sdks:/app/sdks:ro
      # api, worker and titiler must see the same files at the fixed /app/staging.
      # Change all three mounts, the migrate tmpfs and the Settings default together.
      - upload_staging:/app/staging
    # Dev runs one worker because uvicorn forbids --workers > 1 with --reload.
    # --forwarded-allow-ips='*' is safe only because nginx overwrites X-Forwarded-For
    # with $remote_addr (frontend/nginx.conf); rate limits and audit logs read the
    # client address uvicorn takes from it.
    command: >
      sh -c "uv run --no-dev uvicorn app.api.main:app
      --host 0.0.0.0 --port 8000
      --workers $${UVICORN_WORKERS:-1}
      --timeout-keep-alive $${UVICORN_TIMEOUT_KEEP_ALIVE:-5}
      --timeout-graceful-shutdown $${UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN:-30}
      --proxy-headers --forwarded-allow-ips='*'
      --reload --reload-dir /app/app"
    environment:
      <<: [*db-env, *auth-env, *db-ssl-env, *storage-env, *logging-env, *ai-env, *edition-env, *notification-env, *app-runtime-env]
      PYTHONPATH: /app
      GEOLENS_API_RUN_MIGRATIONS: "${GEOLENS_API_RUN_MIGRATIONS:-true}"
      UVICORN_WORKERS: "${UVICORN_WORKERS:-1}"
      # Per-process sandbox slots when API replicas share a pooler.
      SANDBOX_QUERY_SLOTS:
      UVICORN_TIMEOUT_KEEP_ALIVE: "${UVICORN_TIMEOUT_KEEP_ALIVE:-5}"
      UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN: "${UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN:-30}"
      # prometheus_client multiprocess dir, on the api's tmpfs so stale per-pid files
      # never survive a restart.
      PROMETHEUS_MULTIPROC_DIR: "${PROMETHEUS_MULTIPROC_DIR:-/tmp/prometheus-multiproc}"
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080/api}
      PUBLIC_BASE_URL:
      PRIVACY_URL:
      DCAT_CONTACT_EMAIL:
      REDIS_URL:
      CDN_BASE_URL:
      PRESIGNED_MULTIPART_THRESHOLD_MB: "${PRESIGNED_MULTIPART_THRESHOLD_MB:-100}"
      TILE_CACHE_TTL: "${TILE_CACHE_TTL:-300}"
      TILE_SIGNING_SECRET:
      UPLOAD_MAX_SIZE_MB: "${UPLOAD_MAX_SIZE_MB:-500}"
      MAX_TILESET_UNPACKED_MB: "${MAX_TILESET_UNPACKED_MB:-20480}"
      MAX_TILESET_ENTRIES: "${MAX_TILESET_ENTRIES:-100000}"
      # Pinned to the upload_staging mount target; not operator-tunable.
      UPLOAD_STAGING_DIR: "/app/staging"
      UPLOAD_ALLOWED_EXTENSIONS: "${UPLOAD_ALLOWED_EXTENSIONS:-.zip,.gpkg,.geojson,.json,.csv,.tif,.tiff,.xlsx,.xls,.parquet,.fgb,.kml,.kmz,.3tz,.laz}"
      REGISTRATION_ENABLED: "${REGISTRATION_ENABLED:-false}"
      EMAIL_VERIFICATION_REQUIRED: "${EMAIL_VERIFICATION_REQUIRED:-true}"
      PASSWORD_LOGIN_ENABLED: "${PASSWORD_LOGIN_ENABLED:-true}"
      LOGIN_RATE_LIMIT: "${LOGIN_RATE_LIMIT:-5}"
      ALLOWED_EMAIL_DOMAINS:
      TILE_POOL_MIN_SIZE: "${TILE_POOL_MIN_SIZE:-2}"
      TILE_POOL_MAX_SIZE: "${TILE_POOL_MAX_SIZE:-10}"
      ENV_ONLY_CONFIG: "${ENV_ONLY_CONFIG:-false}"
      CORS_ALLOWED_ORIGINS:
      # Passed to ogr2ogr as GDAL_HTTP_TIMEOUT; slow ArcGIS Online layers need 300s.
      INGEST_HTTP_TIMEOUT_SECONDS: "${INGEST_HTTP_TIMEOUT_SECONDS:-300}"
      SERVICE_CREDENTIALS_ALLOW_HTTP_HOSTS:
      # 0 keeps terminal ingest_jobs history forever.
      INGEST_JOBS_RETENTION_DAYS: "${INGEST_JOBS_RETENTION_DAYS:-30}"
      PROCRASTINATE_SCHEMA: "${PROCRASTINATE_SCHEMA:-catalog}"
      # Read by the sweeps and the presign paths in both api and worker.
      PENDING_JOB_TIMEOUT_SECONDS: "${PENDING_JOB_TIMEOUT_SECONDS:-3600}"
      STAGING_ORPHAN_MIN_AGE_SECONDS: "${STAGING_ORPHAN_MIN_AGE_SECONDS:-86400}"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Liveness, not readiness: /health also probes the cache and object store, which
      # the API survives, and this probe gates the frontend's start.
      test: ["CMD-SHELL", "python -B -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    user: "0:0"
    init: true
    stop_grace_period: 35s
    restart: unless-stopped
    # 4g covers GDAL/OGR buffers during large ingests such as COG conversion.
    mem_limit: "${WORKER_MEM_LIMIT:-4g}"
    <<: *hardened-base
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/appuser:size=128m,uid=1001,gid=1001
      - /var/run:size=8m
    entrypoint: ["/app/scripts/worker-entrypoint.sh"]
    volumes:
      - ./backend/app:/app/app
      # The boot-time schema check compares the DB with these scripts.
      - ./backend/alembic:/app/alembic:ro
      - ./backend/tests:/app/tests
      - upload_staging:/app/staging
    environment:
      <<: [*db-env, *auth-env, *db-ssl-env, *storage-env, *logging-env, *ai-env, *edition-env, *notification-env]
      PYTHONPATH: /app
      REDIS_URL:
      # Pinned to the upload_staging mount target; not operator-tunable.
      UPLOAD_STAGING_DIR: "/app/staging"
      WORKER_SHUTDOWN_TIMEOUT: "${WORKER_SHUTDOWN_TIMEOUT:-30}"
      # Parallel job slots: 2-3 on multi-core hosts, 1 on 2-vCPU boxes.
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-1}"
      # This fallback shadows Settings.worker_queues and must list all its queues. A
      # job deferred to a queue no worker subscribes to stays 'todo' forever, so
      # subscribe workers before the API defers to a new queue.
      WORKER_QUEUES: "${WORKER_QUEUES:-priority,ingest,raster,download,ingest-auth-v2}"
      INGEST_HTTP_TIMEOUT_SECONDS: "${INGEST_HTTP_TIMEOUT_SECONDS:-300}"
      SERVICE_CREDENTIALS_ALLOW_HTTP_HOSTS:
      # The URL-import fetch clock runs in this container.
      URL_IMPORT_FETCH_MAX_SECONDS: "${URL_IMPORT_FETCH_MAX_SECONDS:-1800}"
      # The tileset worker rechecks these caps before its first put.
      MAX_TILESET_UNPACKED_MB: "${MAX_TILESET_UNPACKED_MB:-20480}"
      MAX_TILESET_ENTRIES: "${MAX_TILESET_ENTRIES:-100000}"
      PROCRASTINATE_SCHEMA: "${PROCRASTINATE_SCHEMA:-catalog}"
      # The worker purges expired queue jobs on the same retention and reads
      # admin-editable settings, which ENV_ONLY_CONFIG locks to the env.
      INGEST_JOBS_RETENTION_DAYS: "${INGEST_JOBS_RETENTION_DAYS:-30}"
      ENV_ONLY_CONFIG: "${ENV_ONLY_CONFIG:-false}"
      # Read by the sweeps and the presign paths in both api and worker.
      PENDING_JOB_TIMEOUT_SECONDS: "${PENDING_JOB_TIMEOUT_SECONDS:-3600}"
      STAGING_ORPHAN_MIN_AGE_SECONDS: "${STAGING_ORPHAN_MIN_AGE_SECONDS:-86400}"
      # Read by the worker that runs the materialize task.
      ANALYSIS_MATERIALIZE_TIMEOUT_SECONDS: "${ANALYSIS_MATERIALIZE_TIMEOUT_SECONDS:-300}"
      ANALYSIS_REGISTRATION_TIMEOUT_SECONDS: "${ANALYSIS_REGISTRATION_TIMEOUT_SECONDS:-600}"
      ANALYSIS_MATERIALIZE_WORK_MEM_MB: "${ANALYSIS_MATERIALIZE_WORK_MEM_MB:-64}"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -B -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health/live')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  titiler:
    # Held at 2.x without contract testing. Upstream ships security fixes as plain
    # bugfix releases with no advisory, so only a deliberate bump is a control. The
    # rasterio wheel, not this tag, pins GDAL (3.12.4 on 2.4.0).
    image: ghcr.io/developmentseed/titiler:2.4.0
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    # 1g covers GDAL_CACHEMAX (200 MB) plus the Python process.
    mem_limit: "${TITILER_MEM_LIMIT:-1g}"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    # /vsis3/ reads against a custom endpoint (MinIO, R2) need GDAL's AWS_* settings,
    # derived here from S3_*; explicitly set AWS_* values win.
    command:
      - /bin/sh
      - -ec
      - |
        # The flags carry no credential material. They let the
        # sidecar reject a partial dedicated-pair rollout before Uvicorn starts
        # without also exposing the unused shared writer credential.
        if [ "$${TITILER_S3_ACCESS_KEY_ID_SET:-}" != "$${TITILER_S3_SECRET_ACCESS_KEY_SET:-}" ]; then
          echo "TiTiler dedicated S3 access key and secret must be set together" >&2
          exit 1
        fi
        if [ -z "$${AWS_S3_ENDPOINT:-}" ]; then
          ep="$${S3_ENDPOINT:-}"
          allow_http=$$(printf '%s' "$${S3_ALLOW_HTTP:-}" | tr '[:upper:]' '[:lower:]')
          case "$$ep" in
            http://*)  export AWS_HTTPS="$${AWS_HTTPS:-NO}"; ep="$${ep#http://}" ;;
            https://*) ep="$${ep#https://}" ;;
            # scheme-less endpoint: http exactly when S3_ALLOW_HTTP is truthy,
            # mirroring the app SDK's S3StorageProvider scheme resolution.
            ?*) case "$$allow_http" in true|1|yes|on) export AWS_HTTPS="$${AWS_HTTPS:-NO}" ;; esac ;;
          esac
          ep="$${ep%%/*}"
          [ -n "$$ep" ] && export AWS_S3_ENDPOINT="$$ep"
        fi
        [ "$${S3_ADDRESSING_STYLE:-auto}" = "path" ] && export AWS_VIRTUAL_HOSTING="$${AWS_VIRTUAL_HOSTING:-FALSE}"
        exec uvicorn titiler.application.main:app --host 0.0.0.0 --port 8000 --workers $${TITILER_WORKERS:-1}
    environment:
      # Inputs for the AWS endpoint derivation in the command.
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_ALLOW_HTTP: "${S3_ALLOW_HTTP:-}"
      S3_ADDRESSING_STYLE: "${S3_ADDRESSING_STYLE:-auto}"
      # Rendering is CPU-bound under the GIL, one tile per worker. GDAL_CACHEMAX
      # is per process, so raise TITILER_MEM_LIMIT with workers: about
      # N x (GDAL_CACHEMAX + 250 MB).
      TITILER_WORKERS: "${TITILER_WORKERS:-1}"
      # Capping glibc arenas slows TiTiler's RSS ratchet under concurrent reads but
      # does not stop it; size TITILER_MEM_LIMIT for the catalog.
      MALLOC_ARENA_MAX: "${TITILER_MALLOC_ARENA_MAX:-2}"
      GDAL_CACHEMAX: "200"                              # GDAL block cache in MB (default 5 — raise for concurrent tile requests)
      GDAL_DISABLE_READDIR_ON_OPEN: "EMPTY_DIR"         # Skip directory listing on S3/HTTP — avoids slow LIST calls per tile
      CPL_VSIL_CURL_ALLOWED_EXTENSIONS: ".tif,.tiff,.cog,.vrt"  # Only fetch these extensions via /vsicurl
      # VRTRawRasterBand is off (GeoLens never emits it; VRT mosaics still render).
      # ALLOWED_SOURCE alone does not deny raw sources, so ENABLE_RAWRASTERBAND=NO is
      # the deny-all and ALLOWED_SOURCE the narrowest clamp should it be re-enabled.
      # Both are pinned so a base-image bump cannot relax them.
      GDAL_VRT_ENABLE_RAWRASTERBAND: "NO"
      GDAL_VRT_RAWRASTERBAND_ALLOWED_SOURCE: "SIBLING_OR_CHILD_OF_VRT_PATH"
      # CPL_VSIL_CURL_HEADER_FILE_KVP_ENABLED (the /vsicurl/ header_file clamp) needs
      # GDAL >= 3.13.2; add it when a rasterio wheel bump gets there.
      VSI_CACHE: "TRUE"                                  # Enable /vsicurl block caching for range-request reuse
      CPL_VSIL_CURL_CACHE_SIZE: "16777216"               # /vsicurl cache size in bytes (16 MB)
      GDAL_HTTP_MERGE_CONSECUTIVE_RANGES: "YES"          # Merge adjacent HTTP range requests into fewer round-trips
      # Do not add GDAL_HTTP_FOLLOWLOCATION: it is not a GDAL option, and no GDAL
      # option stops redirects; that takes network-layer egress rules.
      # Only TiTiler's read-only credential enters this container, falling back to
      # the shared pair until operators provision one.
      AWS_ACCESS_KEY_ID: "${TITILER_S3_ACCESS_KEY_ID:-${S3_ACCESS_KEY_ID:-}}"
      AWS_SECRET_ACCESS_KEY: "${TITILER_S3_SECRET_ACCESS_KEY:-${S3_SECRET_ACCESS_KEY:-}}"
      # Presence flags, no secret material, for the command's fail-closed check.
      TITILER_S3_ACCESS_KEY_ID_SET: "${TITILER_S3_ACCESS_KEY_ID:+1}"
      TITILER_S3_SECRET_ACCESS_KEY_SET: "${TITILER_S3_SECRET_ACCESS_KEY:+1}"
      AWS_DEFAULT_REGION: "${S3_REGION:-us-east-1}"
      # GDAL /vsiaz/ credentials; for Azurite, use the well-known dev string.
      AZURE_STORAGE_CONNECTION_STRING: "${AZURE_STORAGE_CONNECTION_STRING:-}"
      AZURE_STORAGE_ACCOUNT: "${AZURE_STORAGE_ACCOUNT:-}"
      # GDAL names the key differently; translate it at the container boundary.
      AZURE_STORAGE_ACCESS_KEY: "${AZURE_STORAGE_ACCOUNT_KEY:-}"
      TITILER_API_ROOT_PATH: ""
    volumes:
      - upload_staging:/app/staging
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    # Runs as uid 1000; on Linux hosts with another uid the ./frontend bind mount may
    # not be writable and hot reload breaks, so override `user:` there.
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    # No read_only: Vite writes HMR caches under /tmp and /app/node_modules.
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Read only by vite.config.ts on the Node side, never by the browser bundle.
      API_PROXY_TARGET: http://api:8000
      # Extra Host values Vite accepts, e.g. behind a tunnel; empty keeps Vite's
      # localhost/LAN allowlist.
      FRONTEND_ALLOWED_HOSTS: ${FRONTEND_ALLOWED_HOSTS:-}
    healthcheck:
      # Fails on a stale node_modules or missing maplibre-gl; cold start takes 10-15s.
      test: ["CMD", "node", "/app/scripts/dev-readiness.mjs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy

  backup:
    # Runs by default, no profile. Built from the root Dockerfile's multi-arch backup
    # stage, not ./db, whose postgis base is amd64-only.
    build:
      context: .
      dockerfile: Dockerfile
      target: backup
    restart: unless-stopped
    # Runs as root throughout and never drops privilege, so it needs no caps. init
    # reaps the sleep-loop scheduler; no read_only because it writes under /backups.
    init: true
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    # The postgres base declares PGDATA a VOLUME, but this image only runs pg_dump;
    # tmpfs stops Docker creating an anonymous volume per backup container.
    tmpfs:
      - /var/lib/postgresql:size=1m,mode=0700
    volumes:
      - ./scripts:/scripts:ro
      - backup_data:/backups
      # Back up locally staged objects with the dump so a restore works; buckets on
      # external S3 need their own backups.
      - upload_staging:/staging:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-geolens}
      POSTGRES_HOST: db
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_RETENTION_DAILY: ${BACKUP_RETENTION_DAILY:-7}
      BACKUP_RETENTION_WEEKLY: ${BACKUP_RETENTION_WEEKLY:-4}
      BACKUP_S3_ENABLED: ${BACKUP_S3_ENABLED:-false}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      # No S3_ALLOW_HTTP: awscli follows the scheme in S3_ENDPOINT.
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-auto}
    entrypoint: ["/scripts/backup-entrypoint.sh"]
    healthcheck:
      # Freshness, not liveness: healthy only while the success marker, touched after
      # a full dump, verify and upload cycle, is younger than BACKUP_MAX_AGE_MINUTES.
      # Once an offsite marker exists it must stay as fresh, so dropping offsite
      # upload also turns the service unhealthy.
      test: ["CMD-SHELL", "find /backups/.last-success -mmin -${BACKUP_MAX_AGE_MINUTES:-1560} | grep -q . || exit 1; [ ! -e /backups/.last-offsite-success ] || find /backups/.last-offsite-success -mmin -${BACKUP_MAX_AGE_MINUTES:-1560} | grep -q . || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The marker appears only after the first backup, which can take minutes on a
      # large existing DB.
      start_period: 10m
      # Fast probes at start-up so a fresh install clears the installer's
      # wait-for-healthy budget.
      start_interval: 5s
    depends_on:
      db:
        condition: service_healthy
      # Never keep a pre-migration DB as the first backup.
      migrate:
        condition: service_completed_successfully

  # cloud-dev profile: local S3 and cache, loopback only.
  minio:
    # Silo, the community MinIO fork, still reads MINIO_* variables; quay.io/minio no
    # longer allows anonymous pulls. Pinned by digest.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    profiles: ["cloud-dev"]
    # `${VAR:?}` would fail `compose config` even with cloud-dev inactive, and MinIO
    # boots with minioadmin:minioadmin on an empty user. So the env refs stay
    # parse-safe `${VAR:-}` and this entrypoint refuses blank credentials.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$MINIO_ROOT_USER" ] || [ -z "$$MINIO_ROOT_PASSWORD" ]; then
          echo "FATAL: cloud-dev MinIO requires MINIO_ROOT_USER and MINIO_ROOT_PASSWORD in .env — refusing to start with default/blank credentials." >&2
          exit 1
        fi
        exec silo server /data --console-address ":9001"
    # minio holds root S3 credentials.
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      # Parse-safe empty default; the entrypoint rejects blank values.
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-}"
      # MinIO ignores AbortIncompleteMultipartUpload lifecycle rules, so this sweep
      # clears abandoned multipart parts. Keep the expiry above
      # PENDING_JOB_TIMEOUT_SECONDS plus headroom, or it aborts live uploads.
      MINIO_API_STALE_UPLOADS_EXPIRY: "${MINIO_API_STALE_UPLOADS_EXPIRY:-24h}"
      MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL: "${MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL:-6h}"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  minio-setup:
    # Paired digest pin with minio.
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    profiles: ["cloud-dev"]
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    depends_on:
      minio:
        condition: service_healthy
    # A mounted script, because a folded `entrypoint: >` destroys the CORS policy
    # heredoc. Parse-safe empty creds; the runtime rejects blanks.
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-}"
    volumes:
      - ./scripts/minio-setup.sh:/usr/local/bin/minio-setup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/minio-setup.sh"]

  azurite:
    # Azure Blob emulator. Pinned by digest.
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
    profiles: ["cloud-dev"]
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:10000:10000"  # Blob service — loopback only
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --loose --skipApiVersionCheck
    volumes:
      - azurite_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  valkey:
    image: valkey/valkey:9.1.2-alpine
    profiles: ["cloud-dev"]
    # cap_drop ALL breaks the entrypoint's setpriv; a non-root user skips it.
    user: "valkey"
    security_opt:
      - no-new-privileges=true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  pgdata:
  upload_staging:
  backup_data:
  minio_data:
  valkey_data:
  azurite_data:
