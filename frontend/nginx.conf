# TEMPLATE: docker-entrypoint.sh renders this file with envsubst into
# /tmp/geolens-nginx/default.conf at container start. Exactly five shell
# variables are substituted — API_UPSTREAM, NGINX_RESOLVER,
# CLIENT_MAX_BODY_SIZE, TRUSTED_PROXY_CONFIG, CSP_SCRIPT_SRC_EXTRA (defaults:
# http://api:8000 / the container's own resolv.conf nameserver / 500m / a
# pass-through map / empty — see the entrypoint); every other `$name` below is
# an nginx runtime variable and passes through untouched. Do not add new `${...}` placeholders without
# extending the envsubst allowlist in docker-entrypoint.sh — and never write
# an allowlisted name with a `$` prefix in comments: envsubst substitutes
# inside comments too, and a multi-line value would break the rendered config.
proxy_cache_path /var/cache/nginx/raster_cache levels=1:2 keys_zone=raster_cache:10m max_size=1g inactive=1h use_temp_path=off;

# A single Mapbox/MapLibre map view loads ~12 tiles, and tilted multi-layer
# 3D raster views can cold-start with 50-100+ tile
# requests across DEM + hillshade sources, so keep the burst budget above
# that initial fan-out while the steady-state rate still limits sustained abuse.
limit_req_zone $binary_remote_addr zone=raster_anon:10m rate=600r/m;

# A typical view (1-5 layers x about 12-20 tiles) stays under 120 and loads
# undelayed. A 20-layer cold start gets its excess paced at 90/s. Tile cost
# varies by dataset, so the API also caps concurrent uncached renders.
limit_req_zone $geolens_vector_limit_key zone=vector_anon:10m rate=5400r/m;

# Derive the logged path from nginx's immutable original request URI, then strip
# its query before logging. This preserves the public /api/ route even after the
# proxy rewrite while keeping api_key, embed-token, and verification-token query
# values out of logs. Capability path segments are redacted as well. Referrers
# are omitted because same-origin navigation can carry a credential URL.
map $request_uri $geolens_log_path_without_args {
    default /;
    "~^(?<geolens_original_path>[^?]*)" $geolens_original_path;
}
map $geolens_log_path_without_args $geolens_safe_log_path {
    default $geolens_log_path_without_args;
    "~^/m/[^/]+" /m/[REDACTED];
    "~^/api/maps/shared/[^/]+(?<geolens_shared_suffix>/.*)?$" /api/maps/shared/[REDACTED]$geolens_shared_suffix;
}
log_format geolens_safe '$remote_addr - $remote_user [$time_local] '
                        'request_id=$request_id '
                        '"$request_method $geolens_safe_log_path $server_protocol" '
                        '$status $body_bytes_sent "$http_user_agent" '
                        'rt=$request_time urt=$upstream_response_time';

# Proxied api routes may set their own Referrer-Policy (the OAuth callback
# sends no-referrer so the authorization code never leaves in a Referer). That
# value replaces the default instead of being appended to it; the upstream
# copy is hidden on those locations so exactly one header is sent.
map $upstream_http_referrer_policy $geolens_referrer_policy {
    ""      "strict-origin-when-cross-origin";
    default $upstream_http_referrer_policy;
}

# CORS allow-origin for the dataset export/COG byte routes. The api echoes an
# explicit origin (plus Allow-Credentials) when the caller's Origin is listed
# in CORS_ALLOWED_ORIGINS; re-emitting exactly that value keeps credentialed
# configured-origin fetches working — browsers reject a wildcard whenever the
# request's credentials mode is include. When the api declared no policy
# (anonymous, or an unlisted origin), fall back to the static wildcard: auth on
# these routes is bearer-token/api-key and authz is enforced server-side
# regardless of origin.
map $upstream_http_access_control_allow_origin $geolens_export_acao {
    ""      "*";
    default $upstream_http_access_control_allow_origin;
}

# Link-preview crawlers don't run JavaScript, so on a map or story page they
# only see the SPA shell's site-wide tags. Their requests go to the api's
# per-page tags instead; everyone else gets the shell exactly as from
# `location /`.
map $http_user_agent $geolens_preview_page_uri {
    default /index.html;
    "~*(slackbot|twitterbot|facebookexternalhit|facebot|discordbot|linkedinbot|telegrambot|whatsapp|skypeuripreview|microsoftpreview|mastodon|redditbot|embedly)" /_link_preview$uri;
}

# The raster tile proxy_cache_key includes pmin/pmax/sigma, so
# `?stretch=minmax&pmin=<random>` would otherwise mint a fresh key holding
# bytes byte-identical to the unfiltered tile. In backend/app/processing/tiles/
# router.py, stretch=percentile is the only mode that reads pmin/pmax
# (_compute_stretch_rescale) and stretch=stddev is the only mode that reads
# sigma; stretch=minmax (the default) or an absent stretch reads neither.
#
# raster_tile_proxy IGNORES pmin/pmax when stretch is not percentile and sigma
# when it is not stddev, instead of merely leaving them unvalidated, so
# "inactive" means the same thing, ignored, on both sides. That is necessary
# but not sufficient, because nginx's read of a query string and the API's can
# disagree in ways that have nothing to do with what the API validates:
#   - percent-encoding: `stretch=%70ercentile` decodes to the ACTIVE spelling
#     at the API (FastAPI URL-decodes query params) but nginx's raw
#     $arg_stretch never matches `percentile` literally, so calling that
#     "not the active spelling, therefore inactive" blanks pmin and collapses
#     two requests that render DIFFERENT bytes (different pmin) onto one key.
#   - a case variant, for the same reason.
#   - a malformed float (`pmin=abc`): the API's "ignore when inactive" code in
#     raster_tile_proxy never runs for this, because FastAPI's
#     `pmin: float | None` coerces the query param to a float BEFORE the
#     endpoint body executes, and "abc" fails that coercion with a 422
#     regardless of stretch. Blanking it lets a cached 200 answer a request
#     the API 422s uncached.
#
# nginx's $arg_NAME lookup is case-INSENSITIVE on the NAME (nginx's arg
# matcher, ngx_http_arg -> ngx_strlcasestrn), so `$arg_stretch` resolves from
# `Stretch=`, `STRETCH=`, etc. FastAPI's query-param binding is exact-case, so
# `?Stretch=minmax&stretch=percentile&pmin=5` has nginx read stretch=minmax
# (the first case-insensitive match, "inactive", blank pmin) while the API
# reads stretch=percentile (the only EXACT-case match, active, uses pmin=5)
# -- a second request with a different pmin collapses onto the same key
# while rendering different bytes.
#
# Rather than patching individual cases, blanking is allowed ONLY when $args
# is in STRICT CANONICAL FORM --
#   1. each of stretch/pmin/pmax/sigma appears AT MOST ONCE, checked
#      CASE-INSENSITIVELY (a mixed-case duplicate is still a duplicate);
#   2. every occurrence of each of those four names is spelled EXACTLY
#      lowercase -- a single mixed-case occurrence (no duplicate at all) is
#      ALSO non-canonical, because FastAPI ignores it entirely (exact-case
#      lookup) while nginx's case-insensitive lookup still resolves it;
#   3. none of the four names is percent-encoded (`%73tretch`) -- nginx never
#      decodes $arg_* keys before matching, FastAPI always does;
#   4. each of pmin/pmax/sigma's VALUE, if present, is an exact,
#      undecorated float literal -- see the value-grammar note below;
#   5. none of the four names appears BARE (no `=` at all) -- see rule 5 in
#      the name map.
# $geolens_raster_noncanonical below is 1 if ANY of those five is violated
# anywhere in $args, checked directly against the raw query string (or, for
# rule 4, the raw $arg_pmin/$arg_pmax/$arg_sigma) rather than derived from
# any decoded value, so it cannot inherit nginx's own case-insensitivity or
# decoding blind spots.
#
# Percent-encoding matters in a parameter VALUE as well as its NAME. nginx
# never decodes $arg_pmin /
# $arg_pmax / $arg_sigma either, so `pmin=%31`, `pmin=+1`, and `pmin=%201`
# each reach this config as their own distinct literal bytes ("%31", "+1",
# "%201") while FastAPI's query-param decoding turns every one of them into
# an ordinary, VALID float: %-decoding makes "%31" and "%201" into "1" and "
# 1"; Starlette's query-string unescaping (independently of %-decoding)
# turns a raw `+` into a space, so "+1" also becomes " 1" -- and Python's
# float() strips leading whitespace, so all three parse as 1.0. The request
# is served and cached (200) under whichever of those literal spellings the
# client happened to send, so N encodings of the same float mint N distinct
# one-hour cache entries for one identical tile -- the same amplification
# vector as an encoded NAME.
#
# Do not try to decode the value here: even a hand-rolled %-decode would
# still have to special-case Starlette's `+` -> space rule, which holds only
# for query strings and not, say, path segments, and reimplementing
# FastAPI's decoder in a `map` regex is its own bug surface. Fail toward
# non-canonical instead: $geolens_raster_noncanonical_value below is 1
# unless pmin, pmax, and sigma are each either empty or match the exact
# float grammar FastAPI/pydantic accepts -- `-?[0-9]+(\.[0-9]+)?([eE]-?[0-9]+)?`,
# no `%`, no `+`, no whitespace, since a raw `+` can never itself be part of
# a canonical float (it always decodes to a space first). This is a gate on
# the whole request rather than a per-value blank/keep choice -- deliberately not
# folded into the three per-parameter maps below, because those only ever
# decide ONE value's fallback, while an out-of-grammar pmin/pmax/sigma has
# to make the ENTIRE request non-canonical the same way an out-of-grammar
# NAME already does, so it can reach $geolens_raster_noncanonical and the
# proxy_cache_bypass/proxy_no_cache condition it drives.
#
# $geolens_raster_noncanonical is the OR of the name-based and value-based
# checks, combined below rather than checked in one map, because nginx's
# `map` has no boolean operators and the two checks read different source
# variables ($args for names, $arg_pmin:$arg_pmax:$arg_sigma for values).
# When non-canonical, EVERY map below falls back to keeping the matching
# per-parameter value raw. $geolens_raster_noncanonical is ALSO used directly
# below, in the raster-tiles location, as a proxy_cache_bypass /
# proxy_no_cache condition. Folding the ENTIRE raw $args into the cache key
# for the non-canonical case would close the collision but leak credentials:
# this endpoint accepts the deprecated ?api_key= query lane
# (_resolve_api_key, auth/dependencies.py), so a non-canonical request
# carrying one would write that credential, in the clear, into proxy_cache_key --
# reachable through raster_cache's on-disk files and any backup of them,
# even though access logging already strips query strings for exactly this
# reason. proxy_cache_key must only ever be built from the sanitised
# $geolens_raster_* variables and the enumerated version/render names
# $arg_v, $arg_pv, $arg_colormap_name and $arg_stretch, none of which can
# name a credential (never raw $args, never an unenumerated $arg_*), so a
# non-canonical request is instead served UNCACHED: bypass skips the
# lookup, no_cache skips the store, and nothing about that request's
# arguments -- credential included -- is ever written anywhere. The
# per-parameter fallback above still matters independently: it is what
# keeps two DIFFERENT non-canonical requests from colliding on the ordinary
# render params in case bypass/no_cache is ever misconfigured off this
# location, defense in depth rather than the only thing standing between a
# duplicated/mixed-case stretch and a wrong tile.
#
# The case-variant patterns are mechanical: one alternative per letter
# position, that position forced to its single uppercase form and every
# other position a same-letter [aA]-style class, so the alternation matches
# a spelling with at least one wrong-case letter and matches nothing when
# every letter is already lowercase. Generated, not hand-tuned; regenerate
# with the equivalent of:
#   "".join(ch.upper() if j==i else f"[{ch}{ch.upper()}]" for j,ch in enumerate(word))
#   for i in range(len(word)), joined with "|", for each of the four words.
map $args $geolens_raster_noncanonical_name {
    default 0;
    # 1. case-insensitive duplicate of any of the four names.
    "~*(?:^|&)stretch=.*(?:^|&)stretch=" 1;
    "~*(?:^|&)pmin=.*(?:^|&)pmin=" 1;
    "~*(?:^|&)pmax=.*(?:^|&)pmax=" 1;
    "~*(?:^|&)sigma=.*(?:^|&)sigma=" 1;
    # 2. a non-lowercase spelling of any of the four names, anywhere -- see
    #    the generator note above.
    "~(?:^|&)(?:S[tT][rR][eE][tT][cC][hH]|[sS]T[rR][eE][tT][cC][hH]|[sS][tT]R[eE][tT][cC][hH]|[sS][tT][rR]E[tT][cC][hH]|[sS][tT][rR][eE]T[cC][hH]|[sS][tT][rR][eE][tT]C[hH]|[sS][tT][rR][eE][tT][cC]H)=" 1;
    "~(?:^|&)(?:P[mM][iI][nN]|[pP]M[iI][nN]|[pP][mM]I[nN]|[pP][mM][iI]N)=" 1;
    "~(?:^|&)(?:P[mM][aA][xX]|[pP]M[aA][xX]|[pP][mM]A[xX]|[pP][mM][aA]X)=" 1;
    "~(?:^|&)(?:S[iI][gG][mM][aA]|[sS]I[gG][mM][aA]|[sS][iI]G[mM][aA]|[sS][iI][gG]M[aA]|[sS][iI][gG][mM]A)=" 1;
    # 3. a percent-encoded key anywhere -- broader than just the four names
    #    (any encoded key fails safe), because enumerating every encoding of
    #    every letter of every name is the same unbounded-alternatives
    #    problem in a different disguise.
    "~(?:^|&)[^&=]*%[^&=]*=" 1;
    # 5. a BARE occurrence (no `=`) of any of the four
    #    names, anywhere. nginx's arg matcher (ngx_http_arg) requires an `=`
    #    immediately after the name to resolve $arg_x at all -- a bare name
    #    is invisible to $arg_x the exact same way an ABSENT one is. But
    #    Starlette parses a query string with keep_blank_values=True, so a
    #    bare `pmin` is a real ("pmin", "") pair, not nothing: for
    #    `pmin=5&pmin`, the scalar Query dependency reads the LAST
    #    occurrence and gets `""`, which pydantic's float coercion 422s on,
    #    unconditionally, before the "ignore when inactive" logic ever
    #    runs. nginx
    #    meanwhile still resolves $arg_pmin to the well-formed "5" from the
    #    EARLIER `pmin=5` (its arg scan simply never matches the bare
    #    occurrence and keeps looking), so a request that 422s cold reads
    #    as perfectly canonical and cacheable to every check above -- warm
    #    200, cold 422.
    #
    #    One check per name, rather than a literal occurrence COUNT, is
    #    sufficient: a bare occurrence combined with zero other occurrences
    #    of the name is the single-bare-occurrence case (still 422s at
    #    FastAPI, since "the last occurrence" is that one bare pair); a bare
    #    occurrence combined with one-or-more "name=" occurrences elsewhere
    #    is already >= 2 total occurrences of the name, which is the same
    #    "must appear at most once" property rule 1 already polices, just
    #    with one of the copies unquoted. So "does a bare occurrence exist
    #    AT ALL" fully covers both shapes without counting anything.
    "~*(?:^|&)stretch(?:&|$)" 1;
    "~*(?:^|&)pmin(?:&|$)" 1;
    "~*(?:^|&)pmax(?:&|$)" 1;
    "~*(?:^|&)sigma(?:&|$)" 1;
}
# Rule 4 above. $arg_pmin /
# $arg_pmax / $arg_sigma are nginx's own case-insensitive-by-name, never
# decoded lookups, joined into one string so a single map covers all three;
# the ":" delimiter cannot be spoofed into a false negative, because a value
# containing a raw ":" fails the anchored per-field grammar below and falls
# through to the catch-all `default 1` the same as any other malformed
# value -- fails toward non-canonical, never toward canonical.
#
# The grammar below matches `1e309` -- syntactically a
# perfectly good float literal, and CANONICAL by this map's own rules, even
# though FastAPI's float coercion turns it into `inf` (`1.7976931348623157e+308`
# is the largest finite double; anything larger overflows to +/-inf). This
# map does not, and must not try to, reject that: nginx has no way to
# distinguish a finite float from one that overflows to inf/nan at the
# API's coercion step, and hand-rolling that distinction in a regex is its
# own bug surface, the same reasoning that keeps this file from attempting
# %-decoding above. Non-finite values are the API's problem to reject --
# raster_tile_proxy in backend/app/processing/tiles/router.py resolves
# eff_pmin/eff_pmax/eff_sigma from the SAME active/inactive test this file
# assumes, and requires math.isfinite() on the ACTIVE path before either
# ever reaches Titiler, so a canonical-by-nginx `1e309` still 422s when
# active and is never read by anything (not even to blank/keep the cache
# key) when inactive.
map "$arg_pmin:$arg_pmax:$arg_sigma" $geolens_raster_noncanonical_value {
    "~*^(?:-?[0-9]+(?:\.[0-9]+)?(?:[eE]-?[0-9]+)?)?:(?:-?[0-9]+(?:\.[0-9]+)?(?:[eE]-?[0-9]+)?)?:(?:-?[0-9]+(?:\.[0-9]+)?(?:[eE]-?[0-9]+)?)?$" 0;
    default 1;
}
# The OR of the two checks above -- either one alone
# setting the request non-canonical is enough to set this. "0:0" is the only
# combination that must resolve to 0; every other combination contains a
# literal "1", so a single substring match suffices.
map "$geolens_raster_noncanonical_name:$geolens_raster_noncanonical_value" $geolens_raster_noncanonical {
    "~1" 1;
    default 0;
}
# The three maps below blank a value the active stretch mode does not read.
# Range is irrelevant for an inactive parameter, because the API ignores it
# without applying the range check: under stretch=minmax the API ignores pmin
# regardless of its value, so limiting the blank to in-range values would
# leave every out-of-range-but-syntactically-valid one (101, -5, ...) RAW and
# let an anonymous caller mint a distinct one-hour cache entry per value, all
# holding the identical tile.
#
# The only thing that has to stay RAW is a value FastAPI cannot parse as a
# float AT ALL -- that hits the framework's own type-coercion 422 before
# raster_tile_proxy's body runs, regardless of stretch mode. So the
# well-formedness check below mirrors FastAPI's float GRAMMAR, not its
# semantic range: optional sign, digits, an optional decimal point, and an
# optional exponent -- the same shape as Python's float() literal syntax,
# which is what pydantic's query-param coercion accepts. Deliberately NOT
# extended to Python-only extensions (underscores as digit separators,
# "inf"/"nan" literals) this simulation cannot verify pydantic accepts from a
# query string; failing toward RAW for those keeps the "keep raw when
# uncertain" rule intact at the cost of a rare extra cache miss, never a
# collision or a status mismatch.
map "$geolens_raster_noncanonical:$arg_stretch:$arg_pmin" $geolens_raster_pmin {
    "~^0:(minmax|stddev|):[+-]?(?:[0-9]+\.?[0-9]*|\.[0-9]+)(?:[eE][+-]?[0-9]+)?$" "";
    default $arg_pmin;
}
map "$geolens_raster_noncanonical:$arg_stretch:$arg_pmax" $geolens_raster_pmax {
    "~^0:(minmax|stddev|):[+-]?(?:[0-9]+\.?[0-9]*|\.[0-9]+)(?:[eE][+-]?[0-9]+)?$" "";
    default $arg_pmax;
}
map "$geolens_raster_noncanonical:$arg_stretch:$arg_sigma" $geolens_raster_sigma {
    "~^0:(minmax|percentile|):[+-]?(?:[0-9]+\.?[0-9]*|\.[0-9]+)(?:[eE][+-]?[0-9]+)?$" "";
    default $arg_sigma;
}

# The entrypoint trusts forwarding headers only from TRUSTED_PROXY_CIDRS.
# It enables vector per-client limiting only after realip restores an address,
# preventing a host proxy from putting all visitors in one rate-limit bucket.
${TRUSTED_PROXY_CONFIG}

server {
    listen 8080;
    # Emit relative Location headers for nginx's own redirects. The
    # `location /api/` block below is a slash-terminated prefix with proxy_pass,
    # so nginx answers a request for the bare `/api` with a 301 to `/api/`; with
    # the default absolute_redirect it spells that as
    # `http://<host>:8080/api/` (the plain-HTTP scheme and the container port
    # this server listens on, not the public https origin the TLS edge
    # terminates), which lands clients on an unreachable URL. A relative
    # `Location: /api/` resolves against the origin the client actually used.
    absolute_redirect off;
    # The entrypoint materializes the immutable SPA and runtime env config in
    # tmpfs so the production container can keep its root filesystem read-only.
    root /tmp/geolens-html;
    index index.html;

    # Keep one capability-safe format at server scope so every location,
    # including /api/ and the /m/ embed shell, inherits it.
    access_log /var/log/nginx/access.log geolens_safe;

    # MIME type handling — defense-in-depth (base image http{} also configures this).
    # `default_type application/octet-stream` makes browsers download unknown files
    # rather than render them as text/plain (mitigates content-sniffing surprises).
    # `include /etc/nginx/mime.types` registers .css → text/css, .js → application/javascript, etc.
    # The types {} block adds modern types not in the default mime.types.
    default_type application/octet-stream;
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        application/manifest+json webmanifest;
    }
    # The static .txt files (llms.txt, the license notices) are UTF-8; without
    # a charset browsers decode them as Windows-1252.
    charset utf-8;
    charset_types text/plain;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy $geolens_referrer_policy always;
    # Suppress nginx version disclosure in
    # Server: response header and default error pages. Prevents remote scanners
    # from fingerprinting the exact nginx minor version for exploit targeting.
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/geo+json
        image/svg+xml;

    location = /env-config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # add_header disables inheritance of the server-scope security set.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # The embed snippet frames /m/ with sandbox="allow-scripts"
        # and no allow-same-origin, which gives the frame an OPAQUE origin. The
        # shell loads the app as <script type="module" crossorigin>, so that
        # fetch is CORS-mode and now cross-origin (Origin: null) — with no
        # Access-Control-Allow-Origin the browser refuses it and the app never
        # boots. These are public, immutable, credential-free build artifacts,
        # so the static "*" protects nothing by being absent. Static, never a
        # reflected $http_origin: the responses are cached (browser `immutable`,
        # and a CDN in front) and a per-origin value would be replayed.
        add_header Access-Control-Allow-Origin "*" always;
        # add_header disables inheritance of the server-scope set, so re-declare
        # the security headers this block would otherwise drop. Same rule
        # @empty_tile, `location /` and `location ~ ^/m/` already follow.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Bundled map label glyphs. A range that is not shipped (ideographs and
    # Hangul, which the browser draws locally) must answer 404, not the SPA
    # shell, or MapLibre would try to parse HTML as a glyph PBF. The files are
    # unhashed, so cache for a week rather than marking them immutable.
    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        # Sandboxed embed frames have an opaque origin and external style
        # consumers are cross-origin, so the CORS-mode glyph fetch needs this.
        add_header Access-Control-Allow-Origin "*" always;
        # add_header disables inheritance of the server-scope security set.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~ ^/raster-tiles/(?<dataset_id>[0-9a-f-]+)/tiles/(?<z>\d+)/(?<x>\d+)/(?<y>\d+)\.(?<fmt>[a-z]+)$ {
        limit_req zone=raster_anon burst=200 nodelay;
        limit_req_status 429;
        error_page 429 = @tile_rate_limited;

        # Forward to the api-side raster proxy (`/tiles/raster-proxy/...`).
        # The api enforces RBAC, resolves the COG open-path, and proxies to
        # Titiler with the correct render params. This avoids the
        # variable-interpolation pitfalls of `proxy_pass $upstream/path?query`
        # inside a regex location (nginx 1.29 silently drops the query
        # string in that case, so Titiler sees `?url=&` and 500s).
        resolver ${NGINX_RESOLVER} valid=10s;
        set $upstream_api ${API_UPSTREAM};
        rewrite ^.*$ /tiles/raster-proxy/$dataset_id/$z/$x/$y.$fmt$is_args$args break;
        proxy_pass $upstream_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # OVERWRITE (not append) — the leftmost XFF is client-supplied,
        # so appending would let callers forge the address uvicorn trusts (rate-limit
        # bypass + forged audit IPs). $remote_addr is the real socket peer at this
        # internet-facing edge.
        # OPERATOR NOTE (applies to every X-Forwarded-For line in this file): if
        # you front GeoLens with ANOTHER trusted proxy/CDN (Cloudflare, an LB),
        # $remote_addr is that proxy — rate limits and audit logs will see its IP
        # for all traffic. Use ngx_http_realip_module (set_real_ip_from + a
        # real_ip_header your edge sets) to restore real client IPs; do NOT
        # revert to $proxy_add_x_forwarded_for.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $geolens_fwd_proto;

        # Pass through auth headers so the api can apply RBAC.
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Embed-Token $http_x_embed_token;

        # Upstream 404s reach the client. There is no `proxy_intercept_errors`
        # / `error_page 404` mapping to @empty_tile here: the api answers 204
        # itself for a tile outside the raster's extent, so such a mapping would
        # only catch genuine 404s ("no such dataset" and the `No raster asset`
        # path in processing/tiles/router.py) and turn them into a 204 —
        # byte-identical to a correct empty tile — rendering a typo'd dataset id
        # as a blank map with nothing to report, while /api/tiles/raster-proxy/
        # answers 404 for the same request. Measured against the api:
        # in-footprint 200, out-of-extent 204, missing dataset 404,
        # private-and-anonymous 404. The add_header set below is `always`, so
        # every one of those carries the CORS header without an internal
        # redirect.

        # Tile cache — keyed on dataset/zxy. The api enforces auth on cache
        # MISS, so cache HITS for the same tile across users are safe for
        # public datasets. Private datasets get distinct cache keys via the
        # api setting Cache-Control on its response (`no-store` for private).
        proxy_cache raster_cache;
        # Cache key must vary by EVERY render param the api forwards to Titiler,
        # else tiles with different bounds collide: include
        # colormap_name/stretch, plus pmin/pmax/sigma through the $geolens_raster_*
        # maps declared above (those maps blank the args a request's stretch
        # mode does not read, so an anonymous caller cannot defeat the cache by
        # randomizing an arg that never touches the rendered bytes).
        # The key is built ONLY from these sanitised variables and the
        # enumerated names below -- it must never include
        # raw $args or an unenumerated $arg_*, because this route accepts
        # credentials on the query string (?api_key=, the deprecated lane
        # _resolve_api_key still honours) and a raw value would write that
        # credential into the cache key, reachable through raster_cache's
        # on-disk files and any backup of them.
        # $arg_v is the dataset's tile_cache_version, emitted by the
        # api in every raster tile URL — a raster replace bumps it, so the
        # shared cache rolls immediately instead of serving pre-replace bytes
        # for up to proxy_cache_valid. Unversioned clients (copied connect
        # URLs) key on the empty segment and keep the bounded staleness.
        # $arg_pv is the dataset's publication_version, in every
        # tile URL the api emits. A status or visibility transition rolls it,
        # so an emitted URL stops reading an entry stored before the change.
        proxy_cache_key "$dataset_id/$z/$x/$y.$fmt/$arg_v/$arg_pv/$arg_colormap_name/$arg_stretch/$geolens_raster_pmin/$geolens_raster_pmax/$geolens_raster_sigma";
        # A non-canonical request (see the maps declared
        # near the top of this file) is served UNCACHED rather than keyed on
        # anything derived from its raw $args -- bypass skips the lookup,
        # no_cache skips the store, so neither a lookup nor a write ever touches
        # $geolens_raster_noncanonical's own raw request, credential included.
        # $geolens_raster_noncanonical is "0"/"1"; nginx treats "0" as falsy for
        # both directives, so the ordinary canonical path is unaffected.
        proxy_cache_bypass $geolens_raster_noncanonical;
        proxy_no_cache $geolens_raster_noncanonical;
        proxy_cache_valid 200 1h;
        # No proxy_cache_use_stale: a stale public tile replayed on an upstream
        # error would outlive the api's s-maxage after its dataset goes private.
        # The lock lets one request refill an expired entry while the rest wait.
        proxy_cache_lock on;
        # Honor the api's Cache-Control: nginx skips caching when the api
        # sets `no-store` (private dataset).
        #
        # `Vary` joins that list, and is hidden from the client:
        # The api's CORS middleware sends `Vary: Origin` on every response it
        # touches, and nginx keys a cache entry on the upstream
        # `Vary`, so raster_cache would keep one copy of the same tile bytes
        # per distinct Origin request header and every site embedding a map
        # would warm its own set of tiles. Nothing here varies by origin: the
        # CORS value below is the static `*` for every caller.
        #
        # Both halves are needed. proxy_hide_header alone changes what the
        # client is told, not what nginx stores under; measured, hide-only
        # still answered a second origin with a MISS and a second upstream
        # fetch. Ignoring alone would advertise a variance this route does not
        # serve. Accept-Encoding is the only other token the api could add, and
        # it does not add it here: starlette's GZipMiddleware skips the Vary
        # for excluded media types and every raster tile type is excluded
        # (png/webp/jpeg by default, tiff added explicitly). nginx does not compress
        # image tiles either, since gzip_types above lists no image type but
        # svg.
        #
        # ONE directive listing every field. Two at the same level do
        # accumulate, but a location's directive REPLACES the value inherited
        # from http/server scope rather than merging with it, so this line is
        # the complete set for this block and reads better as one.
        proxy_ignore_headers Set-Cookie Vary;
        proxy_hide_header Vary;

        add_header X-Cache-Status $upstream_cache_status always;

        # canvas/WebGL map clients FETCH raster tiles, so they need
        # CORS, and this route never reaches the api's CORS handling — it is
        # rewritten to /tiles/raster-proxy/, whose handler returns only
        # Cache-Control. (The MVT handlers emit their own wildcard in
        # processing/tiles/responses.py, which is why vector tiles already work.)
        # Three constraints hold this shape:
        #   - STATIC "*", never a reflected $http_origin. The response is stored
        #     by raster_cache above and, on the demo, a Cloudflare tile cache
        #     rule, so a per-origin value would be replayed to other origins.
        #   - `always`, so the api's error responses carry it and stay readable
        #     instead of surfacing as an opaque CORS error.
        #   - proxy_hide_header, because add_header APPENDS: if the upstream ever
        #     starts emitting its own wildcard the client would see two values,
        #     which browsers reject outright.
        # Tile auth rides query params rather than cookies, so no
        # Allow-Credentials is involved.
        proxy_hide_header Access-Control-Allow-Origin;
        # The api emits X-Frame-Options: DENY; hide it so only the restated value below is sent.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        add_header Access-Control-Allow-Origin "*" always;
        # add_header disables inheritance of the server-scope security set.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy $geolens_referrer_policy always;
    }

    # /metrics is unauthenticated by design and scraped internally on
    # the api container port. Block it from the public edge so it is not reachable
    # via the /api/metrics -> /metrics rewrite (endpoint/traffic-telemetry inventory).
    # Prometheus scrapes http://api:8000/metrics directly, not through nginx.
    location = /api/metrics {
        return 404;
    }

    # Internal API routes serve other services, such as Titiler reading remote
    # rasters through the relay, and are never reached from the public edge.
    location ^~ /api/internal/ {
        return 404;
    }

    location /api/ {
        resolver ${NGINX_RESOLVER} valid=10s;
        set $upstream_api ${API_UPSTREAM};
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $upstream_api;
        # Forward request bodies as they arrive so the frontend does not keep
        # a second full copy in its bounded /tmp.
        proxy_http_version 1.1;
        proxy_request_buffering off;
        # The FastAPI SecurityHeadersMiddleware already emits
        # X-Frame-Options: DENY. This block has no add_header, so it inherits the
        # server-scope `add_header X-Frame-Options SAMEORIGIN`, which nginx APPENDS
        # to the proxied DENY -> two conflicting X-Frame-Options on every /api
        # response. Strip the upstream header so exactly one (the inherited
        # SAMEORIGIN) survives. The backend still emits DENY for direct,
        # non-proxied access (defense-in-depth when nginx isn't in front).
        proxy_hide_header X-Frame-Options;
        # The same applies to the pair the server scope also sets.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # OVERWRITE (not append) — the leftmost XFF is client-supplied,
        # so appending would let callers forge the address uvicorn trusts (rate-limit
        # bypass + forged audit IPs). $remote_addr is the real socket peer at this
        # internet-facing edge.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $geolens_fwd_proto;
        proxy_set_header X-Accel-Buffering no;
        proxy_buffering off;
        proxy_cache off;
        # Tracks the backend's UPLOAD_MAX_SIZE_MB (default 500m) —
        # a fixed 500m would reject larger configured uploads here with 413
        # before FastAPI ever saw them.
        client_max_body_size ${CLIENT_MAX_BODY_SIZE};
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 30s;

        # The raster tile budget must not depend on URL spelling. The
        # `/raster-tiles/...` location above rewrites to `/tiles/raster-proxy/`
        # and carries `limit_req`, but the same handler is reachable as
        # `/api/tiles/raster-proxy/...`: this block rewrites `^/api/(.*)` to
        # `/$1` and proxies it to the api, which serves the route with no limit
        # of its own. Every tile URL the product mints uses the throttled
        # spelling, so without a limit here only well-behaved clients would be
        # governed. Same zone, same burst, so the
        # two spellings draw on ONE per-IP bucket rather than two: a caller who
        # switches spelling mid-flood gets no fresh allowance.
        #
        # Done here rather than by dropping the handler's `@limiter.exempt`,
        # because the app's global default is a general-purpose per-second cap
        # and this route is not general-purpose traffic. The zone above is
        # sized for tiles (600r/m with burst 200, for the 50-100+ request cold
        # start of a tilted multi-layer 3D view); the app default would 429 the
        # tail of exactly that fan-out, including the part of it nginx forwards
        # on a raster_cache MISS. Cached serving is untouched either way: a
        # raster_cache HIT never reaches the api, and this block already runs
        # with `proxy_cache off`, so this adds no cache behaviour.
        #
        # Nested, so the proxy settings above are inherited rather than copied
        # and left to drift. `proxy_pass`, `rewrite` and `set` are the three
        # nginx does not inherit into a nested location, so they are restated
        # (same shape as the export block below). No `add_header` and no
        # `proxy_hide_header` here: declaring either would disable inheritance
        # of the set this block already applies.
        location ~ ^/api/tiles/raster-proxy/ {
            limit_req zone=raster_anon burst=200 nodelay;
            limit_req_status 429;
            error_page 429 = @tile_rate_limited;

            set $upstream_api ${API_UPSTREAM};
            rewrite ^/api/(.*) /$1 break;
            proxy_pass $upstream_api;
        }

        # Vector and cluster tile routes. set, rewrite and proxy_pass are restated as
        # in the raster block above; add_header or proxy_hide_header here would drop the inherited set.
        location ~ ^/api/tiles/(?:clusters/)?data\. {
            limit_req zone=vector_anon burst=720 delay=120;
            # nginx's default 503 for this carries no CORS header; 429 does,
            # via @tile_rate_limited below.
            limit_req_status 429;
            error_page 429 = @tile_rate_limited;

            set $upstream_api ${API_UPSTREAM};
            rewrite ^/api/(.*) /$1 break;
            proxy_pass $upstream_api;
        }

        # The routes that serve BYTE RANGES bound to a strong ETag must reach
        # the client exactly as the backend wrote them.
        #
        # nginx compresses a 200 but never a 206, and when it compresses it
        # rewrites the strong ETag to `W/"..."`. A client doing what
        # `Accept-Ranges: bytes` invites would get a gzipped 200 under a weak
        # validator and raw 206s under a strong one: two encodings of two different
        # byte sequences under one URL, and a weak validator that RFC 9110 13.1.5
        # says cannot authorize the resume in the first place.
        #
        # The app disables FastAPI's inner gzip for these paths already; that
        # never reached here, because nginx sees the client's original
        # Accept-Encoding and makes its own decision.
        #
        # Scoped by PATH, not by media type. `image/tiff` happens to be absent
        # from gzip_types today (verified, not assumed) and `application/geo+json`
        # is present, but which types are listed is exactly the thing that drifts,
        # and excluding a type app-wide once silenced compression on unrelated
        # routes that serve one representation. What does not drift is that these
        # routes serve ranges. A format added to the export route inherits this by
        # being under the path.
        #
        # Nested, so the proxy settings above are inherited rather than copied and
        # left to drift. `proxy_pass`, `rewrite` and `set` are the ones nginx does
        # not inherit into a nested location, so they are restated.
        # Anchored: these routes and nothing beneath them. An unanchored
        # prefix would hand `gzip off` to any future sub-route by accident,
        # and a route that does not serve ranges should keep compressing.
        location ~ ^/api/datasets/[^/]+/(export|download/cog|copc/[^/]+/[^/]+\.copc\.laz)/?$ {
            gzip off;

            # A browser page on another origin reads these byte routes, so
            # they need CORS: the pmtiles protocol's ranged reads need a
            # preflight answer and every read needs an allow-origin. The api's
            # own anonymous wildcard covers a public COPC file, never the
            # export or COG download.
            #
            # Split responsibility with the api: the api's
            # DynamicCORSMiddleware still answers whenever it has a policy —
            # an origin listed in CORS_ALLOWED_ORIGINS gets the credentialed
            # explicit-origin answer, preflight included — and the edge fills
            # only the gap the api refuses: the anonymous wildcard. That keeps
            # the api's method/header allow-lists authoritative instead of
            # mirroring them here and drifting. Any other preflight falls
            # through the middleware to a router that registers GET/HEAD only,
            # so it 405s; convert exactly that refusal into the wildcard
            # answer. A preflight the middleware answers 200, for a configured
            # origin or a COPC file's anonymous reader, passes through
            # untouched. Only 405 is listed, so
            # every other upstream status (401, 404, 416, ...) still reaches
            # the client as the api wrote it.
            proxy_intercept_errors on;
            error_page 405 = @export_cors_preflight;

            # proxy_hide_header, because add_header APPENDS and a response
            # carrying two allow-origin values is rejected by browsers
            # outright. The map at the top of this file re-emits the api's
            # explicit-origin answer when there is one (a credentialed
            # configured-origin fetch needs that exact origin, never "*") and
            # falls back to the static wildcard when the api declared no
            # policy. The api sends Vary: Origin on every response and
            # that passes through here, so caches in front key correctly.
            # Declaring proxy_hide_header at this level disables inheritance
            # of the outer block's `proxy_hide_header` set, so that set is
            # restated alongside.
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            add_header Access-Control-Allow-Origin $geolens_export_acao always;
            # Range clients need the range/validator response headers: a
            # header not named here is invisible to cross-origin JavaScript.
            add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length, ETag, Content-Disposition" always;
            # add_header disables inheritance of the server-scope security
            # set — restate it (same rule /assets/ and `location /` follow).
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy $geolens_referrer_policy always;

            set $upstream_api ${API_UPSTREAM};
            rewrite ^/api/(.*) /$1 break;
            proxy_pass $upstream_api;
        }
    }

    # Anonymous CORS preflight for the byte routes (export, COG and COPC).
    # Reached ONLY via error_page from the byte-route location above,
    # when the api answered 405 — i.e. the middleware recognized no origin and
    # the request fell through to a GET/HEAD router. A configured origin's
    # preflight never lands here; the middleware answers it upstream with the
    # credentialed policy.
    location @export_cors_preflight {
        if ($request_method = OPTIONS) {
            # The anonymous wildcard answer. add_header in an if-block
            # inherits nothing, so this is the complete set for the 204.
            # The allow list mirrors what these routes consume: Range plus
            # the conditional headers the COG download supports, and the
            # two token auth headers — a header-authenticated request is not
            # credentialed in the CORS sense, so it works under a wildcard.
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, If-Range, If-None-Match, If-Match, Authorization, X-Api-Key" always;
            # Matches the api's own preflight lifetime. A pmtiles client
            # issues many ranged reads against one URL; without this the
            # browser re-preflights every few seconds.
            add_header Access-Control-Max-Age "3600" always;
            return 204;
        }
        # A genuinely unsupported method (POST/PUT/... to a byte route):
        # re-emit the api's refusal. The intercepted body is gone, but the
        # intercepted response's headers survive as $upstream_http_*, so the
        # api's CORS policy is re-emitted rather than dropped (a bare 405
        # would be reported by the browser as an opaque CORS failure instead
        # of the api's refusal). The map hands back the middleware's explicit-origin echo
        # when there is one and the wildcard otherwise; credentials and
        # expose-headers come straight from the intercepted response, and
        # add_header skips a header whose value is empty, so an anonymous
        # refusal carries only the wildcard. Vary passes through for the
        # same cache-keying reason as the main location. Allow stays
        # hardcoded: the api's 405 advertises its own GET/HEAD router, but
        # OPTIONS is answered at this edge, so the api's value would
        # under-advertise the route's real surface.
        add_header Access-Control-Allow-Origin $geolens_export_acao always;
        add_header Access-Control-Allow-Credentials $upstream_http_access_control_allow_credentials always;
        add_header Access-Control-Expose-Headers $upstream_http_access_control_expose_headers always;
        add_header Vary $upstream_http_vary always;
        add_header Allow "GET, HEAD, OPTIONS" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 405;
    }

    # Reached via error_page when nginx itself rejects a tile request.
    # add_header disables inheritance, so the security headers are restated
    # the way @export_cors_preflight and location / do.
    location @tile_rate_limited {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Retry-After" always;
        add_header Retry-After "2" always;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 429;
    }

    # Per-token embed framing relies on the FastAPI
    # /api/maps/shared/{token} response emitting frame-ancestors CSP derived
    # from EmbedToken.allowed_origins. The SPA HTML at /m/{token} must NOT
    # inherit the global X-Frame-Options: SAMEORIGIN from the server scope,
    # because that header blocks the iframe-embed path before the API response
    # has a chance to communicate the per-token allowed_origins.
    #
    # Nginx semantics: any add_header in an inner location block DISABLES
    # inheritance of all add_header directives from the server scope. This
    # block re-declares the global headers we want to keep (X-Content-Type-Options,
    # Referrer-Policy) while intentionally omitting X-Frame-Options so the
    # browser does not preemptively reject the frame. X-Frame-Options is
    # intentionally absent — the FastAPI /api/maps/shared/{token} response
    # carries the frame-ancestors CSP instead.
    #
    # This regex location wins over the prefix `location /` because nginx
    # regex locations beat prefix locations unless the prefix uses `^~`.
    # The `location /` below uses no `^~`, so this `~ ^/m/` match wins
    # for /m/ and /m/<any-suffix> paths.
    #
    # The pattern is `~ ^/m/` rather than `~ ^/m/.+` so the bare /m/ path (no
    # token after the slash) also matches this block. Otherwise /m/ would fall
    # through to `location /` and pick up X-Frame-Options: SAMEORIGIN while
    # /m/<token> had none.
    #
    # Note: the server-scope `X-Frame-Options: SAMEORIGIN` on `location /`
    # is intentional — the SPA HTML at non-/m/ paths is not designed to be
    # framed, so SAMEORIGIN is the right policy there. Only /m/* paths are
    # expected to be embedded in cross-origin iframes (via the per-token
    # frame-ancestors CSP from the API response).
    # Enforce per-token frame-ancestors on the embed HTML shell itself, not
    # only on the tile/data calls, so a disallowed site cannot frame the
    # shell. An internal auth_request validates the token (last path segment) and
    # returns the frame-ancestors directive in X-Embed-Frame-Ancestors;
    # auth_request_set copies it into the CSP emitted on this static HTML
    # response. X-Frame-Options stays omitted ONLY here (see the comment above).
    location ~ ^/m/ {
        # The auth_request subrequest does NOT carry the parent's
        # query string, so $arg_et is empty inside /_embed_frame_policy. Capture
        # the real embed token (the `et` query param) into a `set` variable here —
        # subrequests share the parent request's `set` variables — and forward
        # THAT to the policy endpoint, so a domain-locked embed keeps its
        # restriction instead of being treated as an unrestricted/no-token case.
        set $embed_et $arg_et;
        auth_request /_embed_frame_policy;
        auth_request_set $embed_frame_ancestors $upstream_http_x_embed_frame_ancestors;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # X-Frame-Options intentionally omitted — see the comment above the location.
        # The per-token $embed_frame_ancestors below is the clickjacking policy:
        #   - domain-locked token  -> "frame-ancestors 'self' <origins>"
        #   - invalid/revoked token -> "frame-ancestors 'none'" (fail closed)
        #   - unrestricted Community token -> empty, leaving framing open
        #     (intentional; the trailing empty CSP directive is ignored by
        #     browsers per CSP3 and never emits frame-ancestors '*').
        # Same script/exfil backstop as `location /`.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'${CSP_SCRIPT_SRC_EXTRA}; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; ${embed_frame_ancestors}" always;
        # Serve the SPA shell in place — do NOT use `try_files $uri /index.html`.
        # That fallback internal-redirects to /index.html, which re-enters
        # `location /`; nginx then emits the FINAL location's add_header set,
        # silently DISCARDING this block's per-token frame-ancestors CSP and
        # re-adding `X-Frame-Options: SAMEORIGIN` — which blocks every
        # cross-origin embed (=404 does not help; found-file try_files still
        # re-matches).
        # `rewrite ^ ... break` rewrites the URI in place and STOPS location
        # re-matching, so this block's headers are the ones served. /m/* is never
        # a real static file, so a `$uri` existence check would be a no-op.
        # Same shell-revalidation rule as `location /` below.
        add_header Cache-Control "no-cache" always;
        rewrite ^ /index.html break;
    }

    # Internal subrequest target for the /m/ framing policy.
    # Validates the embed token captured by the `location ~ ^/m/` regex above and
    # returns X-Embed-Frame-Ancestors. The API endpoint always answers 200 (even
    # for an invalid token, which yields a fail-closed 'none' policy) so the
    # auth_request allows the shell to load.
    location = /_embed_frame_policy {
        internal;
        resolver ${NGINX_RESOLVER} valid=10s;
        set $upstream_api ${API_UPSTREAM};
        # The embed token lives in the `et` QUERY param of the
        # iframe URL (/m/<shareToken>?embed=true&et=<embedToken>), NOT the path
        # segment. Passing the path capture (the share token) would make the
        # policy endpoint hash a non-embed token, fail to match, and emit
        # 'none' for every normal share. Pass $arg_et so plain shares (no et) send an empty
        # token -> open framing, and restricted embeds send their real token.
        proxy_pass $upstream_api/embed/frame-policy?token=$embed_et;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # OVERWRITE (not append) — the leftmost XFF is client-supplied,
        # so appending would let callers forge the address uvicorn trusts (rate-limit
        # bypass + forged audit IPs). $remote_addr is the real socket peer at this
        # internet-facing edge.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $geolens_fwd_proto;
    }

    # A saved map's or a story's page. `rewrite ... last` re-runs location
    # matching, so a browser lands in `location /` with that block's headers.
    location ~* ^/(maps|stories)/[0-9a-f-]+/?$ {
        rewrite ^ $geolens_preview_page_uri last;
    }

    # Crawler requests for a map or story page. The api answers 404 for any
    # map or story an anonymous caller can't read, and that, like any api
    # failure, falls back to the SPA shell, so the crawler sees the site-wide
    # tags and the same 200 whether or not the page exists.
    location ^~ /_link_preview/ {
        internal;
        resolver ${NGINX_RESOLVER} valid=10s;
        set $upstream_api ${API_UPSTREAM};
        # Case-insensitive like the page location: the SPA router is too.
        rewrite "(?i)^/_link_preview/maps/([^/]+)" /maps/$1/link-preview? break;
        rewrite "(?i)^/_link_preview/stories/([^/]+)" /stories/$1/link-preview? break;
        proxy_pass $upstream_api;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # Credentials play no part in a preview; the api ignores them too.
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Api-Key "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $geolens_fwd_proto;
        # Same single-copy rule as `location /api/`: these come from the server scope.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_intercept_errors on;
        error_page 400 401 403 404 405 422 429 500 502 503 504 = /index.html;
    }

    location / {
        # Content-Security-Policy on the SPA HTML — defense-in-depth so a
        # future XSS cannot load injected/inline scripts to exfiltrate the in-memory
        # access token. script-src 'self' (+ wasm-unsafe-eval for WebAssembly)
        # blocks script injection; style-src 'unsafe-inline' is required by
        # React/MapLibre/Tailwind inline styles; img/connect/font/worker stay
        # permissive so map tiles, glyphs, workers and external sources still load.
        # Operators add script hosts through the extra script-src variable, for
        # example the Cloudflare Web Analytics beacon that Cloudflare injects at
        # the edge for a proxied site. It is empty by default.
        # Any add_header here disables inheritance, so the server-scope security
        # headers are re-declared.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'${CSP_SCRIPT_SRC_EXTRA}; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        # Without Cache-Control browsers cache the SPA shell heuristically and,
        # after a redeploy, ask for hashed /assets/* that the new image no
        # longer contains (404s). `no-cache` = revalidate every time, but
        # ETag/304 still applies, so the cost is one conditional GET.
        # Everything else served from here is unhashed too (favicon, og
        # images), so it wants the same rule.
        # /assets/* keeps `public, immutable` from its own location above.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
