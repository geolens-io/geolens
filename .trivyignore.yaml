# Trivy ignore policy (enforcing config + image scans in .github/workflows/dep-audit.yml and the
# release image scans in .github/workflows/publish.yml).
# Scoped, justified suppressions only. Everything not listed here is still enforced.
vulnerabilities:
  - id: CVE-2026-59873
    statement: >-
      node-tar Denial of Service via a crafted gzip bomb. Fixed upstream in
      tar 7.5.19, but no node:*-alpine image ships tar >= 7.5.19 yet (node
      26.5.0 bundles npm's tar 7.5.16), so no tag bump can clear it. node is a
      BUILD stage only (frontend-build in Dockerfile / frontend/Dockerfile.dev);
      the runtime image is nginx serving static files, so the vulnerable tar
      never reaches production, and the DoS requires feeding a crafted archive
      to `tar` — not a surface in our controlled build. Scoped to this single
      CVE. REMOVE once a node alpine base ships tar >= 7.5.19.
  - id: CVE-2026-111497
    purls:
      - "pkg:apk/alpine/brotli-libs@1.2.0-r1"
    expired_at: 2026-11-30
    statement: >-
      brotli out-of-bounds write, fixed in Alpine's brotli-libs 1.2.1-r0. The
      pinned nginxinc/nginx-unprivileged:1.31.7-alpine digest still ships
      1.2.0-r1 and upstream has not rebuilt it, so the upstream base scan
      fails on every PR. The frontend stage runs `apk upgrade --no-cache`,
      which installs 1.2.1-r0, so the shipped image never carries the
      vulnerable version. The purl names that version only, so a built image
      that somehow kept it, or any later version with this CVE, still fails.
      REMOVE when the nginx base pin moves to a rebuild with brotli-libs
      1.2.1-r0 or later.
misconfigurations:
  - id: AVD-DS-0002
    paths:
      - "db/Dockerfile"
    statement: >-
      PostGIS DB image. The official postgis/postgres entrypoint must start as
      root to run initdb and chown the data directory on first boot, then drops
      privileges to the unprivileged `postgres` user via gosu for the server
      process. A Dockerfile-level `USER postgres` would break first-boot
      initialization; the running database is non-root. Accepted as
      postgres-family by design. DS-0002 stays enforced on all other Dockerfiles.
secrets:
  - id: gcp-service-account
    paths:
      - "/app/.venv/lib/python3.*/site-packages/anthropic/**"
    statement: >-
      False positive in the Anthropic SDK. Since anthropic 1.15 the docstrings
      for the beta Managed Agents `execution_identity` field show the literal
      example `{"type": "service_account"}`, which matches the GCP
      service-account key rule. The files hold no key material. Scoped to this
      rule inside the anthropic package; the rule stays enforced everywhere else.
