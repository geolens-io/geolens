version: 2
# Dependency update automation. Covers all three JS surfaces (frontend, root
# e2e, SDK), the uv-managed Python backend, and every Dockerfile location.
# Reworked 2026-06-02 (dep-audit): switched backend from "pip" to "uv" so it
# reads backend/uv.lock; added root + sdks/typescript npm; fixed the docker
# directories to point at the actual Dockerfile locations (/, /db, /frontend).
# Every ecosystem has a `*-security` group (security updates) and a
# `*-minor-patch` group (version updates). A dependency joins the first group
# it matches, so the named groups above the generic ones keep their members.
updates:
  # --- Python backend (uv) ---
  - package-ecosystem: "uv"        # was "pip" — uv reads backend/uv.lock
    directory: "/backend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels: ["dependencies", "backend"]
    open-pull-requests-limit: 10
    groups:
      fastapi-ecosystem:
        patterns: ["fastapi", "uvicorn", "starlette", "pydantic*", "sse-starlette"]
      sqlalchemy-ecosystem:
        patterns: ["sqlalchemy*", "alembic", "asyncpg", "psycopg*"]
      geo-stack:
        patterns: ["geoalchemy2", "shapely", "pgvector", "rasterio"]
      backend-security:
        applies-to: security-updates
        patterns: ["*"]
      backend-minor-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]
      # Majors arrive as one reviewable PR. A blanket ignore would also hide
      # security fixes that ship only in a new major.
      backend-major:
        update-types: ["major"]
        patterns: ["*"]

  # --- Frontend React app (npm) ---
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels: ["dependencies", "frontend"]
    open-pull-requests-limit: 10
    groups:
      react-ecosystem:
        patterns: ["react", "react-dom", "@types/react*"]
      tanstack:
        patterns: ["@tanstack/*"]
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]
      frontend-minor-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]
    ignore:
      # eslint 10 is blocked on the jsx-a11y and react plugin peer ranges.
      # Remove this entry when #1836 is closed.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # --- Root E2E (Playwright) — was untracked ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels: ["dependencies", "e2e"]
    open-pull-requests-limit: 5
    groups:
      e2e-security:
        applies-to: security-updates
        patterns: ["*"]
      e2e-minor-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]

  # --- TypeScript SDK — was untracked ---
  - package-ecosystem: "npm"
    directory: "/sdks/typescript"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels: ["dependencies", "sdk"]
    open-pull-requests-limit: 5
    groups:
      sdk-security:
        applies-to: security-updates
        patterns: ["*"]
      sdk-minor-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]

  # --- GitHub Actions ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels: ["dependencies", "ci"]
    open-pull-requests-limit: 5
    groups:
      # init/autobuild/analyze must move together. CodeQL fails with
      # "CodeQL job status was configuration error" when init and analyze
      # resolve to different versions, so a per-action PR is red the moment
      # it opens, as happened for v3.37.4.
      codeql-action:
        patterns: ["github/codeql-action*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions-minor-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]

  # --- Docker images ---
  # Root multi-stage Dockerfile (python + node + nginx) — was MISSING; this is
  # the gap that left the root frontend-build node image untracked.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels: ["dependencies", "docker"]
    groups:
      docker-root-security:
        applies-to: security-updates
        patterns: ["*"]
      docker-root-minor-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]
  # DB image (postgis + pgvector build) — was MISSING.
  - package-ecosystem: "docker"
    directory: "/db"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels: ["dependencies", "docker"]
    groups:
      docker-db-security:
        applies-to: security-updates
        patterns: ["*"]
      docker-db-minor-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]
  # Frontend Vite dev-server image.
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels: ["dependencies", "docker"]
    groups:
      docker-frontend-security:
        applies-to: security-updates
        patterns: ["*"]
      docker-frontend-minor-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]

  # --- MCP server (uv) ---
  - package-ecosystem: "uv"
    directory: "/mcp"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels: ["dependencies", "backend"]
    open-pull-requests-limit: 5
    groups:
      mcp-security:
        applies-to: security-updates
        patterns: ["*"]
      mcp-minor-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]

  # --- Compose service images (docker-compose.yml and docker-compose.prod.yml) ---
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels: ["dependencies", "docker"]
    groups:
      compose-security:
        applies-to: security-updates
        patterns: ["*"]
      compose-minor-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]

  # --- Pre-commit hook revisions ---
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels: ["dependencies", "ci"]
    groups:
      pre-commit-security:
        applies-to: security-updates
        patterns: ["*"]
      pre-commit-minor-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]
