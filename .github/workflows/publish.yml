name: Publish Images

on:
  push:
    tags:
      - "v*.*.*"
  # Manual trigger to exercise the build + multi-arch Trivy gate on demand.
  # Default is a SCAN-ONLY dry run (no push) — the amd64 + arm64 images are
  # built and Trivy-scanned, but the push/SBOM/attest steps are skipped.
  # push_images=true performs a real manual publish and MUST be run from a tag
  # ref (the metadata step emits only type=semver tags, which require a semver
  # Git tag): `gh workflow run publish.yml --ref vX.Y.Z -f push_images=true`.
  # A guard step below fails fast if push_images=true is dispatched off a branch.
  # A real publish of either kind first waits for the commit's own checks to
  # be green (see require-green-commit).
  workflow_dispatch:
    inputs:
      push_images:
        description: "Real publish to GHCR — REQUIRES a tag ref (--ref vX.Y.Z). Leave false for a scan-only dry run."
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  # Images ship only from a commit whose checks on main passed: the latest
  # push, merge_group and completed schedule run of each workflow, so a red
  # run re-run to green passes. Tag-push, workflow_run, dispatch and
  # Dependabot runs don't test the commit and are left out. A dispatch with
  # push_images=true publishes the same artifacts as a tag push and is held to
  # the same rule; the scan-only dry run passes straight through.
  #
  # The wait covers a tag created before the commit's checks finish. Prod
  # Compose Smoke retries its image pull for about 20 minutes from the tag
  # push and the build takes about 13, so a long wait here turns that smoke
  # red and it has to be re-run from the tag.
  require-green-commit:
    name: Require green checks on the tagged commit
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check workflow runs for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_IMAGES: ${{ github.event.inputs.push_images }}
          REQUIRED_WORKFLOWS: .github/workflows/ci.yml .github/workflows/codeql.yml
          WAIT_SECONDS: "1200"
          POLL_SECONDS: "30"
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "push" ] && [ "$PUSH_IMAGES" != "true" ]; then
            echo "Scan-only dry run: nothing is published, so the commit's checks are not required."
            exit 0
          fi
          deadline=$((SECONDS + WAIT_SECONDS))
          while :; do
            report=$(
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" \
                --jq '.workflow_runs[]' |
                jq -s --arg required "$REQUIRED_WORKFLOWS" '
                  def line: "\(.name) (\(.event), attempt \(.run_attempt)): \(.conclusion // .status) \(.html_url)";
                  [ .[]
                    | select(.event == "push" or .event == "merge_group" or .event == "schedule")
                    | select(.head_branch == "main" or ((.head_branch // "") | startswith("gh-readonly-queue/main/")))
                    | select(.event != "schedule" or .status == "completed")
                    | .path |= sub("@.*$"; "") ]
                  | group_by([.path, .event]) | map(max_by(.created_at)) as $latest
                  | {
                      red: [$latest[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "startup_failure") | line],
                      pending: [$latest[] | select(.status != "completed") | line],
                      missing: [($required | split(" ")[]) as $path
                        | select([$latest[] | select(.path == $path and .conclusion == "success")] | length == 0)
                        | $path]
                    }'
            )
            red=$(jq -r '.red[]' <<<"$report")
            if [ -n "$red" ]; then
              echo "::error::Refusing to publish ${GITHUB_SHA}: its checks on main did not pass. Fix or re-run them, then re-run this workflow."
              printf '%s\n' "$red"
              exit 1
            fi
            pending=$(jq -r '.pending[]' <<<"$report")
            missing=$(jq -r '.missing[]' <<<"$report")
            if [ -z "$pending" ] && [ -z "$missing" ]; then
              echo "Checks on main passed for ${GITHUB_SHA}."
              exit 0
            fi
            now=$SECONDS
            if [ "$now" -ge "$deadline" ]; then
              echo "::error::Refusing to publish ${GITHUB_SHA}: its checks on main did not finish green within ${WAIT_SECONDS}s."
            else
              echo "Waiting for checks on ${GITHUB_SHA}."
            fi
            [ -z "$pending" ] || printf 'Still running:\n%s\n' "$pending"
            [ -z "$missing" ] || printf 'No successful run yet of:\n%s\n' "$missing"
            [ "$now" -lt "$deadline" ] || exit 1
            sleep "$POLL_SECONDS"
          done

  publish:
    name: Build & Push ${{ matrix.image }}
    needs: require-green-commit
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: geolens-api
            target: api
            description: "PostGIS-native GIS data catalog API"
          - image: geolens-worker
            target: worker
            description: "PostGIS-native GIS data catalog worker"
          - image: geolens-frontend
            target: frontend
            description: "PostGIS-native GIS data catalog frontend"
          - image: geolens-backup
            target: backup
            description: "Automated pg_dump backup service with S3 offload"

    steps:
      # Fail fast (with guidance) if a real manual publish is dispatched off a
      # branch — type=semver emits no tags there, so the push would otherwise
      # fail later with a cryptic empty-tags buildx error. Tag pushes and the
      # scan-only dry run (push_images=false) are unaffected.
      - name: Require a tag ref for manual publishes
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.push_images == 'true' && github.ref_type != 'tag' }}
        run: |
          echo "::error::push_images=true requires a tag ref so metadata-action can emit semver tags. Re-run as: gh workflow run publish.yml --ref vX.Y.Z -f push_images=true"
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # `latest` only on a real GA tag — exclude prereleases (a `-rc`/`-beta`
            # suffix). Otherwise a `v1.4.0-rc.1` push clobbers `:latest` with an
            # unreleased candidate (same spirit as gating release.yml's
            # isPrerelease). Fresh `:latest` pulls must track the last GA.
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
          # --label overrides Dockerfile LABEL, and metadata-action's
          # defaults derive title from the REPO name, so the explicit
          # title below keeps each published image from reporting title=geolens
          # and discarding the per-stage Dockerfile titles. The Dockerfile
          # LABEL blocks stay: they are the only metadata source on non-publish
          # build paths (local docker build, compose).
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # Gate BOTH published arches on Trivy. `load: true` can only materialize a
      # single-platform image, so amd64 and arm64 are built + scanned separately
      # (QEMU is set up above for the arm64 build). The push below ships
      # linux/amd64,linux/arm64, so each arch must clear the gate first.
      - name: Build amd64 image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: ${{ matrix.image }}:scan-amd64
          cache-from: type=gha,scope=${{ matrix.image }}

      - name: Trivy vulnerability scan (amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:scan-amd64
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: ".trivyignore.yaml"

      - name: Build arm64 image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/arm64
          load: true
          tags: ${{ matrix.image }}:scan-arm64
          cache-from: type=gha,scope=${{ matrix.image }}

      - name: Trivy vulnerability scan (arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:scan-arm64
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: ".trivyignore.yaml"

      # Push multi-arch images — only on a tag push, or a manual run with
      # push_images=true. Skipped on the scan-only dry run (both scans above
      # still execute, so the gate is exercised without publishing).
      - name: Build and push
        id: push
        if: ${{ github.event_name == 'push' || github.event.inputs.push_images == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamp the exact commit into the image so /api/health can
          # report it (`build` field). Only the pushed image needs it; the
          # scan-only builds above stay cache-stable without it.
          build-args: |
            GEOLENS_BUILD_SHA=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Generate SBOM from pushed image (only when we actually pushed)
      - name: Generate SBOM
        if: ${{ github.event_name == 'push' || github.event.inputs.push_images == 'true' }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}
          output-file: sbom-${{ matrix.image }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # Attest SBOM to the published image (only when we pushed AND repo is public)
      - name: Attest SBOM
        if: ${{ (github.event_name == 'push' || github.event.inputs.push_images == 'true') && !github.event.repository.private }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom-${{ matrix.image }}.spdx.json
          push-to-registry: true
