name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge-queue runs. All three required contexts (Detect Changes, Pre-commit,
  # CI OK) come from this workflow, so the queue cannot validate a candidate
  # merge commit without it.
  #
  # The queue run is the full matrix: there is no path filter to trust there,
  # and `ci-ok` counts a skip as a pass, so every gated job reads
  # `|| github.event_name == 'merge_group'`. test_ci_merge_queue.py holds that.
  #
  # The queue squash-merges, so main fast-forwards to the exact commit the
  # queue tested and the push run that follows sees the same SHA. Repeating
  # the matrix there tests nothing new. `changes` looks up a passing
  # merge_group run for the pushed SHA; when it finds one, the gated jobs skip
  # on push. A direct push, or a queue run that failed or was cancelled, finds
  # nothing and the push runs the full matrix.
  merge_group:
  # Nightly full-matrix E2E: the e2e-test job below runs ONLY on `schedule`/
  # `workflow_dispatch` (it stays skipped on push/PR). PRs that can affect the
  # stack run the small e2e-smoke job instead, so this cron remains
  # the only trigger for the full browser matrix.
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC nightly
  workflow_dispatch:

concurrency:
  # Include the event name so daily dependabot pushes cannot cancel the
  # scheduled run, which would let the e2e suite silently rot.
  #
  # This shape is already safe for the
  # merge queue. Each queue entry runs on its own `gh-readonly-queue/main/pr-N-<sha>`
  # ref, so `github.ref` alone puts every entry in a distinct group — two
  # batches in flight cannot cancel each other, and a queue run and the PR run
  # it came from differ in both ref and event name. `cancel-in-progress` stays
  # true because the only thing that can now share a group is a re-run of the
  # same queue entry.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Least-privilege default for every job; no job needs write (publishing lives
# in publish*.yml).
permissions:
  contents: read

jobs:
  # ---------- detect changed paths for conditional jobs ----------
  changes:
    name: Detect Changes
    runs-on: ubuntu-26.04
    # Every job carries an explicit cap. Runner apt-get/npm-mirror installs
    # can blackhole and sit for hours until someone cancels them by hand. A
    # cap turns a stuck runner into a bounded, self-reported failure; the
    # apt/Playwright install steps below also get their own
    # step-level timeout plus a bounded retry loop.
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      queue_verified: ${{ steps.queue.outputs.verified }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
      cli: ${{ steps.filter.outputs.cli }}
      mcp: ${{ steps.filter.outputs.mcp }}
      sdks: ${{ steps.filter.outputs.sdks }}
      alembic: ${{ steps.filter.outputs.alembic }}
      compat: ${{ steps.filter.outputs.compat }}
      installer: ${{ steps.filter.outputs.installer }}
      backup: ${{ steps.filter.outputs.backup }}
      monitoring: ${{ steps.filter.outputs.monitoring }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The default depth-1 clone grafts the checked-out commit
          # as a shallow boundary, and git then reports it as having NO parents:
          # `git rev-parse HEAD^1` dies with "ambiguous argument". Depth 2 is the
          # minimum that materialises the merge ref's two parents, which is all
          # the base resolution below needs.
          fetch-depth: 2
          persist-credentials: false
      # Any failure here, including an API error or a timeout, leaves
      # `verified` unset, and the push then runs the full matrix.
      - name: Find a passing merge-queue run for this commit
        id: queue
        if: github.event_name == 'push'
        timeout-minutes: 2
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          count="$(gh api -X GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=merge_group&status=success&head_sha=${GITHUB_SHA}" \
            --jq '.total_count')" || count=0
          if [[ "$count" =~ ^[1-9][0-9]*$ ]]; then
            echo "A merge-queue run passed on ${GITHUB_SHA}; the gated jobs skip."
            echo "verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "No passing merge-queue run for ${GITHUB_SHA}; running the full matrix."
          fi
      # Resolve the PR diff base ourselves. paths-filter's no-token
      # path diffs `pull_request.base.sha .. merge-commit`, and base.sha is
      # frozen at PR-open time while GitHub recomputes the merge ref every time
      # main moves. The diff would then include everything that landed since:
      # a PR that changed 4 files could report 117, turning Backend Tests on for
      # other people's backend/** work, wider the staler the branch.
      #
      # checkout leaves us on refs/pull/N/merge, whose FIRST parent is the base
      # branch tip as of when that ref was built. Diffing against it yields the
      # PR's own changes and nothing else. This needs the fetch-depth: 2 above;
      # paths-filter's own ensureRefAvailable then finds the base locally rather
      # than re-fetching it.
      - name: Resolve the PR diff base
        id: diffbase
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD^1)"
          echo "Diffing against first parent of the merge ref: $base"
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4
        id: filter
        # The filter has nothing to diff against on merge_group. Git-diff
        # detection (see the token note below) resolves its base from
        # pull-request context or a push's before-SHA, and a
        # `gh-readonly-queue/*` branch supplies neither. Every gated job ORs in
        # `merge_group` and ignores these outputs there; this job, a REQUIRED
        # context, still has to succeed, so the step is skipped and the outputs
        # come out empty.
        #
        # On push the run is all or nothing, decided by the queue lookup above.
        # A push diff that matched a filter would otherwise run those jobs again
        # after the queue already passed them.
        if: github.event_name != 'merge_group' && github.event_name != 'push'
        with:
          # Empty token switches paths-filter to git-diff detection,
          # removing the GitHub API call whose transient 503s failed this
          # required check hard. The diffbase step supplies the base that detection
          # diffs from; without it the action falls back to the stale
          # pull_request.base.sha.
          token: ''
          # Empty on push and merge_group, where the action's own
          # defaults (before-SHA / merge_group.base_sha) are already right.
          # The action logs "'base' input parameter is ignored when action is
          # triggered by pull request event" — that warning is wrong on this
          # path: main.ts resolves `base || baseSha || defaultBranch`, so an
          # explicit base takes precedence. Only the API path ignores it.
          base: ${{ steps.diffbase.outputs.sha }}
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose*.yml'
              - 'Dockerfile*'
              # Files the backend introspection tests (test_phase_27*) assert
              # against — a change here can break Backend Tests, so they must
              # run on PRs that touch these even with no backend/** change.
              - 'README.md'
              - 'frontend/README.md'
              - 'CHANGELOG.md'
              - '.env.example'
              - '.dockerignore'
              - 'db/**'
              # test_audit_retention_script.py runs this script for real against
              # a throwaway database. Editing the script without re-running its
              # only gate is exactly the regression it exists to catch. The same
              # test asserts audit-archives/ stays gitignored, so a
              # .gitignore-only PR must run Backend Tests too.
              - 'scripts/audit_retention.sh'
              # test_check_suppressed_alerts.py imports this script.
              - 'scripts/check_suppressed_alerts.py'
              # test_frontend_dev_entrypoint.py runs this script against a stub npm.
              - 'frontend/docker-dev-entrypoint.sh'
              # The same tests run the dev readiness check and assert the builder
              # module it loads still exists.
              - 'frontend/scripts/dev-readiness.mjs'
              - 'frontend/src/components/builder/BuilderMap.tsx'
              # Decides which test files each Backend Tests shard runs; a PR
              # touching only it must exercise the sharded run.
              - 'scripts/ci_backend_shards.py'
              # test_sdks_round_trip.py asserts the generated
              # SDK carries no unguarded optional-body emission, which is what
              # this script produces during `make sdks`. A PR editing only the
              # script would otherwise skip Backend Tests and never run the
              # assertion that says whether it still works.
              - 'scripts/fix_sdk_optional_body.py'
              # test_sdks_round_trip.py checks that every anonymous-capable
              # operation accepts a plain Client, which this script produces.
              - 'scripts/fix_sdk_anonymous_client.py'
              # The SDK's hand-maintained modules (auth.py, cog_download.py) are
              # tested only in test_sdks_round_trip.py and change without backend/**.
              - 'sdks/python/geolens/*.py'
              # test_seed_showcase_pins_1607.py imports this seeder
              # and walks its AST to prove every builder routes its map-exists
              # check through _keep_existing_map, so the maps geolens-examples
              # links by UUID survive --force. A seeder-only PR that skipped
              # Backend Tests would drop the pin with the gate showing green.
              - 'scripts/seed-showcase.py'
              - '.gitignore'
              # Frontend files that backend parity/drift tests read by literal
              # path (fe-sdk type drift, basemap/capability/paint-key drift,
              # nginx/CSP/Dockerfile regressions). Specific files only — NOT
              # frontend/src/** — so ordinary frontend PRs stay backend-skipped.
              - 'frontend/nginx.conf'
              # frontend/Dockerfile does not exist (test_phase_272_dockerfile.py
              # keeps it deleted), and a dead glob is silent in both directions.
              - 'frontend/Dockerfile.dev'
              - 'frontend/docker-entrypoint.sh'
              - 'frontend/index.html'
              - 'frontend/public/theme-init.js'
              - 'frontend/src/types/api.ts'
              - 'frontend/src/lib/basemap-utils.ts'
              - 'frontend/src/lib/capabilities.ts'
              - 'frontend/src/lib/__tests__/record-type-capabilities.cases.json'
              - 'frontend/src/components/builder/layer-adapters/shared.ts'
              # More frontend files that backend parity gates read by literal
              # path. Without them a PR editing only AuditLogViewer.tsx skips
              # Backend Tests, and the audit-action parity gate reads as green
              # without having run. test_ci_alembic_filter_paths.py fails when
              # a backend test names a scripts/, frontend/ or e2e/ file this
              # list misses. Files a test only mentions in prose sit in that
              # test's allowlist instead, so editing them skips the shards.
              - 'frontend/src/components/admin/AuditLogViewer.tsx'
              - 'frontend/src/lib/__tests__/public-app-url-shape.cases.json'
              - 'frontend/src/lib/error-map.ts'
              # test_job_failure_codes.py reads this by literal path (the
              # fixed-failure-code to translation-key table); a
              # frontend-only edit here must still run Backend Tests.
              - 'frontend/src/lib/failure-reason.ts'
              # test_settings_key_drift.py reads these by
              # literal path (the settings-key subset guard: frontend_keys
              # is a subset of backend registry keys) and
              # test_iso_option_drift.py reads iso-constants.ts (the ISO
              # dropdown-option subset guard).
              - 'frontend/src/api/settings.ts'
              - 'frontend/src/components/admin/settings/Settings*Tab.tsx'
              - 'frontend/src/lib/iso-constants.ts'
              # test_embed_framing_csp.py::test_e2e_sec_audit_s08_skips_when_no_share_token
              # reads this spec by literal path to pin the S08 test block; the
              # 'e2e' filter alone does not trigger Backend Tests.
              - 'e2e/sec-audit.spec.ts'
              # repo-root scripts that backend tests read by literal
              # path. Without them, a change to backup-entrypoint.sh would skip its
              # own regression test (test_backup_staging_tar_skew.py): the backup
              # filter covers the script, but nothing else pulls in the backend
              # suite that asserts against it.
              # backend/scripts/* needs no entry here; backend/** covers it.
              # test_ci_alembic_filter_paths.py enforces both directions.
              - 'scripts/backup-entrypoint.sh'
              - 'scripts/init-db.sh'
              - 'scripts/lib/configure-runtime-db-role.sh'
              # Read by literal path in
              # test_audit_1798_runbook_shell_sourcing.py, which asserts this
              # wrapper exists, is executable, and calls get_env_value.
              - 'scripts/env-value.sh'
              # test_compose_db_healthcheck.py reads its db healthcheck.
              - 'scripts/tests/ci-restore-db.compose.yml'
              # test_alert_rules.py reads both of these by literal
              # path — it checks the alert rules' handler selectors against the
              # app's real route table, and that every rule has a promtool case.
              # Without this, an alerts-only PR skips the only gate that would
              # catch a selector matching nothing.
              - 'infra/monitoring/alerts.yml'
              - 'infra/monitoring/alerts.test.yml'
              # test_alert_rules.py reads this one by literal path
              # too -- it checks that the worker scrape job discovers every
              # replica, because the job counters live in the process that did
              # the work and an unscraped replica is invisible.
              - 'infra/monitoring/prometheus.yml'
              # The dashboard too, for the other half of
              # that -- once discovery finds every replica, a panel reading a
              # per-replica job series without an aggregator draws one partial
              # line per replica.
              - 'infra/monitoring/grafana-dashboard.json'
              # A change to this workflow can alter HOW Backend Tests
              # runs (e.g. the -n4 parallelization / coverage core), so the suite
              # must run on PRs that touch it — otherwise CI-config changes ship
              # unvalidated by the very tests they configure.
              - '.github/workflows/ci.yml'
              # test_release_dispatch_targets_1609.py reads
              # release.yml by literal path and asserts both downstream
              # dispatches (the site and geolens-examples) stay wired and
              # independent. Without this, a release.yml-only PR skips the
              # only suite that would notice one of them going away.
              - '.github/workflows/release.yml'
              # test_publish_requires_green_commit.py runs the publish gate
              # step and checks every publish job still needs it.
              - '.github/workflows/publish.yml'
              # test_codeql_qtable_suppressions.py reads both of these by
              # literal path: it asserts the init step still runs the local
              # alert-suppression query, that a step still acts on the SARIF,
              # and that the query still refuses to honour ruff's noqa
              # comments. Without these entries a codeql.yml-only PR skips the
              # only test that checks any of it. See AGENTS.md > Security >
              # CodeQL.
              - '.github/workflows/codeql.yml'
              - '.github/codeql/**'
              # test_unscoped_finding_markers.py reads this config
              # and asserts the marker hook still runs the detector, so a
              # config-only PR must run the suite that notices a hook drifting.
              - '.pre-commit-config.yaml'
              # test_runtime_db_role.py reads this script's source.
              - 'scripts/tests/test-backup-restore-roundtrip.sh'
              # Backend tests that build these paths from parts
              # (ROOT / "scripts" / ...) and read or import them.
              - 'scripts/flatten_openapi_defs.py'
              - 'scripts/init-test-db.sh'
              - 'scripts/install.sh'
              - 'scripts/minio-setup.sh'
              - 'scripts/restore.sh'
              - 'scripts/showcase-121-state.py'
            frontend:
              - 'frontend/**'
              - 'backend/openapi.json'
              - 'scripts/flatten_openapi_defs.py'
              # template-parity.test.ts asserts the in-app problem
              # reporter's prefill against this Issue Form — a template-only PR
              # must still run the frontend tests or drift lands silently.
              - '.github/ISSUE_TEMPLATE/bug_report.yml'
              # A bump of root @playwright/test must run the frontend/e2e/axe jobs,
              # so the root manifests belong in this filter.
              - 'package.json'
              - 'package-lock.json'
            e2e:
              - 'backend/**'
              - 'frontend/**'
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'playwright.builder-hardening.config.ts'
              - 'docker-compose*.yml'
              # The Playwright toolchain lives in the ROOT manifests.
              - 'package.json'
              - 'package-lock.json'
              # Same rationale as the backend filter's workflow entry:
              # a change to this workflow alters HOW the e2e-smoke PR gate
              # runs, so the gate must run on PRs that touch it.
              - '.github/workflows/ci.yml'
              # The smoke job copies .env.example and boots
              # the compose stack, so its remaining build/boot inputs must
              # trigger the gate: the root api/worker Dockerfile and the
              # .dockerignore that trims its context, the db image context
              # (./db) whose postgresql.conf is also mounted, and the postgres
              # initdb script.
              - '.env.example'
              - 'Dockerfile*'
              - '.dockerignore'
              - 'db/**'
              - 'scripts/init-db.sh'
            cli:
              - 'cli/**'
              - 'sdks/python/**'
              # test_cli_round_trip.py applies examples/manifests/first-catalog
              # verbatim — an example-only change must still run the CLI suite.
              - 'examples/**'
            mcp:
              - 'mcp/**'
              - 'sdks/python/**'
              # The live tier tests backend BEHAVIOR,
              # not just schema — a runtime regression in the handlers the
              # five tools read (or in the auth/config paths the tier relies
              # on) can ship with a byte-identical openapi.json, so the whole
              # backend tree must trigger the suite, plus the compose
              # build/boot inputs the job uses (same set as the e2e filter).
              - 'backend/**'
              - 'docker-compose*.yml'
              - 'Dockerfile*'
              - '.dockerignore'
              - '.env.example'
              - 'db/**'
              - 'scripts/init-db.sh'
              # The job invokes the root `make mcp-test`
              # and `make mcp-live-test` recipes, so a Makefile-only change
              # must run it.
              - 'Makefile'
              # Same rationale as the backend filter's workflow entry: a change
              # to this workflow alters HOW the mcp job runs (incl. the live
              # tier's boot recipe), so the job must run on PRs that touch it.
              - '.github/workflows/ci.yml'
            # A PR that only touches the SDKs' own toolchain
            # (generator, package.json, tsconfig) would run neither drift gate,
            # so generator breakage could merge green and redden main on push.
            sdks:
              - 'sdks/**'
              - 'backend/openapi.json'
              # `make sdks-check` is driven by the Makefile recipe and the
              # flatten intermediate — a change to either alters what the drift
              # gate regenerates, so it must run.
              - 'Makefile'
              - 'scripts/flatten_openapi_defs.py'
            alembic:
              - 'backend/alembic/**'
              - 'backend/scripts/test_alembic_upgrade_clean_db.sh'
              # The clean-DB harness bind-mounts both init scripts. Changes to
              # either must exercise the exact fresh-cluster boot path.
              - 'scripts/init-db.sh'
              - 'scripts/lib/configure-runtime-db-role.sh'
              # The real model layout, so model-only PRs still trigger alembic
              # check (blocks model migration drift).
              - 'backend/app/**/models.py'
              - 'backend/app/core/db/models.py'
              - 'backend/app/processing/**/models.py'
              - 'db/**'
            # The previous-release check also runs on every migration or model
            # change above; this adds its own inputs.
            compat:
              - 'scripts/previous-release-compat.sh'
              - '.github/workflows/ci.yml'
            installer:
              - 'scripts/install.sh'
              - 'scripts/upgrade.sh'
              - 'scripts/restore.sh'
              - 'scripts/check-env.sh'
              - 'scripts/lib/common.sh'
              # Preflight reads .env through common.sh's
              # get_env_value, so both it and its test belong on this filter.
              - 'scripts/preflight-env.sh'
              - 'scripts/tests/test-preflight-env.sh'
              - 'scripts/backup-entrypoint.sh'
              - 'scripts/tests/test-install-tag-resolution.sh'
              - 'scripts/tests/test-install-secret-generation.sh'
              - 'scripts/tests/test-install-main-wrapper.sh'
              - 'scripts/tests/test-upgrade-order.sh'
              - 'scripts/tests/test-upgrading-doc-consistency.sh'
              - 'scripts/tests/test-backup-s3-signature.sh'
              - 'scripts/tests/test-restore-trap-safety.sh'
              - 'scripts/tests/test-restore-env-sourcing-safety.sh'
              - 'scripts/tests/test-env-file-compose-oracle.sh'
              - 'scripts/check_env_doc_drift.py'
              - 'tests/test_check_env_doc_drift.py'
              # check_env_doc_drift.py parses the Settings fields out of these
              # files — a new Settings field must re-run the drift gate.
              - 'backend/app/core/config.py'
              - 'backend/app/core/config_ai.py'
              - 'backend/app/core/auth_settings.py'
              - '.env.example'
              - 'UPGRADING.md'
              # The drift gate resolves scripts/ paths referenced by
              # these docs, so an edit to any of them (or a script deletion)
              # must re-run it, not just land unchecked until the push on main.
              - '.env.test.example'
              - 'RUNBOOK.md'
              - 'README.md'
              # Translations carry the same install/upgrade commands, so a path
              # broken only in one of them must fail the gate too.
              - 'README.de.md'
              - 'README.es.md'
              - 'README.fr.md'
              - 'EDITIONS.md'
              - 'SUPPORT.md'
              - 'scripts/**'
              - 'docker-compose.yml'
              - 'docker-compose.prod.yml'
            backup:
              - 'scripts/backup-entrypoint.sh'
              - 'scripts/restore.sh'
              - 'scripts/lib/configure-runtime-db-role.sh'
              - 'scripts/tests/test-backup-restore-roundtrip.sh'
              # The bundled-mode leg restores through the REAL
              # restore.sh against this db-only compose stack.
              - 'scripts/tests/ci-restore-db.compose.yml'
              - 'db/**'
              # Both compose files carry the backup service healthcheck.
              - 'docker-compose.yml'
              - 'docker-compose.prod.yml'
              - 'Dockerfile'
              - '.github/workflows/publish.yml'
              # The round-trip proof itself is ~220 inline lines of THIS
              # workflow — a ci.yml-only edit to those steps must run them.
              - '.github/workflows/ci.yml'
            # The promtool suite. Separate from `backend`
            # because it needs no Python at all and should not run on every
            # backend PR; the alerts files are in BOTH filters on purpose, since
            # backend/tests/test_alert_rules.py reads them too.
            monitoring:
              - 'infra/monitoring/**'
              # The job is defined in this workflow, so a change to its steps
              # must run them.
              - '.github/workflows/ci.yml'

  # ---------- backend ----------
  backend-lint:
    name: Backend Lint
    needs: changes
    if: needs.changes.outputs.backend == 'true' || (github.event_name == 'push' && needs.changes.outputs.queue_verified != 'true') || github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.10.2"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # No third "cloud" runtime mode.
      # A literal 'cloud' token in edition.py or license.py would re-introduce
      # a separate hosted-product axis.
      # `grep -nE` returns exit 0 on a match (which is a FAIL for us) and
      # exit 1 on no match (which is our SUCCESS) — flip semantics with `!`.
      - name: TSEAM-03 - no literal 'cloud' runtime token in core/edition.py or core/license.py
        run: |
          if grep -nE "['\"]cloud['\"]" app/core/edition.py app/core/license.py; then
            echo "FAIL: Found a literal 'cloud' runtime token. TSEAM-03"
            exit 1
          fi
          echo "OK: no 'cloud' runtime literal in core/edition.py or core/license.py"

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.10.2"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      # Installs the hash-locked pre-commit group from backend/uv.lock, not the
      # backend project itself.
      - name: Install pre-commit
        run: |
          uv sync --project backend --locked --only-group pre-commit
          echo "$PWD/backend/.venv/bin" >> "$GITHUB_PATH"

      # Security guardrails (SSRF/IDOR) + generic hygiene. Ruff is covered by the
      # backend-lint job; gitleaks runs as a dedicated full-tree scan below (the
      # pre-commit gitleaks hook only inspects staged diffs).
      - name: Run pre-commit hooks
        env:
          SKIP: ruff-check,ruff-format,gitleaks
        run: pre-commit run --all-files --show-diff-on-failure

      # This scans backend detail= assignments as well as the
      # frontend classifier, so it must run for backend-only PRs too.
      - name: Localized API error boundary
        run: node frontend/scripts/check-api-error-boundary.mjs

      - name: Install gitleaks
        # Retries a transient download failure instead of letting
        # it evict the whole merge-queue entry on a required job.
        run: |
          GL=8.30.1
          GL_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GL}/gitleaks_${GL}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          echo "${GL_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xz -f gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Secret scan (tracked tree)
        run: gitleaks dir . -c .gitleaks.toml --redact --no-banner

  # ---------- installer ----------
  # Regression guard for the release-tag checkout in scripts/install.sh: a remote
  # branch named identically to a release tag must not shadow the tag. Pure
  # shell + git (no Docker/DB), so it is fast and only runs when the installer or
  # its test changes.
  installer-test:
    name: Installer Tag Resolution
    needs: changes
    if: needs.changes.outputs.installer == 'true' || (github.event_name == 'push' && needs.changes.outputs.queue_verified != 'true') || github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Tag/branch shadowing regression test
        run: sh scripts/tests/test-install-tag-resolution.sh

      - name: Installer secret-generation regression test
        run: sh scripts/tests/test-install-secret-generation.sh

      - name: Installer main() wrapper regression test
        run: sh scripts/tests/test-install-main-wrapper.sh

      # The order test also covers the PG-major refusal, so both upgrade suites
      # have to run.
      - name: Upgrade order + PG-major guard regression test
        run: sh scripts/tests/test-upgrade-order.sh

      - name: UPGRADING.md consistency test
        run: sh scripts/tests/test-upgrading-doc-consistency.sh

      - name: Backup S3 signature regression test
        run: sh scripts/tests/test-backup-s3-signature.sh

      - name: restore.sh EXIT trap safety regression test
        run: sh scripts/tests/test-restore-trap-safety.sh

      - name: restore.sh/check-env.sh .env sourcing safety regression test
        run: sh scripts/tests/test-restore-env-sourcing-safety.sh

      - name: preflight-env.sh .env parsing regression test
        run: sh scripts/tests/test-preflight-env.sh

      # get_env_value's .env interpolation/decoding is checked against REAL
      # `docker compose` (not just our own understanding of its grammar).
      # `docker compose config` needs no daemon,
      # image pull, or network — ubuntu-26.04 ships docker compose.
      - name: get_env_value vs real Docker Compose oracle test
        run: sh scripts/tests/test-env-file-compose-oracle.sh

      - name: Environment contract drift gate
        run: python3 scripts/check_env_doc_drift.py

      - name: Environment contract drift gate regression tests
        run: python3 -m unittest tests.test_check_env_doc_drift

      - name: Validate compose files parse
        env:
          GEOLENS_VERSION: 0.0.0-ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          JWT_SECRET_KEY: ci-compose-validate-padding-32chars
          GEOLENS_ADMIN_USERNAME: admin
          GEOLENS_ADMIN_PASSWORD: geolens-ci-admin-password
          MINIO_ROOT_USER: ci
          MINIO_ROOT_PASSWORD: ci-padding
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.prod.yml config -q

  # ---------- backup + restore round-trip ----------
  # Boots the backup image (built/loaded from --target backup in the root
  # Dockerfile) and exercises backup → restore for BOTH DB modes:
  #   BUNDLED: backup image runs pg_dump + SigV4 S3 upload inside the image;
  #            the dump is then restored by the REAL scripts/restore.sh
  #            into a db-only compose stack
  #            (scripts/tests/ci-restore-db.compose.yml); restored row counts
  #            must match exactly and geolens_reader must SELECT restored data.
  #   MANAGED: provider-snapshot DB (seeded directly) + object-storage archive
  #            pulled from MinIO; asserts the functional pairing (restore.sh's
  #            compose-exec path deliberately does not apply to an external DB).
  # The fast leg (test-backup-restore-roundtrip.sh, both modes, no S3) runs
  # first; the full image-boot leg follows to prove the shipped SigV4 path.
  backup-roundtrip:
    name: Backup Restore Round-trip
    needs: changes
    if: needs.changes.outputs.backup == 'true' || (github.event_name == 'push' && needs.changes.outputs.queue_verified != 'true') || github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: geolens
      PGPASSWORD: geolens_test
      S3_BUCKET: geolens-backups-ci
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: geolens
          POSTGRES_PASSWORD: geolens_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geolens -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        # bitnami/minio:* tags were withdrawn in Bitnami's Aug-2025 "Secure
        # Images" migration (all bitnami/minio:<tag> now 404). The last free
        # build lives under bitnamilegacy/, pinned here by digest for
        # reproducibility (auto-runs `minio server` + ships `mc` for the
        # healthcheck — bucket is pre-created via MINIO_DEFAULT_BUCKETS).
        image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          MINIO_DEFAULT_BUCKETS: geolens-backups-ci
        ports:
          - 9000:9000
        options: >-
          --health-cmd "mc ready local || curl -sf http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build backup image (Dockerfile --target backup, --load for docker run)
        run: |
          # Build+load the backup stage so CI boots the SAME image
          # definition that publish.yml ships. On a PR no GHCR tag exists yet;
          # --load makes it available to `docker run` on this runner without a
          # registry push (never pull an external image for the proof).
          docker buildx build \
            --load \
            --target backup \
            -t geolens-backup:ci \
            .

      - name: Install postgresql-client + tooling
        # A step-level cap plus a bounded retry loop: an apt mirror that goes
        # unreachable mid-fetch fails this step in well under the job
        # timeout instead of hanging for hours. Each apt-get
        # invocation is wrapped in its OWN `sudo timeout -k 10 <N>` (update
        # and install separately, not chained under one timeout) so apt-get
        # is timeout's DIRECT child — no sudo/shell grandchild between them
        # to block the signal, unlike the Playwright-install steps. Both
        # Acquire::http::Timeout AND Acquire::https::Timeout are set: apt falling
        # back from a failing http mirror to an https one stalled a sibling step
        # for the full 10-minute cap with ZERO output, which an http-only timeout
        # never bounds. The cleanup between attempts matches the
        # Playwright-install steps for the same reason: apt-get can still
        # orphan a dpkg child if timeout kills it mid-unpack. The final
        # `dpkg --configure -a` is itself timeout-wrapped: an unbounded
        # maintainer script there could eat the rest of the step cap the
        # same way an unbounded apt-get did.
        #
        # Worst case: 3 attempts * (90+10 + 150+10)s + 2 cleanups *
        # (5 + 5*2 + 30+10 + 10)s = 780 + 130 = 910s, under the 960s
        # (16-minute) step cap.
        timeout-minutes: 16
        run: |
          # The postgres service for this job is postgis/postgis:18-3.6 (PG18).
          # Ubuntu 24.04 (noble) ships postgresql-client 16 by default, and pg_dump
          # refuses to dump a newer server ("aborting because of server version
          # mismatch"), so add the PGDG apt repo and install the matching v18
          # client (pg_dump/pg_restore/psql/createdb/dropdb).
          #
          # awscli is intentionally NOT installed from apt (dropped from noble).
          # AWS CLI v2 is already preinstalled on ubuntu-26.04 runners and is
          # used in the managed-mode step below to pull the staging archive from
          # MinIO after the backup image uploads it via its own SigV4 path.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          for i in 1 2 3; do
            sudo timeout -k 10 90 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update \
              && sudo timeout -k 10 150 apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends postgresql-client-18 curl \
              && break
            echo "apt attempt $i failed"
            [ "$i" = 3 ] && exit 1
            # A stalled Azure mirror stays stalled for the retries, so fall back to archive.ubuntu.com.
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt 2>/dev/null || true
            sudo pkill -TERM -x apt-get || true
            sudo pkill -TERM -x dpkg || true
            sleep 5
            sudo pkill -KILL -x apt-get || true
            sudo pkill -KILL -x dpkg || true
            for _ in 1 2 3 4 5; do
              pgrep -x apt-get >/dev/null || pgrep -x dpkg >/dev/null || break
              sleep 2
            done
            sudo timeout -k 10 30 dpkg --configure -a || true
            sleep 10
          done

      - name: Local round-trip (bundled + managed modes, no S3)
        env:
          # Point the standalone script at the CI Postgres service.
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: geolens
          POSTGRES_PASSWORD: geolens_test
          POSTGRES_DB: postgres
        run: |
          # Fast leg: exercises both bundled-mode DB recovery and managed-mode
          # provider-snapshot + object-storage recovery without requiring S3/MinIO
          # or the backup image (pure pg_dump/pg_restore + tar). CI checkout ships
          # .env.test, so env overrides are passed explicitly.
          #
          # The script exits 0 with a "SKIP:" line when its prerequisites are
          # missing (it doubles as a local dev tool). This job only runs when
          # the backup path filter matched, so a skip here means CI asserted
          # NOTHING about the backup path — treat it as a hard failure.
          set -o pipefail
          bash scripts/tests/test-backup-restore-roundtrip.sh | tee /tmp/roundtrip-fast.log
          if grep -q '^SKIP:' /tmp/roundtrip-fast.log; then
            echo "::error::backup round-trip script skipped (prerequisites missing on the CI runner) — nothing was asserted"
            exit 1
          fi

      - name: BUNDLED MODE — boot backup image (SigV4 S3 upload via image) → REAL scripts/restore.sh → row-count + reader assert
        env:
          # Everything scripts/restore.sh needs, env-parameterized
          # (the CI checkout ships no .env): the db-only compose stack whose
          # `db` service is the restore target, and the target credentials/
          # database. COMPOSE_PROJECT_NAME is pinned so this step's compose
          # calls and the ones restore.sh makes resolve to the same project.
          COMPOSE_FILE: scripts/tests/ci-restore-db.compose.yml
          COMPOSE_PROJECT_NAME: geolens-ci-restore
          POSTGRES_USER: geolens
          POSTGRES_PASSWORD: geolens_test
          POSTGRES_DB: geolens
          GEOLENS_RUNTIME_DB_ROLE: geolens_ci_app
          GEOLENS_RUNTIME_DB_PASSWORD: ci-runtime-role-test-password-947-padding
        run: |
          set -euo pipefail
          # Seed a source DB with known rows.
          SRC=geolens_ci_bund_src_$$
          createdb -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" "$SRC"
          psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$SRC" -v ON_ERROR_STOP=1 -c \
            "CREATE SCHEMA IF NOT EXISTS catalog;
             CREATE TABLE catalog.records (id serial PRIMARY KEY, name text);
             CREATE TABLE catalog.datasets (id serial PRIMARY KEY, slug text);
             INSERT INTO catalog.records (name) SELECT 'img-r-'||g FROM generate_series(1, 113) g;
             INSERT INTO catalog.datasets (slug) SELECT 'img-d-'||g FROM generate_series(1, 57) g;
             CREATE SCHEMA IF NOT EXISTS data;
             CREATE TABLE data.ci_probe (id int PRIMARY KEY);
             INSERT INTO data.ci_probe VALUES (1);"
          SRC_R=$(psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$SRC" -tAc "SELECT COUNT(*) FROM catalog.records;")
          SRC_D=$(psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$SRC" -tAc "SELECT COUNT(*) FROM catalog.datasets;")

          # Staging dir (object storage) for the image to archive and upload.
          mkdir -p /tmp/ci-staging/nested
          echo "cog-data" > /tmp/ci-staging/a.tif
          echo "fgb-data" > /tmp/ci-staging/nested/b.fgb

          # Backups output volume (host-mounted so we can resolve filenames).
          mkdir -p /tmp/ci-backups

          # Run the backup image — it connects to $SRC, runs pg_dump, archives
          # /staging, and uploads BOTH to MinIO via the image's SigV4 uploader
          # (the shipped behaviour being proven here).
          # --network host lets the container reach the postgres + minio services.
          # Array form keeps the run_args readable while putting docker run and
          # the image name on a single line.
          run_args=(
            --rm --network host
            -e POSTGRES_HOST=localhost -e POSTGRES_PORT=5432
            -e POSTGRES_USER="$PGUSER" -e POSTGRES_PASSWORD="$PGPASSWORD"
            -e POSTGRES_DB="$SRC"
            -e BACKUP_S3_ENABLED=true
            -e S3_ENDPOINT="$S3_ENDPOINT" -e S3_BUCKET="$S3_BUCKET"
            -e S3_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID"
            -e S3_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY"
            -e S3_ADDRESSING_STYLE=path
            -v /tmp/ci-backups:/backups -v /tmp/ci-staging:/staging:ro
          )
          docker run "${run_args[@]}" geolens-backup:ci --run-backup
          sudo chmod -R a+rX /tmp/ci-backups

          # Verify the backup image produced a non-empty dump.
          DUMP_FILE=$(find /tmp/ci-backups/daily -name '*.dump' -type f | head -1)
          [ -n "$DUMP_FILE" ] || { echo "FAIL: backup image produced no dump file"; exit 1; }
          [ -s "$DUMP_FILE" ] || { echo "FAIL: backup image dump file is empty"; exit 1; }

          # Restore through the REAL scripts/restore.sh — no inline
          # replica of its flags, which would drift (`pg_restore --list` passes
          # a truncated -Fc dump, while the script uses the stricter
          # `-f /dev/null`).
          # Bring up the db-only compose stack the script will exec into; its
          # image is the shipped db/Dockerfile build (restore.sh's fail-closed
          # pre-restore DDL needs postgis/pg_trgm/unaccent/vector installed).
          docker compose -f "$COMPOSE_FILE" up -d --build --wait db

          # The script validates the archive end-to-end, runs the pre-restore
          # DDL, pg_restore --clean --if-exists --no-owner (any nonzero exit
          # fails), and re-applies the geolens_reader grants.
          # Its exit code is the gate (set -e).
          bash scripts/restore.sh "$DUMP_FILE"

          # Hard row-count asserts — must not be weakened with || true.
          # The restored side lives in the compose db.
          DST_R=$(docker compose -f "$COMPOSE_FILE" exec -T db \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT COUNT(*) FROM catalog.records;")
          DST_D=$(docker compose -f "$COMPOSE_FILE" exec -T db \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT COUNT(*) FROM catalog.datasets;")
          [ "$SRC_R" = "$DST_R" ] || { echo "FAIL: bundled-mode records count mismatch: $SRC_R != $DST_R"; exit 1; }
          [ "$SRC_D" = "$DST_D" ] || { echo "FAIL: bundled-mode datasets count mismatch: $SRC_D != $DST_D"; exit 1; }

          # geolens_reader grant round-trip: --clean drops schema `data` with
          # its ACLs and the dump is --no-acl, so restore.sh re-grants AFTER
          # pg_restore. The re-grant runs inside the script; prove its
          # EFFECT independently — the reader role can actually select from a
          # restored table in schema `data`.
          # tail -1: -tA still prints the SET command tag ahead of the count
          READER_CNT=$(docker compose -f "$COMPOSE_FILE" exec -T db \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
            "SET ROLE geolens_reader; SELECT COUNT(*) FROM data.ci_probe;" | tail -n 1)
          [ "$READER_CNT" = "1" ] || { echo "FAIL: geolens_reader cannot select restored data.ci_probe (got '${READER_CNT}')"; exit 1; }
          echo "  geolens_reader post-restore grant verified (data.ci_probe readable)"

          # Restore runs with POSTGRES_USER, then the canonical reconciler
          # restores the opt-in runtime role without handing it role/schema DDL.
          ROLE_STATE=$(docker compose -f "$COMPOSE_FILE" exec -T db \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
            "SELECT rolsuper || '|' || rolbypassrls || '|' || rolcreaterole || '|' || rolcreatedb || '|' || rolreplication
             FROM pg_roles WHERE rolname = '$GEOLENS_RUNTIME_DB_ROLE';" | tr -d '[:space:]')
          [ "$ROLE_STATE" = "false|false|false|false|false" ] || { echo "FAIL: unsafe runtime role state: $ROLE_STATE"; exit 1; }
          DATA_OWNER=$(docker compose -f "$COMPOSE_FILE" exec -T db \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
            "SELECT pg_get_userbyid(relowner) FROM pg_class WHERE oid = 'data.ci_probe'::regclass;" | tr -d '[:space:]')
          [ "$DATA_OWNER" = "$GEOLENS_RUNTIME_DB_ROLE" ] || { echo "FAIL: restored data owner is $DATA_OWNER"; exit 1; }
          RUNTIME_CNT=$(docker compose -f "$COMPOSE_FILE" exec -T db \
            env PGPASSWORD="$GEOLENS_RUNTIME_DB_PASSWORD" \
            psql -h 127.0.0.1 -U "$GEOLENS_RUNTIME_DB_ROLE" -d "$POSTGRES_DB" -tAc \
            "SELECT COUNT(*) FROM catalog.records;" | tr -d '[:space:]')
          [ "$RUNTIME_CNT" = "$SRC_R" ] || { echo "FAIL: runtime role cannot read restored catalog"; exit 1; }
          echo "  least-privilege runtime role post-restore grants + data ownership verified"

          echo "PASS [BUNDLED MODE]: image backup→SigV4-S3→scripts/restore.sh, records=${SRC_R} datasets=${SRC_D}"
          dropdb -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" --if-exists "$SRC"
          docker compose -f "$COMPOSE_FILE" down -v

      - name: MANAGED MODE — provider-snapshot DB + object-storage archive recovery → row-count + object-tree assert
        run: |
          set -euo pipefail
          # Managed mode: the database is provider-owned (e.g. AWS RDS / Cloud SQL).
          # GeoLens backup covers OBJECT STORAGE ONLY; the DB is recovered by the
          # provider from a native snapshot. Model the pairing:
          #   (a) "Provider snapshot" — seed a fresh DB directly via SQL with the
          #       same rows (does NOT go through restore.sh's docker-compose-exec
          #       path, which does not apply to an external managed DB).
          #   (b) Object-storage recovery — pull the staging archive that the
          #       backup image uploaded to MinIO in the bundled-mode step above.
          #   (c) Functional-pairing assert — DB rows present + objects present.
          SNAP=geolens_ci_mgd_snap_$$

          # (a) "Provider snapshot" — create and seed the DB directly via SQL.
          createdb -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" "$SNAP"
          psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$SNAP" -v ON_ERROR_STOP=1 -c \
            "CREATE SCHEMA IF NOT EXISTS catalog;
             CREATE TABLE catalog.records (id serial PRIMARY KEY, name text);
             CREATE TABLE catalog.datasets (id serial PRIMARY KEY, slug text);
             INSERT INTO catalog.records (name) SELECT 'img-r-'||g FROM generate_series(1, 113) g;
             INSERT INTO catalog.datasets (slug) SELECT 'img-d-'||g FROM generate_series(1, 57) g;"
          SNAP_R=$(psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$SNAP" -tAc "SELECT COUNT(*) FROM catalog.records;")
          SNAP_D=$(psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$SNAP" -tAc "SELECT COUNT(*) FROM catalog.datasets;")
          # Hard row-count asserts — must not be weakened with || true.
          [ "$SNAP_R" = "113" ] || { echo "FAIL: managed-mode snapshot DB records wrong: $SNAP_R"; exit 1; }
          [ "$SNAP_D" = "57" ]  || { echo "FAIL: managed-mode snapshot DB datasets wrong: $SNAP_D"; exit 1; }
          echo "  managed-mode snapshot DB: records=${SNAP_R} datasets=${SNAP_D}"

          # (b) Object-storage recovery — pull staging archive from MinIO.
          #     The backup image uploaded it (under backups/daily/) in the step above.
          export AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=us-east-1
          AWS="aws --endpoint-url $S3_ENDPOINT"

          STAGING_KEY=$($AWS s3 ls "s3://$S3_BUCKET/backups/daily/" \
            | grep 'staging-.*\.tar\.gz' | awk '{print $4}' | head -1)
          [ -n "$STAGING_KEY" ] || { echo "FAIL: managed-mode: no staging archive in MinIO"; exit 1; }
          $AWS s3 cp "s3://$S3_BUCKET/backups/daily/$STAGING_KEY" /tmp/ci-mgd-staging.tar.gz
          mkdir -p /tmp/ci-mgd-staging-out
          tar xzf /tmp/ci-mgd-staging.tar.gz -C /tmp/ci-mgd-staging-out
          diff -r /tmp/ci-staging /tmp/ci-mgd-staging-out
          STAGING_FILES=$(find /tmp/ci-mgd-staging-out -type f | wc -l | tr -d ' ')
          echo "  managed-mode object-storage: ${STAGING_FILES} file(s) restored from archive"

          echo "PASS [MANAGED MODE]: provider-snapshot DB (records=${SNAP_R} datasets=${SNAP_D}) + object-storage archive verified"
          dropdb -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" --if-exists "$SNAP"

  openapi-snapshot:
    name: OpenAPI Snapshot Drift
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.sdks == 'true' || (github.event_name == 'push' && needs.changes.outputs.queue_verified != 'true') || github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # Padding values to satisfy app.core.config.Settings() validation —
      # this job imports the FastAPI app to dump the schema; it never
      # connects to a DB or runs admin auth.
      JWT_SECRET_KEY: openapi-snapshot-padding-key-32chars
      POSTGRES_PASSWORD: ci-padding-no-db
      GEOLENS_ADMIN_USERNAME: admin
      GEOLENS_ADMIN_PASSWORD: geolens-ci-admin-password
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.10.2"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Verify openapi.json is up to date
        run: uv run python scripts/dump_openapi.py --check

  sdks-check:
    name: SDKs Drift Gate
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.sdks == 'true' || (github.event_name == 'push' && needs.changes.outputs.queue_verified != 'true') || github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      # Match the OpenAPI snapshot job's env so dump_openapi.py runs
      JWT_SECRET_KEY: sdks-check-padding-key-32characters-here
      POSTGRES_PASSWORD: ci-padding-no-db
      GEOLENS_ADMIN_USERNAME: admin
      GEOLENS_ADMIN_PASSWORD: geolens-ci-admin-password
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.10.2"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - name: Install backend dependencies (for dump_openapi.py)
        working-directory: backend
        run: uv sync --locked --dev

      - name: Install TypeScript SDK dependencies (locked)
        working-directory: sdks/typescript
        # Same npm-ci-stall settings as License Check
        # (frontend)'s Install step, applied here for consistency —
        # any job restoring the npm cache and then fetching from the
        # registry can hit the same registry stall.
        env:
          NPM_CONFIG_FETCH_TIMEOUT: "30000"
          NPM_CONFIG_FETCH_RETRIES: "2"
          NPM_CONFIG_LOGLEVEL: http
        run: npm ci

      - name: Regenerate SDKs and check for drift
        run: make sdks-check

  # ---------- version coherence ----------
  # Assert every version site agrees (backend/cli/sdks×2/root+frontend
  # package.json/openapi.json info.version/main.py fallback constant/the 5
  # lockfiles that embed the package's own version). Blocks a
  # release where one site silently drifted from the rest. Pure stdlib (tomllib
  # + json + re); no DB, no Docker, runs on every push/PR.
  version-coherence:
    name: Version Coherence
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Check all version sites agree
        run: python scripts/check_version_coherence.py

      # The CHANGELOG half of that gate only helps if it asks the same question
      # release.yml asks. This asserts the two extractions agree case for case,
      # including the empty-section and prerelease-tag paths that both fall back
      # to a filtered git log.
      - name: Check the CHANGELOG gate tracks release.yml
        run: python scripts/tests/test-changelog-gate.py

      # The reference-style compare links at the bottom of CHANGELOG.md are a
      # separate block from the `## [version]` section above: a release could
      # otherwise ship with `[Unreleased]` still comparing from the previous tag
      # and no link for the new version. Pins the gate's link assertions and
      # bump_version.py's mechanical write of both lines.
      - name: Check the CHANGELOG compare links
        run: python scripts/tests/test-changelog-links.py

  # ---------- docs contract ----------
  # Enforce docs-contract.json: validates the contract against install.sh +
  # pyproject (so it can't drift from the binaries) and scans the READMEs for
  # the forbidden drift patterns (stale compose filename, raw-port OGC endpoints,
  # overbroad standards claims, weak default admin credentials). getgeolens.com
  # vendors a copy of this contract and runs the same forbidden list over its
  # site/docs content.
  # Pure stdlib; runs on every push/PR.
  docs-contract:
    name: Docs Contract
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Check docs contract (install/ports/version + forbidden patterns)
        run: python scripts/check_docs_contract.py

      - name: Public surface gate (launch-sensitive terms)
        run: make public-surface-check

      - name: Surface gate regression tests
        run: python -m unittest tests.test_check_public_surface tests.test_check_deployed_surface

  # ---------- README assets ----------
  # Gate over the committed README screenshots in .github/assets/.
  #
  # Pins every README image to its exact size (see scripts/check-readme-assets.mjs
  # for why). No path filter on purpose: it also catches a manifest edit that
  # quietly unpins a file. Pure stdlib Node, no DB, browser or network.
  readme-assets:
    name: README Assets
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22

      # No `npm ci` — the script is dependency-free stdlib Node, so the job stays
      # a few seconds.
      - name: Check committed README image dimensions
        run: npm run check:readme-assets

  # ---------- monitoring ----------
  # infra/monitoring/alerts.test.yml replays every alert rule
  # against synthetic series, and only this job runs it. A
  # PromQL expression that no longer parses, or an expected-alert case that
  # stopped holding, would ship green — the backend suite only reads
  # those files as text. promtool is the only thing that can evaluate a rule.
  monitoring-rules:
    name: Monitoring Rules
    needs: changes
    if: needs.changes.outputs.monitoring == 'true' || (github.event_name == 'push' && needs.changes.outputs.queue_verified != 'true') || github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      # Same image RUNBOOK.md §4 tells operators to run Prometheus from, pinned
      # by digest so the gate cannot change under us on a tag re-push.
      PROMETHEUS_IMAGE: prom/prometheus:v3.6.0@sha256:76947e7ef22f8a698fc638f706685909be425dbe09bd7a2cd7aca849f79b5f64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # `promtool test rules` reports SUCCESS on a file that declares no cases
      # at all, and `check rules` is happy with a rule nothing exercises. Both
      # would be a green step asserting nothing, which is the failure mode this
      # whole job exists to close, so count the cases before trusting the run.
      - name: Guard against an empty rule or case list
        run: |
          set -euo pipefail
          alerts=$(grep -c '^      - alert:' infra/monitoring/alerts.yml)
          cases=$(grep -c '^        alertname:' infra/monitoring/alerts.test.yml)
          echo "alerts.yml declares $alerts rules; alerts.test.yml asserts on $cases"
          if [ "$alerts" -lt 8 ]; then
            echo "::error::alerts.yml declares $alerts rules, expected at least 8"
            exit 1
          fi
          if [ "$cases" -lt "$alerts" ]; then
            echo "::error::alerts.test.yml has $cases alertname assertions for $alerts rules"
            exit 1
          fi

      - name: promtool check rules
        run: |
          docker run --rm -v "$PWD/infra/monitoring:/w:ro" \
            --entrypoint promtool "$PROMETHEUS_IMAGE" check rules /w/alerts.yml

      - name: promtool test rules
        run: |
          docker run --rm -v "$PWD/infra/monitoring:/w:ro" \
            --entrypoint promtool "$PROMETHEUS_IMAGE" test rules /w/alerts.test.yml

      # Nothing else validates the scrape config. It has
      # a dns_sd_configs block so the worker job discovers every replica, and a
      # typo there is a config Prometheus refuses at startup — which an
      # operator finds out about instead of CI.
      - name: promtool check config
        run: |
          docker run --rm -v "$PWD/infra/monitoring:/w:ro" \
            --entrypoint promtool "$PROMETHEUS_IMAGE" check config /w/prometheus.yml

  # ---------- CLI ----------
  # Structural enforcement that the CLI never grows
  # a direct httpx/requests dependency. Runs on cli/** OR sdks/python/**
  # changes (the SDK is the CLI's only HTTP surface — a regression in the
  # SDK can ripple into the CLI through a behavior change in the wrapper).
  cli-test:
    name: CLI Tests
    needs: changes
    if: needs.changes.outputs.cli == 'true' || needs.changes.outputs.backend == 'true' || (github.event_name == 'push' && needs.changes.outputs.queue_verified != 'true') || github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      # CLI round-trip tests import the FastAPI app and exercise DB-backed
      # routes; point the test lifecycle at the local CI PostgreSQL container.
      JWT_SECRET_KEY: cli-test-padding-key-32characters-here
      POSTGRES_USER: geolens
      POSTGRES_PASSWORD: geolens_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      GEOLENS_ADMIN_USERNAME: admin
      GEOLENS_ADMIN_PASSWORD: geolens-ci-admin-password
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Start PostgreSQL with PostGIS + pgvector
        working-directory: .
        # The image build below runs apt-get inside its Dockerfile; an
        # unreachable mirror there is the same hang class as the runner-level
        # apt steps, so this also gets a bound.
        timeout-minutes: 10
        run: |
          # The base-image pull inside `docker build` can hit a
          # transient Docker Hub token-fetch reset ("failed to fetch oauth
          # token: ... connection reset by peer"), which would evict an
          # otherwise-clean queue entry. Retry the whole build, since that is
          # where the pull happens.
          for attempt in 1 2 3 4 5; do
          docker build -t geolens-cli-test-db -f - . <<'DOCKERFILE' && break
          FROM postgis/postgis:18-3.6
          RUN apt-get update \
              && apt-get install -y --no-install-recommends postgresql-18-pgvector \
              && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          [ "$attempt" -eq 5 ] && exit 1
          echo "docker build failed (attempt $attempt/5), retrying in 10s..."
          sleep 10
          done
          docker run -d --name cli-test-postgres \
            -e POSTGRES_DB=postgres \
            -e POSTGRES_USER=geolens \
            -e POSTGRES_PASSWORD=geolens_test \
            -p 5432:5432 \
            geolens-cli-test-db
          for i in $(seq 1 30); do
            if docker exec cli-test-postgres pg_isready -U geolens -d postgres >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.10.2"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      # Install backend + SDK + CLI editable into ONE shared venv
      # (backend/.venv). The round-trip test in backend/tests/ imports
      # geolens_cli, so all three packages need to coexist in the env
      # that pytest uses. Using `uv pip install -e ../...` from backend/
      # places SDK + CLI editable into backend's venv (uv-sources in
      # cli/pyproject.toml resolves the geolens SDK dep against the
      # local sibling tree.
      - name: Install backend + SDK + CLI into shared venv
        working-directory: backend
        run: |
          uv sync --locked --dev
          uv pip install -e ../sdks/python
          uv pip install -e "../cli[dev]"

      # Structural gate (1/2): no direct httpx/requests imports.
      # `grep -rE` returns exit 1 when no matches → success for us; flip
      # to fail if we DID match.
      - name: OCCLI-06 — no httpx/requests imports in cli/geolens_cli/
        working-directory: cli
        run: |
          if grep -rE '^(import|from) (httpx|requests)' geolens_cli/; then
            echo "FAIL: CLI imports httpx or requests directly (OCCLI-06)"
            exit 1
          fi
          echo "OK: zero direct httpx/requests imports in cli/geolens_cli/"

      # Structural gate (2/2): cli/pyproject.toml declares no
      # httpx or requests dep (transitive via the geolens SDK is fine).
      # Use system python (not `uv run`) — the script only needs stdlib
      # tomllib, and `uv run` from cli/ would force a separate cli/.venv
      # resolution distinct from the shared backend/.venv used elsewhere.
      - name: OCCLI-06 — no httpx/requests in cli/pyproject.toml deps
        working-directory: cli
        run: |
          python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              d = tomllib.load(f)
          deps = d['project']['dependencies']
          forbidden = [x for x in deps if 'httpx' in x or 'requests' in x]
          assert not forbidden, f'FAIL: cli/pyproject.toml declares forbidden direct deps: {forbidden}'
          print('OK: no httpx/requests direct deps in cli/pyproject.toml')
          "

      - name: Manifest CLI contract tests
        working-directory: cli
        run: |
          uv run --project ../backend pytest -v \
            tests/test_manifest_schema.py \
            tests/test_manifest_validate.py \
            tests/test_manifest_apply.py \
            tests/test_manifest_examples.py \
            tests/test_manifest_cli_offline.py

      # CLI unit tests: run from cli/ so pytest picks up cli/pyproject.toml's
      # [tool.pytest.ini_options] testpaths, but use the SHARED backend venv
      # (which has cli + sdk + cli's deps installed editable) via
      # `--project ../backend` so pytest doesn't try to resolve a fresh
      # cli/.venv from PyPI.
      - name: CLI unit tests
        working-directory: cli
        run: uv run --project ../backend pytest -v

      - name: Manifest CLI round-trip contract test
        working-directory: backend
        run: uv run pytest tests/test_cli_round_trip.py::TestManifestApplyRoundTrip -v

      - name: CLI round-trip integration test
        working-directory: backend
        run: uv run pytest tests/test_cli_round_trip.py -v

  mcp-test:
    name: MCP Server Tests
    needs: changes
    if: needs.changes.outputs.mcp == 'true' || (github.event_name == 'push' && needs.changes.outputs.queue_verified != 'true') || github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    # Compose boot + image build for the live tier need headroom on a shared
    # runner; the e2e-smoke job uses the same budget for a larger stack.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.10.2"
          enable-cache: true
          cache-dependency-glob: "mcp/pyproject.toml"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      # DB-less unit tests (httpx.MockTransport). The geolens SDK resolves from
      # the sibling tree via mcp/pyproject.toml [tool.uv.sources]; `mcp` comes
      # from PyPI. No Postgres needed — every tool is mocked at the transport.
      - name: MCP server unit tests
        run: make mcp-test

      # ---- Live-contract tier ----
      # The unit tests above are transport-mocked and can't see a backend
      # change breaking what the tools actually return. Boot db+migrate+api
      # from THIS checkout (same .env recipe as the e2e jobs, minus the
      # services the tier doesn't need — no worker/frontend/titiler) and run
      # every MCP tool against the real API, asserting response shape.
      - name: Create .env file
        run: |
          cp .env.example .env
          # Override the dev defaults with CI-distinct values. JWT_SECRET_KEY
          # must be ≥ 32 chars to satisfy the Settings validator.
          sed -i -E 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=geolens_dev|' .env
          sed -i -E 's|^JWT_SECRET_KEY=.*|JWT_SECRET_KEY=mcp-live-secret-key-padding-32chars-min|' .env
          # BOTH admin values must land in .env before
          # compose up — .env.example ships GEOLENS_ADMIN_USERNAME= blank,
          # compose interpolates it with no default, and the boot guard
          # FATALs on an empty username. (The e2e jobs solve this by
          # exporting to GITHUB_ENV before compose up; step-scoped env on
          # the test step arrives after boot and cannot help.)
          sed -i -E 's|^GEOLENS_ADMIN_USERNAME=.*|GEOLENS_ADMIN_USERNAME=admin|' .env
          sed -i -E 's|^GEOLENS_ADMIN_PASSWORD=.*|GEOLENS_ADMIN_PASSWORD=geolens-ci-admin-password|' .env
          echo "DATABASE_SSL_MODE=disable" >> .env

      - name: Start db + api
        run: docker compose up -d --wait --wait-timeout 120 api

      - name: MCP live-contract tests
        env:
          # .env.example maps the api container to host port 8001 (API_PORT).
          GEOLENS_INSTANCE: http://localhost:8001
          GEOLENS_ADMIN_USERNAME: admin
          GEOLENS_ADMIN_PASSWORD: geolens-ci-admin-password
        run: make mcp-live-test

      - name: Docker Compose logs
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop services
        if: always()
        run: docker compose down

  backend-test:
    name: Backend Tests (${{ matrix.shard }}/4)
    needs: changes
    # Alembic-only changes must run the suite too.
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.alembic == 'true' || (github.event_name == 'push' && needs.changes.outputs.queue_verified != 'true') || github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # scripts/ci_backend_shards.py deals the test files across SHARD_COUNT
        # shards; keep the matrix and SHARD_COUNT in step.
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: backend
    env:
      SHARD_COUNT: 4
      POSTGRES_USER: geolens
      POSTGRES_PASSWORD: geolens_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      # Must be ≥ 32 chars to satisfy the Settings validator (backend/app/core/config.py).
      JWT_SECRET_KEY: test-secret-key-for-ci-padding-32chars
      GEOLENS_ADMIN_USERNAME: admin
      GEOLENS_ADMIN_PASSWORD: geolens-ci-admin-password
      PYTHONPATH: .
      # PEP 669 sys.monitoring coverage core (Python 3.12+, coverage >= 7.4):
      # far cheaper than the default C-trace and combines correctly under xdist.
      COVERAGE_CORE: sysmon
      # Visible (non-dot) name so upload-artifact ships it; pytest-cov combines
      # the xdist workers' data into this file.
      COVERAGE_FILE: coverage.shard-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Start PostgreSQL with PostGIS + pgvector
        working-directory: .
        # The image build below runs apt-get inside its Dockerfile; an
        # unreachable mirror there is the same hang class as the runner-level
        # apt steps, so this also gets a bound.
        timeout-minutes: 10
        run: |
          # The base-image pull inside `docker build` can hit a
          # transient Docker Hub token-fetch reset ("failed to fetch oauth
          # token: ... connection reset by peer"), which would evict an
          # otherwise-clean queue entry. Retry the whole build, since that is
          # where the pull happens.
          for attempt in 1 2 3 4 5; do
          docker build -t geolens-test-db -f - . <<'DOCKERFILE' && break
          FROM postgis/postgis:18-3.6
          RUN apt-get update \
              && apt-get install -y --no-install-recommends postgresql-18-pgvector \
              && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          [ "$attempt" -eq 5 ] && exit 1
          echo "docker build failed (attempt $attempt/5), retrying in 10s..."
          sleep 10
          done
          docker run -d --name test-postgres \
            -e POSTGRES_DB=postgres \
            -e POSTGRES_USER=geolens \
            -e POSTGRES_PASSWORD=geolens_test \
            -p 5432:5432 \
            geolens-test-db
          for i in $(seq 1 30); do
            if docker exec test-postgres pg_isready -U geolens -d postgres >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.10.2"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install system dependencies
        # See backup-roundtrip's "Install postgresql-client + tooling" for
        # the full incident writeup (a silent https fallback stalled a step
        # for the full 10-minute cap, which an http-only timeout never bounds).
        timeout-minutes: 16
        run: |
          for i in 1 2 3; do
            sudo timeout -k 10 90 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update \
              && sudo timeout -k 10 150 apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y gdal-bin xmlsec1 \
              && break
            echo "apt attempt $i failed"
            [ "$i" = 3 ] && exit 1
            # A stalled Azure mirror stays stalled for the retries, so fall back to archive.ubuntu.com.
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt 2>/dev/null || true
            sudo pkill -TERM -x apt-get || true
            sudo pkill -TERM -x dpkg || true
            sleep 5
            sudo pkill -KILL -x apt-get || true
            sudo pkill -KILL -x dpkg || true
            for _ in 1 2 3 4 5; do
              pgrep -x apt-get >/dev/null || pgrep -x dpkg >/dev/null || break
              sleep 2
            done
            sudo timeout -k 10 30 dpkg --configure -a || true
            sleep 10
          done

      - name: Install Python dependencies
        run: uv sync --locked --dev

      - name: Set up database extensions, roles, and schemas
        run: |
          PGPASSWORD=geolens_test psql -h localhost -U geolens -d postgres -c "
            CREATE EXTENSION IF NOT EXISTS postgis;
            CREATE EXTENSION IF NOT EXISTS pg_trgm;
            CREATE EXTENSION IF NOT EXISTS vector;
            CREATE EXTENSION IF NOT EXISTS unaccent;
            CREATE SCHEMA IF NOT EXISTS catalog;
            CREATE SCHEMA IF NOT EXISTS data;
            ALTER DATABASE postgres SET search_path TO catalog, data, public;
            DO \$\$ BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'geolens_reader') THEN
                CREATE ROLE geolens_reader NOLOGIN;
              END IF;
            END \$\$;
            GRANT USAGE ON SCHEMA data TO geolens_reader;
            ALTER DEFAULT PRIVILEGES IN SCHEMA data GRANT SELECT ON TABLES TO geolens_reader;
          "

      - name: Run migrations
        # `heads` (plural) applies every Alembic branch head and is also safe
        # when the migration graph currently has a single head.
        run: uv run alembic upgrade heads

      - name: Normalize search_path for the drift check (MIG-03)
        # `alembic check` reflects the live schema and diffs it against the ORM
        # metadata. Our models are explicitly schema-qualified
        # (`__table_args__ = {"schema": "catalog"}`) and env.py runs the check with
        # include_schemas=True. The setup step set the postgres DB default
        # search_path to `catalog, data, public` — with catalog FIRST it is the
        # connection-default schema, so alembic reflects every catalog table under
        # the unqualified/None key while the metadata is keyed under explicit
        # `catalog`. They never match, so `alembic check` reports ALL tables as
        # add_table (a wholesale empty-reflection false positive, NOT real drift).
        # Dropping catalog from the default (keeping data, public) makes reflection
        # key catalog tables under `catalog`, matching the qualified metadata, so
        # the gate fires only on REAL drift. Migrations are unaffected: each is
        # schema-qualified and 0002_procrastinate sets its own search_path, so they
        # already ran above under `catalog, data, public`.
        run: |
          PGPASSWORD=geolens_test psql -h localhost -U geolens -d postgres -c \
            "ALTER DATABASE postgres SET search_path TO data, public;"

      # Autogenerate drift gate. With the DB now at head, `alembic check`
      # exits non-zero if the ORM models have drifted from the migration scripts
      # (e.g. a model column added without a matching migration). env.py's
      # include_object filter hides extension-provided SAML columns when no
      # extension is discovered, so this gate is clean on OSS-only runs and only
      # fires on REAL drift. Companion to the `make alembic-check` one-liner.
      - name: Alembic drift check (MIG-03)
        run: uv run alembic check

      - name: Manifest backend apply contract tests
        # These also run inside whichever shard owns each file; one shard is
        # enough for the standalone pass.
        if: matrix.shard == 1
        run: |
          uv run pytest -v \
            tests/test_manifest_apply_api.py \
            tests/test_manifest_apply_service.py \
            tests/test_manifest_apply_vrt.py \
            tests/test_manifest_apply_roundtrip.py \
            tests/test_layering.py

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        if: matrix.shard == 1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - name: TypeScript SDK round trip against the in-process API
        # The shards skip the Node-driven tests because nothing builds
        # sdks/typescript/dist for them. Build it here, in one shard, and fail
        # rather than skip if Node, dist or uvicorn is missing.
        if: matrix.shard == 1
        env:
          GEOLENS_REQUIRE_TS_SDK: "1"
          NPM_CONFIG_FETCH_TIMEOUT: "30000"
          NPM_CONFIG_FETCH_RETRIES: "2"
        run: |
          (cd ../sdks/typescript && npm ci && npm run build)
          uv run pytest -v tests/test_sdks_round_trip.py -k typescript

      - name: List this shard's tests
        # Compared with the full collection by the coverage job, so a test file
        # no shard picks up (or two shards both pick up) fails the build.
        run: |
          mapfile -t FILES < <(python3 ../scripts/ci_backend_shards.py "$SHARD_COUNT" "${{ matrix.shard }}")
          echo "shard ${{ matrix.shard }}/$SHARD_COUNT: ${#FILES[@]} files"
          uv run pytest --collect-only -q -m 'not perf' "${FILES[@]}" \
            | grep -E '^tests/[^ ]+\.py::' | sort > "collected-shard-${{ matrix.shard }}.txt"
          wc -l "collected-shard-${{ matrix.shard }}.txt"

      - name: Run shard tests with coverage
        # Each shard records coverage data only; the Backend Coverage job
        # combines them and enforces the 80% floor (aligned with pyproject's
        # fail_under; never lower it without a CHANGELOG rationale). The
        # per-shard --cov-fail-under=0 overrides that pyproject value, which a
        # single shard cannot meet alone.
        #
        # -n 4 matches the runner's 4 vCPUs; -n 6 measured slightly slower
        # because the suite already saturates the cores. --dist loadgroup
        # (pyproject addopts) co-locates the global-state tenancy tests on one
        # worker. -m 'not perf' folds in the lifecycle tests. --durations=25
        # keeps the slowest-test tail visible in every run.
        run: |
          mapfile -t FILES < <(python3 ../scripts/ci_backend_shards.py "$SHARD_COUNT" "${{ matrix.shard }}")
          uv run pytest -n 4 -v --tb=short --durations=25 -m 'not perf' \
            --junitxml="junit-shard-${{ matrix.shard }}.xml" \
            --cov=app --cov-report= --cov-fail-under=0 "${FILES[@]}"

      - name: Verify SAML fixtures unchanged after pytest
        run: |
          # Catch BOTH modified tracked files AND newly-created fixture files
          # like idp_response_*.xml.b64, which are untracked, so
          # `git diff --quiet` would silently miss them.
          DIRTY=$(git status --porcelain -- tests/fixtures/saml/)
          if [ -n "$DIRTY" ]; then
            echo "::error::SAML fixture dir mutated by pytest run -- regression of phase 227 (saml-test-fixture-tmp-path)."
            echo "$DIRTY"
            git diff --stat -- tests/fixtures/saml/
            git diff -- tests/fixtures/saml/ | head -200
            exit 1
          fi

      - name: Upload shard coverage data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: backend-coverage-shard-${{ matrix.shard }}
          path: |
            backend/coverage.shard-${{ matrix.shard }}
            backend/collected-shard-${{ matrix.shard }}.txt
          if-no-files-found: error
          retention-days: 1

      - name: Upload shard test timings
        # scripts/ci_backend_shards.py --timings reads these to refresh the
        # per-file durations it balances the shards with.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: backend-junit-shard-${{ matrix.shard }}
          path: backend/junit-shard-${{ matrix.shard }}.xml
          if-no-files-found: warn
          retention-days: 14

      # The gpkg byte-determinism gate
      # (test_export_artifact_cache_1532.py::test_every_export_format_is_byte_deterministic)
      # can fail rarely, in an environment- or time-dependent way, so a failure
      # uploads evidence instead of leaving the cause to a guess.
      # This job runs pytest directly on the runner (Postgres is started via
      # a plain `docker run`, not docker compose exec into a container), so
      # `backend/test-artifacts/determinism/` — written by the test itself
      # only when a digest assertion is about to fail — is already on the
      # runner filesystem; nothing needs to be copied out of a container.
      # `if: failure()` (an explicit status function, not a bare `if:`, which
      # silently ANDs success()) so this only fires when a step above failed.
      - name: Upload determinism evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: determinism-evidence-${{ matrix.shard }}
          path: backend/test-artifacts/determinism/
          if-no-files-found: ignore
          retention-days: 14

  # Combines the shards' coverage data and gates the total. Skipped when
  # Backend Tests skipped; blocked (not run) when any shard failed, which CI OK
  # reports through backend-test itself.
  backend-coverage:
    name: Backend Coverage
    needs: backend-test
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_USER: geolens
      POSTGRES_PASSWORD: geolens_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      JWT_SECRET_KEY: test-secret-key-for-ci-padding-32chars
      GEOLENS_ADMIN_USERNAME: admin
      GEOLENS_ADMIN_PASSWORD: geolens-ci-admin-password
      PYTHONPATH: .
      SHARD_COUNT: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.10.2"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: uv sync --locked --dev

      - name: Download shard coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: backend-coverage-shard-*
          merge-multiple: true
          path: backend

      - name: Every test runs in exactly one shard
        run: |
          [ "$(ls collected-shard-*.txt | wc -l)" -eq "$SHARD_COUNT" ] \
            || { echo "::error::expected $SHARD_COUNT shard collections"; ls; exit 1; }
          [ "$(ls coverage.shard-* | wc -l)" -eq "$SHARD_COUNT" ] \
            || { echo "::error::expected $SHARD_COUNT coverage data files"; ls; exit 1; }
          uv run pytest --collect-only -q -m 'not perf' \
            | grep -E '^tests/[^ ]+\.py::' | sort > collected-full.txt
          cat collected-shard-*.txt | sort > collected-union.txt
          DUPES=$(uniq -d collected-union.txt)
          if [ -n "$DUPES" ]; then
            echo "::error::tests collected by more than one shard"
            echo "$DUPES" | head -20
            exit 1
          fi
          if ! diff collected-full.txt collected-union.txt > collected.diff; then
            echo "::error::the shards' tests differ from the full collection"
            head -40 collected.diff
            exit 1
          fi
          echo "$(wc -l < collected-full.txt) tests, each in exactly one shard"

      - name: Combine coverage and report
        run: |
          uv run coverage combine coverage.shard-*
          uv run coverage html -d htmlcov
          uv run coverage xml -o coverage.xml
          # fail_under comes from pyproject ([tool.coverage.report]); pass it
          # explicitly so the floor is visible here too.
          uv run coverage report --show-missing --fail-under=80

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: backend-coverage
          path: |
            backend/htmlcov/
            backend/coverage.xml
          retention-days: 14

  # ---------- alembic clean-DB upgrade smoke ----------
  # Exercise the full migration chain against a freshly-initialized PostGIS
  # container via the clean-DB upgrade
  # script. Builds the project's custom PostGIS+pgvector image, spins up a
  # throwaway DB, and runs `alembic upgrade head` from a clean state.
  # Catches migration-on-clean-DB breakage that the backend-test job can miss
  # because backend-test runs migrations on a DB that already saw earlier
  # migrations in test scope.
  alembic-clean-db:
    name: Alembic Clean-DB Upgrade
    needs: changes
    if: needs.changes.outputs.alembic == 'true' || (github.event_name == 'push' && needs.changes.outputs.queue_verified != 'true') || github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.10.2"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Run alembic clean-DB upgrade smoke
        run: ./backend/scripts/test_alembic_upgrade_clean_db.sh
        env:
          # The script reads these for the throwaway container; explicit
          # is better than relying on bash defaults.
          ALEMBIC_TEST_DB_PORT: 54399
          ALEMBIC_TEST_TIMEOUT: 90

  # ---------- previous-release compatibility ----------
  # A release's migrations run while the previous release's api and worker
  # still serve, as in a rolling upgrade. Boot the newest release and the
  # newest of the minor line before it from their published images, upgrade
  # the schema to this tree's heads under them, then read a dataset, ingest
  # one and list datasets. Advisory: it stays out of ci-ok and the queue.
  previous-release-compat:
    name: Previous-Release Compatibility
    needs: changes
    if: needs.changes.outputs.alembic == 'true' || needs.changes.outputs.compat == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.10.2"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked --no-dev

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the previous releases against this schema
        run: scripts/previous-release-compat.sh

  # ---------- frontend ----------
  frontend-lint:
    name: Frontend Lint & Typecheck
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || (github.event_name == 'push' && needs.changes.outputs.queue_verified != 'true') || github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.10.2"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # Same npm-ci-stall settings as License Check
        # (frontend)'s Install step, applied here for consistency —
        # any job restoring the npm cache and then fetching from the
        # registry can hit the same registry stall.
        env:
          NPM_CONFIG_FETCH_TIMEOUT: "30000"
          NPM_CONFIG_FETCH_RETRIES: "2"
          NPM_CONFIG_LOGLEVEL: http
        run: npm ci

      - name: Verify generated API types
        run: npm run types:check

      - name: Locale parity
        run: npm run test:i18n

      - name: Hardcoded toast strings
        run: npm run check:i18n:toast-strings

      - name: Changed namespaces exist in all languages
        run: npm run check:i18n:changed

      - name: ESLint
        run: npm run lint

      # The four sec lint pins in package.json need a step to run
      # them. The *-regression scripts strip inline eslint-disable comments and
      # assert the security rule still FIRES on its fixture (exit != 0); the
      # *-no-false-positive scripts assert the sanitized fixture stays clean.
      # Without this step, an eslint-config change that silently drops
      # the token-in-localStorage ban or react/no-danger would land unnoticed.
      - name: ESLint security-rule regression pins
        run: |
          npm run lint:sec-s14-regression
          npm run lint:sec-s14-no-false-positive
          npm run lint:sec-fu-03-regression
          npm run lint:sec-fu-03-no-false-positive

      - name: TypeScript check
        # `npx tsc --noEmit` is a no-op here: the solution-style root tsconfig has an
        # empty `files`/`include`, so it compiles nothing and always exits 0. The real
        # type gate is `tsc -b --noEmit`, which walks the project references.
        run: npm run typecheck

      - name: Unused exports and files
        # Test files count as consumers, so this is knip's default mode; see knip.jsonc.
        run: npm run knip

  frontend-test:
    name: Frontend Tests
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || (github.event_name == 'push' && needs.changes.outputs.queue_verified != 'true') || github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # Same npm-ci-stall settings as License Check
        # (frontend)'s Install step, applied here for consistency —
        # any job restoring the npm cache and then fetching from the
        # registry can hit the same registry stall.
        env:
          NPM_CONFIG_FETCH_TIMEOUT: "30000"
          NPM_CONFIG_FETCH_RETRIES: "2"
          NPM_CONFIG_LOGLEVEL: http
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

  # ---------- license-check ----------
  # BLOCKING license-checker against the frontend production dependency tree:
  # fails CI on any license outside the curated permissive allowlist (validated
  # against the current tree). The JSON report is still uploaded as an artifact.
  license-check:
    name: License Check (frontend)
    runs-on: ubuntu-26.04
    if: always()  # run even if other jobs fail
    timeout-minutes: 5
    # job-scoped, not step-scoped: a step-level env: on "Install frontend dependencies" only
    # covers `npm ci` — the next step's two `npx --yes license-checker`
    # calls fetch that package over the network too (it's in neither
    # package.json nor package-lock.json, unlike `npx playwright` elsewhere
    # in this file, which resolves to the lockfile-installed binary and
    # never hits the registry). A step-scoped var left those npx fetches on
    # npm's 300000ms default, so a stall there could still eat the whole
    # 5-minute job cap silently. Job-level env covers both steps.
    env:
      NPM_CONFIG_FETCH_TIMEOUT: "30000"
      NPM_CONFIG_FETCH_RETRIES: "2"
      NPM_CONFIG_LOGLEVEL: http
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies (locked)
        working-directory: frontend
        # PR runs of the License Check job have printed nothing for five
        # minutes after the npm cache restored, then hit the job's
        # timeout-minutes cap with the run marked "cancelled" rather
        # than failed. npm's own defaults (`npm config list -l`:
        # fetch-timeout=300000, fetch-retries=2) let one stalled
        # registry connection sit for up to five minutes per attempt,
        # which is the whole job budget here on its own. Lowering
        # fetch-timeout makes a stalled fetch fail (and retry) fast
        # instead of silently eating the job cap; NPM_CONFIG_LOGLEVEL=http
        # prints the request line for each fetch, so a future stall names
        # the package/URL instead of five minutes of silence. (Settings are
        # job-scoped above so they also cover the npx license-checker
        # fetches in the next step.)
        run: npm ci

      - name: Run license-checker (blocking — curated allowlist)
        working-directory: frontend
        # BLOCKING: fails CI if a production dependency carries a license outside
        # the curated permissive allowlist (validated against the current tree:
        # MIT/ISC/BSD/Apache-2.0/MPL-2.0/OFL-1.1/0BSD + two dual-license SPDX
        # expressions). Exclusions:
        #   --excludePrivatePackages          drops the app's own private package.
        #   @mapbox/jsonlint-lines-primitives is MIT but declares its license as a
        #     URL (reported "Custom"), so it is excluded by name, not by license.
        # A new disallowed license (or a jsonlint version bump) fails here on
        # purpose — extend the allowlist or the exclusion deliberately.
        run: |
          mkdir -p ../artifacts
          npx --yes license-checker --production --json --out ../artifacts/license-report.json
          npx --yes license-checker --production \
            --onlyAllow 'MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;MPL-2.0;OFL-1.1;0BSD;CC0-1.0;Unlicense;Python-2.0;BlueOak-1.0.0;(MIT OR Apache-2.0);(BSD-3-Clause AND Apache-2.0)' \
            --excludePrivatePackages \
            --excludePackages '@mapbox/jsonlint-lines-primitives@2.0.2' \
            --summary

      - name: Upload license report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: license-report
          path: artifacts/license-report.json
          retention-days: 30

  # ---------- security ----------
  security-scan:
    name: Security Scan
    needs: changes
    if: needs.changes.outputs.backend == 'true' || (github.event_name == 'push' && needs.changes.outputs.queue_verified != 'true') || github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.10.2"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run bandit (static security analysis)
        run: uv run bandit -r app/ -c pyproject.toml --severity-level high --confidence-level high

      - name: Run pip-audit (dependency vulnerability scan)
        run: uv run pip-audit --strict --desc

  # ---------- required-checks aggregator ----------
  # Most jobs below are path-filtered (skippable via `if:`), and GitHub treats a
  # skipped required context as PASSING — the "main red while PRs green" hole.
  # This job always runs and inspects each needed job's actual result: failure
  # or cancelled fails it; skipped and success pass. Branch protection should
  # require THIS single context instead of the individual skippable jobs.
  #
  # "skipped counts as pass" is right for a path-filtered PR and
  # would be a hole in the merge queue, where a skip means "never ran against
  # this candidate merge". The rule stays as it is
  # because every job in this list actually
  # RUNS on merge_group, so there is nothing to mis-credit. If you add a job to
  # this aggregator, give it a merge_group clause too, or you have quietly
  # reopened the hole.
  #
  # Accessibility and stac-validate run on merge_group and are listed here:
  # a job that only runs once the batch lands on main cannot block the commit
  # that broke it, so a failure would gate nothing and just paint main red
  # with no owner.
  #
  # Still deliberately off merge_group: runtime-extension-image-probe (builds
  # images), e2e-test (the full nightly suite) and ai-evals (spends provider
  # tokens). They are not in this list and gate nothing here.
  ci-ok:
    name: CI OK
    needs:
      # Path-filtered jobs — these may legitimately skip on a PR; the gating
      # step below counts skipped as pass.
      - backend-lint
      - backend-test
      - backend-coverage
      - installer-test
      - backup-roundtrip
      - openapi-snapshot
      - sdks-check
      - cli-test
      - mcp-test
      - alembic-clean-db
      - frontend-lint
      - frontend-test
      - security-scan
      # The promtool suite gates nothing unless it is here:
      # branch protection only sees CI OK.
      - monitoring-rules
      # Always-run jobs must feed the aggregator too: otherwise
      # a failure in version-coherence or docs-contract could not block a
      # merge (branch protection only sees CI OK). changes and pre-commit are
      # included so the aggregator is complete on its own: a failed `changes`
      # job skips every path-filtered job above, which would otherwise leave
      # CI OK green having gated nothing. license-check stays OUT on purpose:
      # it is advisory, and test_phase_279_compose_ci.py::
      # test_license_check_job_is_non_blocking fails any `needs:` on it.
      - changes
      - pre-commit
      - version-coherence
      - docs-contract
      - readme-assets
      # PR-only browser gate; skipped (non-stack PRs, push, cron)
      # counts as pass below, failed blocks the merge.
      - e2e-smoke
      # Skipped on PRs (both stay off pull_request), which the step below
      # counts as pass, so per-PR cost stays zero. They run on merge_group, and
      # on a push the queue did not already pass, and there a failure blocks.
      - accessibility
      - stac-validate
    # always() alone would rubber-stamp: it only guarantees this job RUNS.
    # The step below does the real gating on needs.*.result.
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Fail if any needed job failed or was cancelled
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          BAD=$(echo "$NEEDS_JSON" | jq -r \
            'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')
          if [ -n "$BAD" ]; then
            echo "::error::Required jobs failed or were cancelled: $(echo "$BAD" | tr '\n' ' ')"
            exit 1
          fi
          echo "OK: no needed job failed (skipped counts as pass)"

  # ---------- runtime extension image probe matrix ----------
  # Builds BOTH the 'api' and 'worker' image targets and runs a python probe
  # asserting the in-repo dummy runtime extension (not Default) resolves on each.
  #
  # Proof: the worker bootstrap holds across both runtime images in a real
  # container (not just in pytest). The dummy runtime extension keeps
  # the probe self-contained in the public source tree.
  #
  # Trigger scope: push to main + manual dispatch only. This conserves
  # geolens-io free-tier Actions minutes — PRs do not burn two
  # docker-build+run cycles per push (the FULL e2e suite follows the same
  # convention; PRs run only the core smoke subset).
  runtime-extension-image-probe:
    name: "Runtime Extension Image Probe (${{ matrix.target }})"
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build ${{ matrix.target }} image with dummy runtime extension fixture baked in
        run: |
          # Build the OSS image target. The dummy runtime extension fixture lives at
          # backend/tests/fixtures/dummy_overlay/ (inside the backend/ build
          # context, copied to /app/tests/fixtures/dummy_overlay/ in the image).
          # The probe script imports it directly at /app/tests/fixtures/dummy_overlay/
          # via PYTHONPATH=/app — no entry-point registration needed at image-build time.
          docker build \
            --target ${{ matrix.target }} \
            --tag geolens-probe-${{ matrix.target }}:ci \
            .

      - name: "Probe runtime extension resolution on ${{ matrix.target }} image"
        run: |
          # Run the probe script inside the built image:
          # --with-dummy-overlay: directly installs the dummy runtime extension and asserts
          #   catalog_port is DummyCatalogPort (not DefaultCatalogPort).
          # PYTHONPATH=/app: makes tests.fixtures.dummy_overlay importable.
          # --no-healthcheck: container exits after the probe, no need to wait.
          # Exits 0 on PROBE PASSED, 1 on PROBE FAILED (fails this step).
          #
          # Note: the probe uses the OSS image with the dummy runtime extension
          # fixture baked into the image.
          #
          # Invoke via `uv run --no-dev python` (the image's production launch
          # pattern — see the api/worker CMD). The runtime image does NOT put the
          # /app/.venv on PATH, so a bare `--entrypoint python` runs the base-image
          # system interpreter with no project dependencies and the probe dies at
          # the first third-party import (`import structlog`). uv run activates the
          # baked /app/.venv so the probe exercises the real runtime.
          docker run \
            --rm \
            --no-healthcheck \
            -e PYTHONPATH=/app \
            -e JWT_SECRET_KEY=probe-padding-key-not-real-32chars \
            -e GEOLENS_ADMIN_USERNAME=probe \
            -e GEOLENS_ADMIN_PASSWORD=probe \
            -e POSTGRES_PASSWORD=probe \
            --entrypoint uv \
            geolens-probe-${{ matrix.target }}:ci \
            run --no-dev python scripts/probe_overlay_resolution.py --with-dummy-overlay

  # ---------- E2E (NIGHTLY / ON-DEMAND GATE — see .github/CONTRIBUTING.md "End-to-end (Playwright)") ----------
  # Runs on the nightly `schedule` cron and manual `workflow_dispatch` ONLY — it
  # stays skipped on push/PR so the FULL dockerized browser matrix never burns
  # the free-tier Actions budget per-PR. PRs get the small e2e:smoke:core subset
  # via the e2e-smoke job below. Reviewers still run the remaining
  # groups (`npm run e2e:smoke[:audit]`) locally before approving user-flow
  # changes; the cron provides the recurring full-suite signal, and a red
  # nightly files/refreshes a tracking issue (nightly-e2e-report, end of file).
  e2e-test:
    name: E2E Tests
    # Path-filtered prerequisites may be skipped on a test-only branch. Evaluate
    # this job anyway for scheduled and manual runs, but preserve their failures.
    if: >-
      always()
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-26.04
    needs: [backend-lint, backend-test, frontend-lint, frontend-test, security-scan]
    # A clean run includes fixture ingestion, 150+ checks, retries, and cleanup.
    # Keep enough headroom for the whole suite to finish on a shared runner.
    timeout-minutes: 30
    # Failing spec names travel to nightly-e2e-report as a job
    # output (readable from `needs` even when this job fails), so the
    # tracking issue can name specs instead of only "e2e-test: failure".
    outputs:
      failed_specs: ${{ steps.failed-specs.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Create .env file
        run: |
          cp .env.example .env
          # Override the dev defaults with CI-distinct values. JWT_SECRET_KEY must
          # be ≥ 32 chars to satisfy the Settings validator (backend/app/core/config.py).
          sed -i -E 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=geolens_dev|' .env
          sed -i -E 's|^JWT_SECRET_KEY=.*|JWT_SECRET_KEY=e2e-test-secret-key-padding-32chars-min|' .env
          sed -i -E 's|^GEOLENS_ADMIN_PASSWORD=.*|GEOLENS_ADMIN_PASSWORD=geolens-ci-admin-password|' .env
          echo "DATABASE_SSL_MODE=disable" >> .env

      - name: Export admin credentials for E2E
        run: |
          echo "GEOLENS_ADMIN_USERNAME=admin" >> $GITHUB_ENV
          echo "GEOLENS_ADMIN_PASSWORD=geolens-ci-admin-password" >> $GITHUB_ENV

      - name: Start services
        run: docker compose up -d --wait --wait-timeout 120

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # Same npm-ci-stall settings as License Check
        # (frontend)'s Install step, applied here for consistency —
        # any job restoring the npm cache and then fetching from the
        # registry can hit the same registry stall.
        env:
          NPM_CONFIG_FETCH_TIMEOUT: "30000"
          NPM_CONFIG_FETCH_RETRIES: "2"
          NPM_CONFIG_LOGLEVEL: http
        run: npm ci

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers and apt packages
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/playwright-apt-archives/*.deb
          key: playwright-${{ runner.os }}-ubuntu-26.04-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        timeout-minutes: 13
        run: |
          # playwright install-deps shells out to its own `apt-get update &&
          # apt-get install` for font/library packages, with no timeout of
          # its own (it has burned the full step cap). Three independent bounds, because
          # apt's own Acquire::http::Timeout is a socket INACTIVITY timeout,
          # not a minimum-transfer-rate one:
          #   - a genuinely dead connection is caught by the apt.conf.d
          #     write below.
          #   - a connection that stays open but trickles a few KB/s never
          #     goes inactive, so apt's timeout never fires (one run took
          #     5m26s to fetch a 5.6 MB font package from a degraded
          #     mirror). `timeout -k 10
          #     180` bounds each attempt regardless of why it's slow.
          #   - `timeout` only signals its DIRECT child; the real apt-get is
          #     a grandchild (npx -> node -> sudo -> sh -c -> apt-get) that
          #     sudo places outside its reach, so a cut attempt leaves
          #     apt-get running and holding the dpkg lock (retry
          #     attempts then died instantly with "Could not get
          #     lock /var/lib/dpkg/lock-frontend. It is held by process
          #     12362 (apt-get)"). Kill it and wait for it to actually exit
          #     before retrying. psmisc (fuser) is not confirmed installed
          #     on this runner image (no hit searching actions/runner-images'
          #     build scripts), so poll with pgrep/pkill (procps — confirmed
          #     present on the base Ubuntu 24.04 image, and already relied
          #     on below) instead of fuser.
          #
          # The cleanup's own `dpkg --configure -a` is timeout-wrapped too,
          # for the same reason: an unbounded maintainer script there could
          # eat the rest of the step cap.
          #
          # Worst case: 3 attempts * (180 + 10 kill-grace)s + 2 cleanups *
          # (5 + 5*2 + 30+10 + 10)s = 570 + 130 = 700s, under the 780s
          # (13-minute) step cap.
          echo 'Acquire::http::Timeout "30"; Acquire::https::Timeout "30"; Acquire::Retries "3";' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-fetch-timeouts >/dev/null
          # Keep downloaded .debs in a cacheable directory: the slow part of
          # this step is fetching them from the runner's apt mirror.
          mkdir -p "$HOME/playwright-apt-archives"
          echo "Dir::Cache::archives \"$HOME/playwright-apt-archives\";" \
            | sudo tee /etc/apt/apt.conf.d/99-ci-apt-archives >/dev/null
          for i in 1 2 3; do
            timeout -k 10 180 npx playwright install --with-deps chromium && break
            echo "playwright install attempt $i failed"
            [ "$i" = 3 ] && exit 1
            # A stalled Azure mirror stays stalled for the retries, so fall back to archive.ubuntu.com.
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt 2>/dev/null || true
            sudo pkill -TERM -x apt-get || true
            sudo pkill -TERM -x dpkg || true
            sleep 5
            sudo pkill -KILL -x apt-get || true
            sudo pkill -KILL -x dpkg || true
            for _ in 1 2 3 4 5; do
              pgrep -x apt-get >/dev/null || pgrep -x dpkg >/dev/null || break
              sleep 2
            done
            sudo timeout -k 10 30 dpkg --configure -a || true
            sleep 10
          done

      - name: Save Playwright browsers and apt packages
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/playwright-apt-archives/*.deb
          key: playwright-${{ runner.os }}-ubuntu-26.04-${{ steps.playwright-version.outputs.version }}

      - name: Run E2E tests
        run: npx playwright test

      # The default config does not cover the builder-hardening suite, so
      # it needs its own step. Chromium projects only: the runner
      # installs chromium alone, and the firefox/webkit projects are a local
      # reviewer concern. --reporter=line keeps it from clobbering the main
      # suite's playwright-report/ artifact.
      #
      # Both chromium projects (light and dark) run in one invocation; still no
      # firefox/webkit install needed since both are chromium under the
      # hood, just a different colorScheme.
      - name: Run builder-hardening E2E suite (chromium, light + dark)
        run: npx playwright test -c playwright.builder-hardening.config.ts --project=chromium-hardening --project=chromium-hardening-dark --reporter=line

      # Extract the failing spec names from the json reporter
      # output (playwright.config.ts) so the nightly report can say WHICH
      # specs are red and how many attempts each burned, instead of a bare
      # "e2e-test: failure".
      # Runs on failure too (the interesting case); a missing summary file
      # (e.g. npm ci died before Playwright ran) yields an empty output.
      # The builder-hardening suite uses --reporter=line and is not itemized.
      - name: Summarize failing specs
        id: failed-specs
        if: ${{ !cancelled() }}
        run: |
          {
            echo "list<<PW_SPECS_EOF"
            if [ -f playwright-summary.json ]; then
              jq -r '
                [.. | objects | .specs? // empty | .[]
                 | select(.ok == false)
                 | "- `\(.file):\(.line)` \(.title) (attempts: \([.tests[].results[]] | length))"]
                | unique | .[]
              ' playwright-summary.json || true
            fi
            echo "PW_SPECS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Docker Compose logs
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop services
        if: always()
        run: docker compose down

  # ---------- E2E smoke (PR gate) ----------
  # A nightly-only browser suite lets a PR that breaks
  # a core user flow merge green, and the breakage surfaces days later (the
  # nightly was once silently cancelled; see the
  # concurrency comment at the top of this file). This job runs the small
  # `e2e:smoke:core` script (root package.json; ~1 min of specs against the
  # composed stack) on PRs whose changes can affect it, per the `e2e` path
  # filter. It needs only `changes` so it starts in parallel with the
  # lint/test jobs instead of stacking on top of them; ci-ok still blocks the
  # merge if anything on either track fails.
  e2e-smoke:
    name: E2E Smoke (core)
    needs: changes
    # Unconditional on merge_group — no path filter, because there
    # is no reliable one there (see the `changes` job) and because the queue is
    # the last gate before main. It is also the one job in `ci-ok` whose whole
    # purpose is catching what a COMBINATION breaks: two PRs can each leave the
    # core flows green alone and break one together, which is the failure a
    # merge queue exists to stop.
    if: >-
      (github.event_name == 'pull_request' && needs.changes.outputs.e2e == 'true')
      || github.event_name == 'merge_group'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      # The recipe below mirrors the nightly e2e-test job above — same .env
      # shape, same compose boot, same toolchain — only the spec set differs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Create .env file
        run: |
          cp .env.example .env
          # Override the dev defaults with CI-distinct values. JWT_SECRET_KEY must
          # be ≥ 32 chars to satisfy the Settings validator (backend/app/core/config.py).
          sed -i -E 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=geolens_dev|' .env
          sed -i -E 's|^JWT_SECRET_KEY=.*|JWT_SECRET_KEY=e2e-test-secret-key-padding-32chars-min|' .env
          sed -i -E 's|^GEOLENS_ADMIN_PASSWORD=.*|GEOLENS_ADMIN_PASSWORD=geolens-ci-admin-password|' .env
          echo "DATABASE_SSL_MODE=disable" >> .env

      - name: Export admin credentials for E2E
        run: |
          echo "GEOLENS_ADMIN_USERNAME=admin" >> $GITHUB_ENV
          echo "GEOLENS_ADMIN_PASSWORD=geolens-ci-admin-password" >> $GITHUB_ENV

      - name: Start services
        run: docker compose up -d --wait --wait-timeout 120

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # Same npm-ci-stall settings as License Check
        # (frontend)'s Install step, applied here for consistency —
        # any job restoring the npm cache and then fetching from the
        # registry can hit the same registry stall.
        env:
          NPM_CONFIG_FETCH_TIMEOUT: "30000"
          NPM_CONFIG_FETCH_RETRIES: "2"
          NPM_CONFIG_LOGLEVEL: http
        run: npm ci

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers and apt packages
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/playwright-apt-archives/*.deb
          key: playwright-${{ runner.os }}-ubuntu-26.04-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        timeout-minutes: 13
        run: |
          # playwright install-deps shells out to its own `apt-get update &&
          # apt-get install` for font/library packages, with no timeout of
          # its own (it has burned the full step cap). Three independent bounds, because
          # apt's own Acquire::http::Timeout is a socket INACTIVITY timeout,
          # not a minimum-transfer-rate one:
          #   - a genuinely dead connection is caught by the apt.conf.d
          #     write below.
          #   - a connection that stays open but trickles a few KB/s never
          #     goes inactive, so apt's timeout never fires (one run took
          #     5m26s to fetch a 5.6 MB font package from a degraded
          #     mirror). `timeout -k 10
          #     180` bounds each attempt regardless of why it's slow.
          #   - `timeout` only signals its DIRECT child; the real apt-get is
          #     a grandchild (npx -> node -> sudo -> sh -c -> apt-get) that
          #     sudo places outside its reach, so a cut attempt leaves
          #     apt-get running and holding the dpkg lock (retry
          #     attempts then died instantly with "Could not get
          #     lock /var/lib/dpkg/lock-frontend. It is held by process
          #     12362 (apt-get)"). Kill it and wait for it to actually exit
          #     before retrying. psmisc (fuser) is not confirmed installed
          #     on this runner image (no hit searching actions/runner-images'
          #     build scripts), so poll with pgrep/pkill (procps — confirmed
          #     present on the base Ubuntu 24.04 image, and already relied
          #     on below) instead of fuser.
          #
          # The cleanup's own `dpkg --configure -a` is timeout-wrapped too,
          # for the same reason: an unbounded maintainer script there could
          # eat the rest of the step cap.
          #
          # Worst case: 3 attempts * (180 + 10 kill-grace)s + 2 cleanups *
          # (5 + 5*2 + 30+10 + 10)s = 570 + 130 = 700s, under the 780s
          # (13-minute) step cap.
          echo 'Acquire::http::Timeout "30"; Acquire::https::Timeout "30"; Acquire::Retries "3";' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-fetch-timeouts >/dev/null
