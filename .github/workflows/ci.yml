              pgrep -x apt-get >/dev/null || pgrep -x dpkg >/dev/null || break
              sleep 2
            done
            sudo timeout -k 10 30 dpkg --configure -a || true
            sleep 10
          done

      - name: Save Playwright browsers and apt packages
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/playwright-apt-archives/*.deb
          key: playwright-${{ runner.os }}-ubuntu-26.04-${{ steps.playwright-version.outputs.version }}

      - name: Run core E2E smoke suite
        run: npm run e2e:smoke:core

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: e2e-smoke-playwright-test-results
          path: test-results/
          retention-days: 14

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: e2e-smoke-playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Docker Compose logs
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop services
        if: always()
        run: docker compose down

  # ---------- nightly live AI evals ----------
  # The assertion-based NL→SQL evals (backend/tests/evals/) call the REAL
  # Anthropic API and execute the generated SQL through the production sandbox. They cost provider tokens, so they run ONLY on
  # schedule/workflow_dispatch — never on push/PR (fork PRs receive no secrets
  # anyway, so they could never run there). A failure here signals prompt/model/
  # sandbox drift, not ordinary flake: generate_sql pins temperature 0.0 and the
  # assertions leave the model freedom where it legitimately has it. Investigate
  # before rerunning.
  ai-evals:
    name: AI Evals (live provider)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    # Live-API job: cap it so a hung provider call can't burn Actions minutes.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_USER: geolens
      POSTGRES_PASSWORD: geolens_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      # Must be ≥ 32 chars to satisfy the Settings validator (backend/app/core/config.py).
      JWT_SECRET_KEY: test-secret-key-for-ci-padding-32chars
      GEOLENS_ADMIN_USERNAME: admin
      GEOLENS_ADMIN_PASSWORD: geolens-ci-admin-password
      PYTHONPATH: .
      RUN_AI_EVALS: "1"
      # With ANTHROPIC_API_KEY present, LLM_PROVIDER/LLM_MODEL_LIGHT resolve to
      # anthropic/haiku via their env_default factories — no further AI config.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Start PostgreSQL with PostGIS + pgvector
        working-directory: .
        # The image build below runs apt-get inside its Dockerfile; an
        # unreachable mirror there is the same hang class as the runner-level
        # apt steps, so this also gets a bound.
        timeout-minutes: 10
        run: |
          # The base-image pull inside `docker build` can hit a
          # transient Docker Hub token-fetch reset ("failed to fetch oauth
          # token: ... connection reset by peer"), which would evict an
          # otherwise-clean queue entry. Retry the whole build, since that is
          # where the pull happens.
          for attempt in 1 2 3 4 5; do
          docker build -t geolens-test-db -f - . <<'DOCKERFILE' && break
          FROM postgis/postgis:18-3.6
          RUN apt-get update \
              && apt-get install -y --no-install-recommends postgresql-18-pgvector \
              && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          [ "$attempt" -eq 5 ] && exit 1
          echo "docker build failed (attempt $attempt/5), retrying in 10s..."
          sleep 10
          done
          docker run -d --name test-postgres \
            -e POSTGRES_DB=postgres \
            -e POSTGRES_USER=geolens \
            -e POSTGRES_PASSWORD=geolens_test \
            -p 5432:5432 \
            geolens-test-db
          for i in $(seq 1 30); do
            if docker exec test-postgres pg_isready -U geolens -d postgres >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.10.2"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install system dependencies
        # See backup-roundtrip's "Install postgresql-client + tooling" for
        # the full incident writeup (a silent https fallback stalled a step
        # for the full 10-minute cap, which an http-only timeout never bounds).
        timeout-minutes: 16
        run: |
          for i in 1 2 3; do
            sudo timeout -k 10 90 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update \
              && sudo timeout -k 10 150 apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y gdal-bin xmlsec1 \
              && break
            echo "apt attempt $i failed"
            [ "$i" = 3 ] && exit 1
            # A stalled Azure mirror stays stalled for the retries, so fall back to archive.ubuntu.com.
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt 2>/dev/null || true
            sudo pkill -TERM -x apt-get || true
            sudo pkill -TERM -x dpkg || true
            sleep 5
            sudo pkill -KILL -x apt-get || true
            sudo pkill -KILL -x dpkg || true
            for _ in 1 2 3 4 5; do
              pgrep -x apt-get >/dev/null || pgrep -x dpkg >/dev/null || break
              sleep 2
            done
            sudo timeout -k 10 30 dpkg --configure -a || true
            sleep 10
          done

      - name: Install Python dependencies
        run: uv sync --locked --dev

      - name: Set up database extensions, roles, and schemas
        run: |
          PGPASSWORD=geolens_test psql -h localhost -U geolens -d postgres -c "
            CREATE EXTENSION IF NOT EXISTS postgis;
            CREATE EXTENSION IF NOT EXISTS pg_trgm;
            CREATE EXTENSION IF NOT EXISTS vector;
            CREATE EXTENSION IF NOT EXISTS unaccent;
            CREATE SCHEMA IF NOT EXISTS catalog;
            CREATE SCHEMA IF NOT EXISTS data;
            ALTER DATABASE postgres SET search_path TO catalog, data, public;
            DO \$\$ BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'geolens_reader') THEN
                CREATE ROLE geolens_reader NOLOGIN;
              END IF;
            END \$\$;
            GRANT USAGE ON SCHEMA data TO geolens_reader;
            ALTER DEFAULT PRIVILEGES IN SCHEMA data GRANT SELECT ON TABLES TO geolens_reader;
          "

      - name: Run migrations
        run: uv run alembic upgrade heads

      - name: Run live AI evals (NL→SQL and tool choice)
        run: uv run pytest tests/evals/ -v --tb=short

  # ---- E2E / A11Y trigger matrix ----
  # nightly cron ("0 7 * * *") + workflow_dispatch → e2e-test (full npx playwright test
  #                                                  + builder-hardening chromium suite)
  # release tag push (v*)                         → prod-smoke.yml (e2e:smoke:audit against
  #                                                  published images), gates release.yml via
  #                                                  workflow_run on "Prod Compose Smoke"
  # pull_request (e2e path filter) + merge_group  → e2e-smoke (e2e:smoke:core only)
  # merge_group + unverified push + nightly + dispatch → accessibility (axe + keyboard-nav, below)
  # merge_group + unverified push + nightly + dispatch → stac-validate (stac-api-validator, below)
  # nightly cron, e2e-test/accessibility not green → nightly-e2e-report (tracking issue, below)
  # An unverified push is one with no passing merge-queue run for its SHA.
  accessibility:
    name: Accessibility (axe + keyboard-nav)
    # always() so this still evaluates when the needed jobs are SKIPPED on
    # schedule/manual runs (they only force-run on push) — without it GitHub
    # auto-skips a job whose needs were skipped. The failure/cancelled guard
    # preserves the push gate: don't run the expensive a11y suite if an upstream
    # lint/test failed.
    #
    # This job gates ci-ok, so in the queue it runs against the candidate merge
    # and a failure keeps it out. It needs only the lints and the security scan
    # (a few minutes), not the test suites: the browser suite does not depend
    # on them, and waiting for the slowest backend shard would put ~8 min of a11y on
    # the critical path after ~18 min of pytest, so it runs alongside the
    # shards and finishes before they do.
    if: >-
      always()
      && ((github.event_name == 'push' && needs.changes.outputs.queue_verified != 'true') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group')
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-26.04
    needs: [changes, backend-lint, frontend-lint, security-scan]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Create .env file
        run: |
          cp .env.example .env
          sed -i -E 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=geolens_dev|' .env
          sed -i -E 's|^JWT_SECRET_KEY=.*|JWT_SECRET_KEY=e2e-test-secret-key-padding-32chars-min|' .env
          sed -i -E 's|^GEOLENS_ADMIN_PASSWORD=.*|GEOLENS_ADMIN_PASSWORD=geolens-ci-admin-password|' .env
          echo "DATABASE_SSL_MODE=disable" >> .env

      - name: Export admin credentials for E2E
        run: |
          echo "GEOLENS_ADMIN_USERNAME=admin" >> $GITHUB_ENV
          echo "GEOLENS_ADMIN_PASSWORD=geolens-ci-admin-password" >> $GITHUB_ENV

      - name: Start services
        run: docker compose up -d --wait --wait-timeout 120

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # Same npm-ci-stall settings as License Check
        # (frontend)'s Install step, applied here for consistency —
        # any job restoring the npm cache and then fetching from the
        # registry can hit the same registry stall.
        env:
          NPM_CONFIG_FETCH_TIMEOUT: "30000"
          NPM_CONFIG_FETCH_RETRIES: "2"
          NPM_CONFIG_LOGLEVEL: http
        run: npm ci

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers and apt packages
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/playwright-apt-archives/*.deb
          key: playwright-${{ runner.os }}-ubuntu-26.04-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        timeout-minutes: 13
        run: |
          # playwright install-deps shells out to its own `apt-get update &&
          # apt-get install` for font/library packages, with no timeout of
          # its own (it has burned the full step cap). Three independent bounds, because
          # apt's own Acquire::http::Timeout is a socket INACTIVITY timeout,
          # not a minimum-transfer-rate one:
          #   - a genuinely dead connection is caught by the apt.conf.d
          #     write below.
          #   - a connection that stays open but trickles a few KB/s never
          #     goes inactive, so apt's timeout never fires (one run took
          #     5m26s to fetch a 5.6 MB font package from a degraded
          #     mirror). `timeout -k 10
          #     180` bounds each attempt regardless of why it's slow.
          #   - `timeout` only signals its DIRECT child; the real apt-get is
          #     a grandchild (npx -> node -> sudo -> sh -c -> apt-get) that
          #     sudo places outside its reach, so a cut attempt leaves
          #     apt-get running and holding the dpkg lock (retry
          #     attempts then died instantly with "Could not get
          #     lock /var/lib/dpkg/lock-frontend. It is held by process
          #     12362 (apt-get)"). Kill it and wait for it to actually exit
          #     before retrying. psmisc (fuser) is not confirmed installed
          #     on this runner image (no hit searching actions/runner-images'
          #     build scripts), so poll with pgrep/pkill (procps — confirmed
          #     present on the base Ubuntu 24.04 image, and already relied
          #     on below) instead of fuser.
          #
          # The cleanup's own `dpkg --configure -a` is timeout-wrapped too,
          # for the same reason: an unbounded maintainer script there could
          # eat the rest of the step cap.
          #
          # Worst case: 3 attempts * (180 + 10 kill-grace)s + 2 cleanups *
          # (5 + 5*2 + 30+10 + 10)s = 570 + 130 = 700s, under the 780s
          # (13-minute) step cap.
          echo 'Acquire::http::Timeout "30"; Acquire::https::Timeout "30"; Acquire::Retries "3";' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-fetch-timeouts >/dev/null
          # Keep downloaded .debs in a cacheable directory: the slow part of
          # this step is fetching them from the runner's apt mirror.
          mkdir -p "$HOME/playwright-apt-archives"
          echo "Dir::Cache::archives \"$HOME/playwright-apt-archives\";" \
            | sudo tee /etc/apt/apt.conf.d/99-ci-apt-archives >/dev/null
          for i in 1 2 3; do
            timeout -k 10 180 npx playwright install --with-deps chromium && break
            echo "playwright install attempt $i failed"
            [ "$i" = 3 ] && exit 1
            # A stalled Azure mirror stays stalled for the retries, so fall back to archive.ubuntu.com.
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt 2>/dev/null || true
            sudo pkill -TERM -x apt-get || true
            sudo pkill -TERM -x dpkg || true
            sleep 5
            sudo pkill -KILL -x apt-get || true
            sudo pkill -KILL -x dpkg || true
            for _ in 1 2 3 4 5; do
              pgrep -x apt-get >/dev/null || pgrep -x dpkg >/dev/null || break
              sleep 2
            done
            sudo timeout -k 10 30 dpkg --configure -a || true
            sleep 10
          done

      # A run that hits this job's 15-minute cap with the log frozen at
      # "Running 68 tests using 1 worker" gets every step marked "cancelled",
      # which the two upload steps below (correctly) skip via !cancelled(), so
      # the ejected queue run would leave no report to look at. playwright.config.ts's CI
      # reporter set ([github, html, json]) writes only at the end, so
      # nothing streams to the log while a run is in progress; --reporter
      # here is scoped to this invocation only (CLI --reporter replaces,
      # rather than merges with, the config value) and keeps `html` so the
      # report-upload step still has something to upload, while adding
      # `line` for a per-test line as each test finishes.
      #
      # --timeout makes this job's per-test default explicit rather than
      # inherited from playwright.config.ts (60_000ms there today). Measured
      # on the two passing runs above, the step itself took 4m11s/4m29s for
      # 68 tests (~3.8s/test average), so 60s leaves ~15x headroom on a
      # normal test; the one test that legitimately needs more (the
      # beforeAll hook in accessibility.spec.ts, which calls
      # test.setTimeout(120_000) for its own seeding) already overrides its
      # own timeout and is unaffected by this default.
      #
      # --global-timeout turns a real hang into a Playwright-reported
      # failure (named test + stack, and a report artifact) instead of a
      # GitHub cancellation. 480s (8 min) is ~1.8x the ~4.5-minute normal
      # run and leaves several minutes of this job's 15-minute cap for the
      # steps before and after (checkout/env/compose-up/npm-ci/browser-
      # install ran in 2m45s-4m29s across the two measured passing runs).
      - name: Save Playwright browsers and apt packages
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/playwright-apt-archives/*.deb
          key: playwright-${{ runner.os }}-ubuntu-26.04-${{ steps.playwright-version.outputs.version }}

      - name: Run accessibility tests
        run: >-
          npx playwright test e2e/accessibility.spec.ts e2e/keyboard-nav.spec.ts
          --project=chromium
          --reporter=line,html
          --timeout=60000
          --global-timeout=480000

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: accessibility-playwright-test-results
          path: test-results/
          retention-days: 14

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: accessibility-playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Docker Compose logs
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop services
        if: always()
        run: docker compose down

  stac-validate:
    name: STAC API conformance (stac-api-validator)
    # Same trigger/guard shape as the accessibility job above: force-run on
    # push(main), evaluate on schedule/dispatch despite skipped needs, and stay
    # off PRs (per-PR Actions budget = 0).
    #
    # STAC conformance is a public API contract, so it gates ci-ok in the queue
    # like the accessibility job above, with the same needs: lints and the
    # security scan only, so it runs alongside the test shards.
    if: >-
      always()
      && ((github.event_name == 'push' && needs.changes.outputs.queue_verified != 'true') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group')
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-26.04
    needs: [changes, backend-lint, frontend-lint, security-scan]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Create .env file
        run: |
          cp .env.example .env
          sed -i -E 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=geolens_dev|' .env
          sed -i -E 's|^JWT_SECRET_KEY=.*|JWT_SECRET_KEY=e2e-test-secret-key-padding-32chars-min|' .env
          sed -i -E 's|^GEOLENS_ADMIN_PASSWORD=.*|GEOLENS_ADMIN_PASSWORD=geolens-ci-admin-password|' .env
          echo "DATABASE_SSL_MODE=disable" >> .env

      # MUST run before Start services, exactly as in the e2e/a11y jobs:
      # .env.example ships GEOLENS_ADMIN_USERNAME= EMPTY, OS env beats .env in
      # compose interpolation, and Settings accepts "" — without this export a
      # fresh stack seeds an admin whose username is the empty string and every
      # admin login 401s.
      - name: Export admin credentials
        run: |
          echo "GEOLENS_ADMIN_USERNAME=admin" >> $GITHUB_ENV
          echo "GEOLENS_ADMIN_PASSWORD=geolens-ci-admin-password" >> $GITHUB_ENV

      - name: Start services
        run: docker compose up -d --wait --wait-timeout 120

      - name: Seed STAC fixture
        id: seed
        # -u 1001 + a tmpfs uv cache: the hardened api container is read-only
        # and `docker compose exec` defaults to root, whose cache dir is not
        # writable.
        run: |
          out=$(docker compose exec -T -u 1001:1001 -e UV_CACHE_DIR=/tmp/uv-cache api \
            uv run --no-dev python /app/backend/scripts/seed_stac_ci.py)
          echo "$out"
          echo "collection_id=$(echo "$out" | sed -n 's/^collection_id=//p')" >> "$GITHUB_OUTPUT"

      - name: Raise the global rate limit for the validator burst
        # stac-api-validator fires hundreds of requests back-to-back; the
        # 60 req/s default turns the tail of the run into 429 noise.
        #
        # Everything goes through the Vite proxy on 8080 — NOT the api host
        # port — because docker-compose.yml defaults PUBLIC_API_URL to
        # http://localhost:8080/api, so every link the STAC API emits points
        # there; pystac traversal follows links, and a direct-port root-url
        # produces a split-brain URL surface. No -f/-s silent flags — on a bad
        # response the body must land in the job log.
        run: |
          for i in 1 2 3; do
            resp=$(curl -X POST http://localhost:8080/api/auth/login \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data 'username=admin&password=geolens-ci-admin-password') && \
              token=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["access_token"])' "$resp") && break
            echo "login attempt $i failed; response was: $resp"
            sleep 5
          done
          [ -n "${token:-}" ] || { echo "could not obtain an admin token"; exit 1; }
          curl --fail-with-body -X PUT http://localhost:8080/api/settings/ \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"settings":{"global_rate_limit":500}}' -o /dev/null

      - name: Run stac-api-validator
        run: |
          pipx run stac-api-validator==0.6.8 \
            --root-url http://localhost:8080/api/stac/ \
            --conformance core \
            --conformance collections \
            --conformance item-search \
            --collection "${{ steps.seed.outputs.collection_id }}" \
            --geometry '{"type": "Polygon", "coordinates": [[[-105, 39], [-104, 39], [-104, 40], [-105, 40], [-105, 39]]]}'

      - name: Docker Compose logs
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop services
        if: always()
        run: docker compose down

  # ---------- nightly red-run tracking issue ----------
  # A red nightly is otherwise only visible in the Actions tab, and the cron
  # can be silently cancelled (see the concurrency comment at the top of this
  # file). On scheduled runs this job
  # files the failure where it cannot be missed: it comments on the open
  # `nightly-e2e`-labelled tracking issue, or creates it if none is open.
  # Anything short of success counts — on schedule, e2e-test/accessibility
  # skip only when an upstream lint/test job failed, and that still means the
  # nightly produced no browser signal.
  nightly-e2e-report:
    name: Nightly E2E Failure Report
    needs: [e2e-test, accessibility]
    if: >-
      always()
      && github.event_name == 'schedule'
      && (needs.e2e-test.result != 'success' || needs.accessibility.result != 'success')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or refresh the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          E2E_RESULT: ${{ needs.e2e-test.result }}
          A11Y_RESULT: ${{ needs.accessibility.result }}
          # spec-level detail from the json reporter, so a
          # deterministic spec break reads differently from a flake without
          # anyone downloading traces.
          FAILED_SPECS: ${{ needs.e2e-test.outputs.failed_specs }}
        run: |
          # --force makes label creation idempotent (updates in place if the
          # label already exists instead of erroring).
          gh label create nightly-e2e \
            --description "Red nightly E2E/a11y run needs investigation" \
            --color D93F0B --force

          {
            echo "The nightly run on $(date -u +%Y-%m-%d) did not produce a green browser signal."
            echo ""
            echo "- \`e2e-test\`: $E2E_RESULT"
            echo "- \`accessibility\`: $A11Y_RESULT"
            echo "- Run: $RUN_URL"
            echo ""
            echo "\`skipped\` means an upstream lint/test job failed on the scheduled run, so the browser suites never started."
            if [ -n "$FAILED_SPECS" ]; then
              echo ""
              echo "Failing specs (default suite; attempts counts retries — 3/3 red is deterministic rot, not a flake):"
              echo ""
              echo "$FAILED_SPECS"
              echo ""
              echo "The builder-hardening suite runs with \`--reporter=line\` and is not itemized here — check the run log if \`e2e-test\` is red with no specs listed."
            fi
          } > /tmp/nightly-body.md

          existing=$(gh issue list --label nightly-e2e --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/nightly-body.md
          else
            {
              cat /tmp/nightly-body.md
              echo ""
              echo "Close this issue once a nightly run is green again. The next red nightly comments here while it stays open, or files a fresh issue after it is closed."
            } > /tmp/nightly-issue.md
            gh issue create \
              --title "Nightly E2E/a11y run is red" \
              --label nightly-e2e \
              --body-file /tmp/nightly-issue.md
          fi
