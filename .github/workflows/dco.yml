name: DCO

on:
  pull_request:
    branches:
      - main
  merge_group:

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off check
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # Verify every commit in the PR carries a `Signed-off-by:` trailer
      # (added via `git commit -s`), certifying the Developer Certificate of
      # Origin. See .github/CONTRIBUTING.md.
      # A merge-group run has no pull request to read commits from, and the
      # queue only admits PRs that already passed this check, so the job
      # succeeds without running the action.
      - name: Check DCO
        if: github.event_name != 'merge_group'
        uses: tisonkun/actions-dco@f1024cd563550b5632e754df11b7d30b73be54a5  # v1.1
