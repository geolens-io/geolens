name: Release

# Gated on the prod-smoke E2E. This workflow creates / updates the GitHub
# Release (the "latest" pointer the website archive link + GitHub's release API
# follow) ONLY AFTER the "Prod Compose Smoke" workflow — which boots the
# published images and runs the Playwright audit suite through the prod reverse
# proxy — succeeds for the tag. A failing tag E2E therefore never advances the
# latest GitHub Release.
#
# Note: publish.yml still pushes the GHCR images on the tag push itself (the
# smoke pulls + tests them), so the *images* for a failing tag can exist on
# GHCR; only the GitHub Release is withheld. Fully withholding the images until
# E2E passes is a larger publish-ordering redesign tracked separately.
on:
  workflow_run:
    workflows: ["Prod Compose Smoke"]
    types:
      - completed

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    # Only for a SUCCESSFUL smoke of a vX.Y.Z tag. A manual workflow_dispatch
    # smoke of `latest` has head_branch == the default branch (not a tag), so it
    # is skipped here.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.workflow_run.head_branch }}
    steps:
      # The job-level startsWith(head_branch, 'v') gate also matches ordinary
      # branch names like `video-fix` smoked via workflow_dispatch. Only a
      # semver-shaped tag (optional prerelease suffix) may create or update a
      # GitHub Release — anything else reaching this job is an anomaly, so
      # fail loudly rather than releasing from it.
      - name: Assert semver-shaped tag
        run: |
          if ! printf '%s' "${TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::head_branch '${TAG}' is not a semver tag; refusing to release"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Get previous tag
        id: prev
        run: |
          # Filter to strict semver (vMAJOR.MINOR.PATCH) before selection so that
          # 4-digit GSD milestone tags (v1044, v1043, …) — which version-sort above
          # the entire semver line — cannot shadow the real previous release.
          PREV=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -A1 "^${TAG}$" | tail -1)
          echo "tag=${PREV}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV="${{ steps.prev.outputs.tag }}"

          # Extract section from CHANGELOG.md for this version.
          #
          # fix(#715): strip any prerelease suffix first. A prerelease tag has no
          # CHANGELOG section of its own and never will — bump_version.py's
          # SEMVER_RE only accepts plain X.Y.Z, so `make bump` cannot create a
          # `## [1.5.0-rc.1]` header, and check_version_coherence.py only ever
          # validates the canonical version. Without this, every RC published the
          # git-log fallback below, whose filter drops every docs(/chore( subject.
          # An RC's notes are the notes for the release it is a candidate for.
          VERSION="${TAG#v}"
          CHANGELOG_VERSION="${VERSION%%-*}"
          NOTES=$(awk "/^## \[${CHANGELOG_VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)

          # fix(#715 review): strip whitespace before the emptiness test. `$(...)`
          # removes trailing newlines but keeps spaces and tabs, so a section
          # containing only whitespace made `[ -z ]` false and published
          # effectively blank release notes — passing neither the fallback nor
          # the version-coherence gate, which rejects exactly that input.
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            # Fallback: generate from git log
            NOTES=$(git log --format="- %s" "${PREV}..${TAG}" --no-merges | grep -v "^- docs(" | grep -v "^- chore(" | head -30)
            # fix(#1530): say so. Three times now the fallback has fired when it
            # should not have — every prerelease tag (#715), a whitespace-only
            # section (#715 review), and a CHANGELOG edit that deleted the
            # `## [1.13.1]` header outright (#1518). Each was fixed by making
            # the matching smarter; three occurrences say the problem is that
            # the fallback is INDISTINGUISHABLE from success once the notes are
            # published. It still must not block a release, so it warns rather
            # than failing, and drops a marker in the body so the state is
            # visible to readers and not only to whoever opens the workflow log.
            echo "::warning title=Release notes fell back to git log::No '## [${CHANGELOG_VERSION}]' section found in CHANGELOG.md. Published notes are auto-generated commit subjects, not curated, and the filter drops every docs()/chore() subject and caps at 30 entries."
            {
              echo "### :warning: Auto-generated release notes"
              echo
              echo "No \`## [${CHANGELOG_VERSION}]\` section was found in \`CHANGELOG.md\`, so these"
              echo "notes are commit subjects rather than curated release notes."
            } >> "$GITHUB_STEP_SUMMARY"
            # Single line on purpose: a multi-line assignment here has to start
            # its continuation lines at column 0, which terminates the YAML
            # block scalar this whole `run:` lives in. check-yaml catches it.
            NOTES="$(printf '> **Note**\n> These notes were generated from commit subjects because no `## [%s]` section was found in `CHANGELOG.md`.\n\n%s' "$CHANGELOG_VERSION" "$NOTES")"
          fi

          # Write to file to preserve newlines
          echo "$NOTES" > release-notes.md

          # Append contributor credits from GitHub's auto-generated notes: the
          # "New Contributors" section (first-time contributors) and the
          # "Full Changelog" compare link. The curated CHANGELOG section above
          # stays the body; a failed generate-notes call must never block the
          # release, so every step here degrades to appending nothing.
          GEN=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${TAG}" ${PREV:+-f previous_tag_name="${PREV}"} \
            --jq '.body' || true)
          NEW_CONTRIBUTORS=$(printf '%s\n' "$GEN" \
            | awk '/^## New Contributors/{f=1; print; next} /^## /||/^\*\*Full Changelog\*\*/{if(f) exit} f{print}')
          FULL_CHANGELOG=$(printf '%s\n' "$GEN" | grep '^\*\*Full Changelog\*\*' || true)
          if [ -n "$NEW_CONTRIBUTORS" ]; then
            printf '\n%s\n' "$NEW_CONTRIBUTORS" >> release-notes.md
          fi
          if [ -n "$FULL_CHANGELOG" ]; then
            printf '\n%s\n' "$FULL_CHANGELOG" >> release-notes.md
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Semver pre-release tags carry a hyphenated suffix (e.g. v1.4.0-rc.1).
          # Mark those as a GitHub pre-release so they are NEVER promoted to the
          # "latest" pointer that the website archive link + install script follow.
          # GA tags (vX.Y.Z, no suffix) stay full releases and become latest.
          case "${TAG}" in
            *-*) IS_PRERELEASE=true ;;
            *)   IS_PRERELEASE=false ;;
          esac
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --title "${TAG}" \
              --notes-file release-notes.md \
              --prerelease="${IS_PRERELEASE}"
          elif [ "${IS_PRERELEASE}" = true ]; then
            gh release create "${TAG}" \
              --title "${TAG}" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --notes-file release-notes.md
          fi

      - name: Upload install script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${TAG}" scripts/install.sh --clobber

      - name: Generate + upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Compute checksums by basename so `sha256sum -c SHA256SUMS` works when
          # install.sh and SHA256SUMS are downloaded into the same directory.
          ( cd scripts && sha256sum install.sh ) > SHA256SUMS
          gh release upload "${TAG}" SHA256SUMS --clobber

      # CI-1 (see geolens-io/getgeolens.com#108): the site repo listens for
      # this dispatch to run release-drift immediately and to open its
      # docs-contract sync PR (getgeolens.com#108, release-sync.yml).
      # #1609: geolens-examples listens for the same event. It pins every
      # published client (geolens, @geolens/sdk, geolens-mcp, geolens-cli)
      # to one version across a dozen files, and otherwise hears about a
      # release only from a weekly ci/check-pins.py line that warns and
      # passes. On this event it opens a "bump the pins and re-sweep" issue.
      #
      # The third target is the Buttondown newsletter. It lives here rather
      # than in its own step so it inherits this one's latest-release guard
      # and reporting: a stale tag must not draft a newsletter for a version
      # that is no longer current, and that check is subtle enough that a
      # second copy of it would drift. The runbook's step 11 recorded the
      # reason it kept being missed — "nothing triggers it and nothing checks
      # it" — which is both halves of what this step already does for the
      # other two.
      - name: Notify downstream targets of the release
        # Only GA tags (no `-` suffix) dispatch — same shape as the
        # IS_PRERELEASE case pattern in "Create release" above. A prerelease
        # never becomes the "latest" release the site's install one-liner and
        # archive link follow, so the site has nothing to sync for one.
        #
        # Everything else (the missing-secret case, the stale-tag case) stays
        # INSIDE the run script rather than in this `if:`, on purpose: a step
        # this `if:` skips shows as a bare grey "skipped" in the run, which is
        # how a missing SITE_DISPATCH_TOKEN would go unnoticed indefinitely
        # (this file already learned that lesson once, for #1530). Running
        # the step and having it log a ::notice::/::warning:: and a
        # step-summary line keeps the same "never fail the release over
        # this" behavior visible instead of silent.
        if: ${{ !contains(env.TAG, '-') }}
        env:
          # Three tokens for three jobs: reading THIS repo's latest release
          # needs only the default GITHUB_TOKEN, and each dispatch target
          # needs a PAT scoped to that target (neither dispatch token has
          # read access here, and the default token has access to neither
          # target). Fine-grained PATs, Contents: read/write on
          # geolens-io/getgeolens.com and on geolens-io/geolens-examples
          # respectively; absent = skipped with a ::notice::.
          #
          # EXAMPLES_DISPATCH_TOKEN falls back to SITE_DISPATCH_TOKEN, so one
          # PAT scoped to both targets is enough and two separate ones also
          # work. Only the fallback direction exists: a token scoped to the
          # examples repo must never be tried against the site, because a
          # dispatch that 404s is indistinguishable here from a site outage.
          DEFAULT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          EXAMPLES_DISPATCH_TOKEN: ${{ secrets.EXAMPLES_DISPATCH_TOKEN }}
          # Buttondown API key (Buttondown -> Settings -> Programming). Absent
          # = skipped with a ::notice::, like the dispatch tokens above.
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        # The release is already published by this point in the job. A failed
        # dispatch must never fail the release on a downstream repo's account —
        # worst case, the site's own nightly release-drift check catches the
        # gap, the examples repo's weekly pin check warns, and the manual sync
        # step still exists as a fallback for both.
        continue-on-error: true
        timeout-minutes: 5
        run: |
          # A small heading so these lines read as their own section in the
          # job summary rather than trailing off the "Generate release
          # notes" step's own ### warning block above them. Written once
          # however many targets report, so two dispatches produce one
          # section with two rows rather than two one-row sections.
          heading_written=
          summary() {
            if [ -z "$heading_written" ]; then
              echo "### Release dispatches" >> "$GITHUB_STEP_SUMMARY"
              heading_written=1
            fi
            echo "- $1" >> "$GITHUB_STEP_SUMMARY"
          }

          # prod-smoke.yml runs tag smokes in parallel and this workflow has
          # no concurrency group, so an older tag's smoke can finish after a
          # newer one's (or a re-run replays an old tag's smoke) and reach
          # this step after a newer release already published. Dispatching
          # then would tell the downstream repos to sync backwards. Only the
          # actual latest release may dispatch.
          if ! LATEST="$(GH_TOKEN="$DEFAULT_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"; then
            echo "::warning title=Release dispatch failed::Could not read the latest release for ${TAG}, so no release dispatch ran."
            summary "FAILED for ${TAG} (could not read the latest release)"
            exit 1
          fi
          if [ "$LATEST" != "$TAG" ]; then
            echo "::notice title=Not the latest release::Skipping the release dispatches for ${TAG} — the latest published release is ${LATEST}. A newer tag's smoke likely finished first, or this is a re-run of an older tag."
            summary "skipped, ${TAG} is not the latest release (${LATEST} is)"
            exit 0
          fi

          # Each target is reported on its own and NEITHER short-circuits the
          # other: a site outage must not cost the examples repo its release
          # notification, and vice versa. So the failures below set a flag and
          # the step exits on it once, at the end, after both have been tried.
          failed=0

          if [ -z "$SITE_DISPATCH_TOKEN" ]; then
            echo "::notice title=Site not notified::SITE_DISPATCH_TOKEN is not configured, so ${TAG} was not dispatched to getgeolens.com. Add it as a fine-grained PAT with Contents: read/write on geolens-io/getgeolens.com to enable this."
            summary "site: skipped (no SITE_DISPATCH_TOKEN)"
          elif GH_TOKEN="$SITE_DISPATCH_TOKEN" gh api repos/geolens-io/getgeolens.com/dispatches \
            -f event_type=geolens-release \
            -f "client_payload[version]=${TAG}"; then
            summary "site: notified getgeolens.com of ${TAG}"
          else
            echo "::warning title=Site dispatch failed::Could not notify geolens-io/getgeolens.com of release ${TAG}. The GeoLens release itself published fine; the site will pick up the contract sync on its next scheduled release-drift check instead."
            summary "site: FAILED for ${TAG} (see the warning above)"
            failed=1
          fi

          EXAMPLES_TOKEN="${EXAMPLES_DISPATCH_TOKEN:-$SITE_DISPATCH_TOKEN}"
          if [ -z "$EXAMPLES_TOKEN" ]; then
            echo "::notice title=Examples repo not notified::Neither EXAMPLES_DISPATCH_TOKEN nor SITE_DISPATCH_TOKEN is configured, so ${TAG} was not dispatched to geolens-examples. Add either as a fine-grained PAT with Contents: read/write on geolens-io/geolens-examples to enable this."
            summary "examples: skipped (no EXAMPLES_DISPATCH_TOKEN or SITE_DISPATCH_TOKEN)"
          elif GH_TOKEN="$EXAMPLES_TOKEN" gh api repos/geolens-io/geolens-examples/dispatches \
            -f event_type=geolens-release \
            -f "client_payload[version]=${TAG}"; then
            summary "examples: notified geolens-examples of ${TAG}"
          else
            echo "::warning title=Examples dispatch failed::Could not notify geolens-io/geolens-examples of release ${TAG}. The GeoLens release itself published fine; the examples repo's weekly ci/check-pins.py run will still warn that the demo has moved past its pins."
            summary "examples: FAILED for ${TAG} (see the warning above)"
            failed=1
          fi

          # Draft the release-notes newsletter. DRAFT on purpose: this removes
          # the "remember it exists" problem, which is the one that actually
          # bit, without putting unreviewed copy in front of subscribers.
          if [ -z "$BUTTONDOWN_API_KEY" ]; then
            echo "::notice title=Newsletter not drafted::BUTTONDOWN_API_KEY is not configured, so no release-notes email was drafted for ${TAG}. Add it as a repository secret (Buttondown -> Settings -> Programming) to enable this."
            summary "newsletter: skipped (no BUTTONDOWN_API_KEY)"
          else
            SUBJECT="GeoLens ${TAG}"
            # A re-run of this workflow must not leave a second draft. The API's
            # `subject` filter is a CONTAINS match, so compare exactly rather
            # than trusting that a match is THE match.
            EXISTING=$(curl -sS --max-time 30 -G "https://api.buttondown.com/v1/emails" \
              --data-urlencode "subject=${SUBJECT}" \
              -H "Authorization: Token ${BUTTONDOWN_API_KEY}" 2>/dev/null \
              | jq -r --arg s "$SUBJECT" '[.results[]? | select(.subject == $s)] | length' 2>/dev/null || true)
            # An unreadable check falls through to creating one. A duplicate
            # DRAFT is cheap and visible; a missing newsletter is the failure
            # this whole target exists to prevent.
            if [ "${EXISTING:-0}" != "0" ] && [ -n "${EXISTING}" ]; then
              echo "::notice title=Newsletter already drafted::A Buttondown email titled \"${SUBJECT}\" already exists, so this run did not create another."
              summary "newsletter: already drafted for ${TAG}"
            else
              # release-notes.md is the curated CHANGELOG section this job
              # already built for the GitHub Release body.
              {
                cat release-notes.md
                printf '\n[Release notes on GitHub](https://github.com/%s/releases/tag/%s)\n' "${GITHUB_REPOSITORY}" "${TAG}"
              } > newsletter.md
              # --rawfile, not string interpolation: the body is arbitrary
              # markdown with quotes, backticks and newlines in it.
              jq -n --arg subject "$SUBJECT" --rawfile body newsletter.md \
                '{subject: $subject, body: $body, status: "draft"}' > newsletter.json
              CODE=$(curl -sS --max-time 30 -o newsletter-response.json -w '%{http_code}' \
                -X POST "https://api.buttondown.com/v1/emails" \
                -H "Authorization: Token ${BUTTONDOWN_API_KEY}" \
                -H "Content-Type: application/json" \
                --data-binary @newsletter.json || echo 000)
              case "$CODE" in
                2*)
                  summary "newsletter: drafted \"${SUBJECT}\" in Buttondown — review and send"
                  ;;
                *)
                  # Never echo the response wholesale; it echoes the request.
                  DETAIL=$(jq -r '.detail // .error // empty' newsletter-response.json 2>/dev/null | head -c 200)
                  echo "::warning title=Newsletter draft failed::Could not draft the Buttondown release-notes email for ${TAG} (HTTP ${CODE}). ${DETAIL} The release itself published fine; draft it by hand per the release runbook."
                  summary "newsletter: FAILED for ${TAG} (HTTP ${CODE})"
                  failed=1
                  ;;
              esac
            fi
          fi

          exit "$failed"
