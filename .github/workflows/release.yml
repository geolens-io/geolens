name: Release

# Gated on the prod-smoke E2E. This workflow creates / updates the GitHub
# Release (the "latest" pointer the website archive link + GitHub's release API
# follow) ONLY AFTER the "Prod Compose Smoke" workflow — which boots the
# published images and runs the Playwright audit suite through the prod reverse
# proxy — succeeds for the tag. A failing tag E2E therefore never advances the
# latest GitHub Release.
#
# Note: publish.yml still pushes the GHCR images on the tag push itself (the
# smoke pulls + tests them), so the *images* for a failing tag can exist on
# GHCR; only the GitHub Release is withheld. Fully withholding the images until
# E2E passes is a larger publish-ordering redesign tracked separately.
on:
  workflow_run:
    workflows: ["Prod Compose Smoke"]
    types:
      - completed

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    # Only for a SUCCESSFUL smoke of a vX.Y.Z tag. A manual workflow_dispatch
    # smoke of `latest` has head_branch == the default branch (not a tag), so it
    # is skipped here.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.workflow_run.head_branch }}
    steps:
      # The job-level startsWith(head_branch, 'v') gate also matches ordinary
      # branch names like `video-fix` smoked via workflow_dispatch. Only a
      # semver-shaped tag (optional prerelease suffix) may create or update a
      # GitHub Release — anything else reaching this job is an anomaly, so
      # fail loudly rather than releasing from it.
      - name: Assert semver-shaped tag
        run: |
          if ! printf '%s' "${TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::head_branch '${TAG}' is not a semver tag; refusing to release"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Get previous tag
        id: prev
        run: |
          # Filter to strict semver (vMAJOR.MINOR.PATCH) before selection so that
          # 4-digit GSD milestone tags (v1044, v1043, …) — which version-sort above
          # the entire semver line — cannot shadow the real previous release.
          PREV=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -A1 "^${TAG}$" | tail -1)
          echo "tag=${PREV}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV="${{ steps.prev.outputs.tag }}"

          # Extract section from CHANGELOG.md for this version.
          #
          # fix(#715): strip any prerelease suffix first. A prerelease tag has no
          # CHANGELOG section of its own and never will — bump_version.py's
          # SEMVER_RE only accepts plain X.Y.Z, so `make bump` cannot create a
          # `## [1.5.0-rc.1]` header, and check_version_coherence.py only ever
          # validates the canonical version. Without this, every RC published the
          # git-log fallback below, whose filter drops every docs(/chore( subject.
          # An RC's notes are the notes for the release it is a candidate for.
          VERSION="${TAG#v}"
          CHANGELOG_VERSION="${VERSION%%-*}"
          NOTES=$(awk "/^## \[${CHANGELOG_VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)

          # fix(#715 review): strip whitespace before the emptiness test. `$(...)`
          # removes trailing newlines but keeps spaces and tabs, so a section
          # containing only whitespace made `[ -z ]` false and published
          # effectively blank release notes — passing neither the fallback nor
          # the version-coherence gate, which rejects exactly that input.
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            # Fallback: generate from git log
            NOTES=$(git log --format="- %s" "${PREV}..${TAG}" --no-merges | grep -v "^- docs(" | grep -v "^- chore(" | head -30)
            # fix(#1530): say so. Three times now the fallback has fired when it
            # should not have — every prerelease tag (#715), a whitespace-only
            # section (#715 review), and a CHANGELOG edit that deleted the
            # `## [1.13.1]` header outright (#1518). Each was fixed by making
            # the matching smarter; three occurrences say the problem is that
            # the fallback is INDISTINGUISHABLE from success once the notes are
            # published. It still must not block a release, so it warns rather
            # than failing, and drops a marker in the body so the state is
            # visible to readers and not only to whoever opens the workflow log.
            echo "::warning title=Release notes fell back to git log::No '## [${CHANGELOG_VERSION}]' section found in CHANGELOG.md. Published notes are auto-generated commit subjects, not curated, and the filter drops every docs()/chore() subject and caps at 30 entries."
            {
              echo "### :warning: Auto-generated release notes"
              echo
              echo "No \`## [${CHANGELOG_VERSION}]\` section was found in \`CHANGELOG.md\`, so these"
              echo "notes are commit subjects rather than curated release notes."
            } >> "$GITHUB_STEP_SUMMARY"
            # Single line on purpose: a multi-line assignment here has to start
            # its continuation lines at column 0, which terminates the YAML
            # block scalar this whole `run:` lives in. check-yaml catches it.
            NOTES="$(printf '> **Note**\n> These notes were generated from commit subjects because no `## [%s]` section was found in `CHANGELOG.md`.\n\n%s' "$CHANGELOG_VERSION" "$NOTES")"
          fi

          # Write to file to preserve newlines
          echo "$NOTES" > release-notes.md

          # Append contributor credits from GitHub's auto-generated notes: the
          # "New Contributors" section (first-time contributors) and the
          # "Full Changelog" compare link. The curated CHANGELOG section above
          # stays the body; a failed generate-notes call must never block the
          # release, so every step here degrades to appending nothing.
          GEN=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${TAG}" ${PREV:+-f previous_tag_name="${PREV}"} \
            --jq '.body' || true)
          NEW_CONTRIBUTORS=$(printf '%s\n' "$GEN" \
            | awk '/^## New Contributors/{f=1; print; next} /^## /||/^\*\*Full Changelog\*\*/{if(f) exit} f{print}')
          FULL_CHANGELOG=$(printf '%s\n' "$GEN" | grep '^\*\*Full Changelog\*\*' || true)
          if [ -n "$NEW_CONTRIBUTORS" ]; then
            printf '\n%s\n' "$NEW_CONTRIBUTORS" >> release-notes.md
          fi
          if [ -n "$FULL_CHANGELOG" ]; then
            printf '\n%s\n' "$FULL_CHANGELOG" >> release-notes.md
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Semver pre-release tags carry a hyphenated suffix (e.g. v1.4.0-rc.1).
          # Mark those as a GitHub pre-release so they are NEVER promoted to the
          # "latest" pointer that the website archive link + install script follow.
          # GA tags (vX.Y.Z, no suffix) stay full releases and become latest.
          case "${TAG}" in
            *-*) IS_PRERELEASE=true ;;
            *)   IS_PRERELEASE=false ;;
          esac
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --title "${TAG}" \
              --notes-file release-notes.md \
              --prerelease="${IS_PRERELEASE}"
          elif [ "${IS_PRERELEASE}" = true ]; then
            gh release create "${TAG}" \
              --title "${TAG}" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --notes-file release-notes.md
          fi

      - name: Upload install script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${TAG}" scripts/install.sh --clobber

      - name: Generate + upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Compute checksums by basename so `sha256sum -c SHA256SUMS` works when
          # install.sh and SHA256SUMS are downloaded into the same directory.
          ( cd scripts && sha256sum install.sh ) > SHA256SUMS
          gh release upload "${TAG}" SHA256SUMS --clobber

      # CI-1: the site repo listens for this dispatch to run release-drift
      # immediately and to open its docs-contract sync PR (see
      # getgeolens.com's release-sync.yml). GitHub's docs list the contexts
      # available to `jobs.<job_id>.steps.if` as github, needs, strategy,
      # matrix, job, runner, env, vars, steps, and inputs; `secrets` is not
      # among them (see
      # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts).
      # So the presence check goes through the `env` context instead: set the
      # secret as a step env var, then gate on `env.SITE_DISPATCH_TOKEN`.
      - name: Notify the site of the release
        # Only GA tags (no `-` suffix) dispatch — same shape as the
        # IS_PRERELEASE case pattern in "Create release" above. A prerelease
        # never becomes the "latest" release the site's install one-liner and
        # archive link follow, so the site has nothing to sync for one.
        # Skipped, not failed, when the secret isn't configured — this repo's
        # release must work for anyone who hasn't set up the site's PAT.
        if: env.SITE_DISPATCH_TOKEN != '' && !contains(env.TAG, '-')
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        # The release is already published by this point in the job. A failed
        # dispatch must never fail the release on the site repo's account —
        # worst case, the site's own nightly release-drift check catches the
        # gap and the manual sync step still exists as a fallback.
        continue-on-error: true
        run: |
          if ! gh api repos/geolens-io/getgeolens.com/dispatches \
            -f event_type=geolens-release \
            -f "client_payload[version]=${TAG}"; then
            echo "::warning title=Site dispatch failed::Could not notify geolens-io/getgeolens.com of release ${TAG}. The GeoLens release itself published fine; the site will pick up the contract sync on its next scheduled release-drift check instead."
            exit 1
          fi
