name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly scan (Mondays 06:17 UTC) to catch advisories in unchanged code.
    - cron: "17 6 * * 1"

permissions:
  contents: read

# A new push to a pull request supersedes its running analysis. Push and
# scheduled runs on main keep going so every commit gets a full scan.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # AGENTS.md > Security > CodeQL: the validated-identifier
        # py/sql-injection class fires at text() sites in
        # backend/app/processing/ingest/ whose identifiers _qtable
        # (metadata_sql.py) validates first, so the alert-suppression query pack
        # is adopted here instead of dismissing alerts by hand.
        #
        # Only python runs a suppression query. javascript-typescript passes an
        # empty string, which the action reads as unset (getOptionalInput
        # returns undefined for a zero-length input), so that analysis is
        # unchanged and no comment can dismiss a JS alert.
        include:
          - language: python
            suppression-queries: ./.github/codeql/python-suppression
          - language: javascript-typescript
            suppression-queries: ""

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          languages: ${{ matrix.language }}
          # Runs IN ADDITION to the default code-scanning suite. `queries:`
          # only overrides a config file's own queries, and nothing here sets
          # disable-default-queries. The pack is a single @kind
          # alert-suppression query, which the CLI consumes to populate SARIF
          # `suppressions[]` rather than reporting as alerts of its own.
          queries: ${{ matrix.suppression-queries }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"

      # Writing `suppressions[]` into the SARIF is NOT enough on its own, and
      # this is the step whose absence looks exactly like success. GitHub code
      # scanning ignores the property: it is absent from the supported-result-
      # properties list in GitHub's SARIF reference, github/codeql-action
      # contains no suppression handling, and GitHub staff confirmed the gap on
      # community discussion #156737 (2025-05-12). Without this step the
      # markers would sit in the source, the SARIF would carry the
      # suppressions, and the alerts would stay open.
      #
      # Skipped on pull_request: a PR analysis reports against the PR, so there
      # is nothing on the default branch for it to dismiss, and the repo-wide
      # alerts it would otherwise reach do not belong to the PR's code.
      - name: Dismiss alerts suppressed in source
        if: matrix.language == 'python' && github.event_name != 'pull_request'
        uses: advanced-security/dismiss-alerts@a18f986bdb40edba0dd7a74382c15d4a3d50a1c8  # v2.0.3
        with:
          sarif-id: ${{ steps.analyze.outputs.sarif-id }}
          sarif-file: ${{ steps.analyze.outputs.sarif-output }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The action keys alerts by rule, path and start position and keeps one
      # alert per key. A dismissed alert and an open one at the same position
      # (an alert re-created after the surrounding code changed) collide, the
      # dismissed one wins, and the step exits 0 with the open alert untouched.
      - name: Fail on suppressed results that still have an open alert
        if: matrix.language == 'python' && github.event_name != 'pull_request'
        run: python3 scripts/check_suppressed_alerts.py "$SARIF_OUTPUT" "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          SARIF_OUTPUT: ${{ steps.analyze.outputs.sarif-output }}
