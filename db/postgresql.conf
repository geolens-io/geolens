# ==============================================================================
# GeoLens Custom PostgreSQL Configuration
# ==============================================================================
# Mounted into the db container via docker-compose volume.
# Includes profiling extensions for query performance analysis.

# ---------------------------------------------------------------------------
# Connection
# ---------------------------------------------------------------------------
listen_addresses = '*'
max_connections = 80                   # PERF-003, recomputed by db-audit #529 (CONN-1): the original
                                       # 70 omitted the API-side Procrastinate connector — every uvicorn
                                       # worker opens one for job ENQUEUEING (task_app.open_async() in
                                       # api/main.py lifespan), not just the worker process.
                                       # Per-process breakdown (all limits are worst-case / max_size):
                                       #   API process (SQLAlchemy):    pool_size=10 + max_overflow=3 = 13  [config.py db_pool_size/db_max_overflow; core/db/session.py]
                                       #   API process (asyncpg tile):  TILE_POOL_MAX_SIZE default = 10     [config.py tile_pool_max_size; tiles/pool.py]
                                       #   API process (Procrastinate): PsycopgConnector max_size = 3       [tasks_common.py _connector_kwargs]
                                       #   API process total per worker: 13 + 10 + 3 = 26
                                       #   Worker (SQLAlchemy):         pool_size=10 + max_overflow=3 = 13
                                       #   Worker (Procrastinate):      PsycopgConnector max_size = 3
                                       #   Worker process total:         13 + 3 = 16
                                       #   Admin headroom (psql/ops):    2
                                       # Worst case: 2 API workers (prod default) + 1 worker + admin
                                       #   2 × 26 + 16 + 2 = 70 → 80 keeps a 10-connection buffer.
                                       # Single-worker dev (UVICORN_WORKERS=1):
                                       #   1 × 26 + 16 + 2 = 44 (well within 80).
                                       # Lower TILE_POOL_MAX_SIZE or DB_POOL_SIZE in .env to stay under 80
                                       # if adding more API workers. See docs.getgeolens.com/guides/quickstart/configuration/#connection-pool-tuning

# ---------------------------------------------------------------------------
# Profiling: pg_stat_statements
# ---------------------------------------------------------------------------
# Tracks execution statistics for all SQL statements.
# Query with: SELECT * FROM pg_stat_statements ORDER BY total_exec_time DESC;
# Stats are CLUSTER-wide — on hosts that also run pytest databases, filter with
#   WHERE dbid = (SELECT oid FROM pg_database WHERE datname = current_database())
# or TRUNCATE/DROP DATABASE noise from test runs dominates the rankings.
shared_preload_libraries = 'pg_stat_statements,auto_explain'
pg_stat_statements.max = 5000
pg_stat_statements.track = all

# ---------------------------------------------------------------------------
# Profiling: auto_explain
# ---------------------------------------------------------------------------
# fix(#1778): auto_explain.log_analyze/log_buffers instrument EVERY statement
# the server executes — auto_explain has to install per-node row-counting and
# timing at ExecutorStart, before a statement's duration is known, so
# log_min_duration only gates the LOGGING, not the instrumentation overhead.
# Left on unconditionally at a 100ms threshold, that cost lands on the
# highest-volume queries this product is built on (vector tiles, trigram and
# semantic search), worst on the arm64-under-emulation path db/Dockerfile
# documents. Shipped off (-1 disables the instrumentation entirely, not just
# the log line) so this is a deliberate per-incident opt-in, not a standing
# production tax. Turn it on for a diagnosis window without touching this
# bind-mounted file or restarting the server — ALTER SYSTEM writes to
# postgresql.auto.conf in the pgdata volume, which is read regardless of
# config_file, so it is unaffected by the bind-mount inode trap RUNBOOK.md's
# "Database temp-file ceiling" section documents for editing this file:
#   ALTER SYSTEM SET auto_explain.log_min_duration = '100ms';
#   SELECT pg_reload_conf();
#   -- when done: ALTER SYSTEM RESET auto_explain.log_min_duration; SELECT pg_reload_conf();
auto_explain.log_min_duration = -1     # disabled; enable per-incident, see above
auto_explain.log_analyze = on
auto_explain.log_buffers = on
auto_explain.log_format = text

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
# NOTE (db-audit #529): with the collector on, ALL PostgreSQL output —
# slow-query lines, auto_explain plans, checkpoints — lands in files under
# $PGDATA/log/ inside the pgdata volume. `docker compose logs db` shows
# NOTHING by design. Read with:
#   docker compose exec db sh -c 'ls -t "$PGDATA/log/" | head'
#   docker compose exec db sh -c 'tail -100 "$PGDATA/log/<file>"'
# Kept on deliberately: log files survive container restarts and rotate daily.
logging_collector = on
log_destination = 'stderr'
# fix(#1778): with none of the four settings below set,
# unset params fall back to the compiled-in defaults (timestamped filename,
# truncate off), so the collector rotated but never reclaimed — the pgdata
# volume filled without bound. Naming the file by day-of-week and truncating
# on rotation caps the directory at 7 files regardless of volume. This is
# PostgreSQL's own documented seven-day scheme (Logfile Maintenance,
# https://www.postgresql.org/docs/current/logfile-maintenance.html), not a
# bespoke one.
#
# fix(#1783 review r1 P1): does a restart before 24h uptime (a daily
# deploy, a crash loop) skip the time-based rotation this truncation needs?
# No, for the ordinary case. syslogger's set_next_rotation_time()
# (src/backend/postmaster/syslogger.c) aligns the next rotation to a
# multiple of log_rotation_age measured from local midnight, not from
# process start, and recomputes that alignment fresh on every syslogger
# startup. An instance that is up at local midnight rotates (and truncates)
# then, regardless of how long it has been running — a daily deploy that
# stays up past midnight is unaffected. log_rotation_size = 0 disables
# size-based rotation entirely, so the only remaining gap is documented, not
# silent: log_truncate_on_rotation never fires on server startup or
# size-based rotation, only on time-based rotation, so a crash loop that
# never keeps the server up across a single midnight boundary appends to
# that weekday's file for the duration of the loop; the first midnight the
# server is up for truncates it back to empty.
log_filename = 'postgresql-%a.log'
log_truncate_on_rotation = on
log_rotation_age = 1d
log_rotation_size = 0

# ---------------------------------------------------------------------------
# Planner
# ---------------------------------------------------------------------------
random_page_cost = 1.1              # SSD/Docker overlay (default 4.0 is for spinning disk)
jit = off                           # Required: pgvector + JIT causes crashes/hangs
max_worker_processes = 2            # Conservative starting default; raise to host core count for parallel-heavy workloads.
max_parallel_workers = 2            # Match max_worker_processes
max_parallel_workers_per_gather = 1 # Single parallel worker per query keeps the planner predictable; raise for analytic workloads.

# ---------------------------------------------------------------------------
# pgvector tuning
# ---------------------------------------------------------------------------
# Default hnsw.ef_search (40) is too low for recall-sensitive semantic search.
# The per-query helper `set_hnsw_recall(ef=100)` in
# backend/app/processing/embeddings/helpers.py issues `SET LOCAL` on hot
# semantic-search paths; this session default backstops queries whose code
# paths forget to call the helper, so recall regressions are not silent.
hnsw.ef_search = 100                # Higher recall; slightly slower hnsw probe.

# ---------------------------------------------------------------------------
# Memory
# ---------------------------------------------------------------------------
# Starting defaults; tune up if you have headroom. Rules of thumb:
#   shared_buffers       ≈ 25% of host RAM
#   effective_cache_size ≈ 75% of host RAM (advisory; doesn't allocate)
#   work_mem             per-sort operation; PostGIS queries may allocate multiple
shared_buffers = 512MB
work_mem = 8MB
# Spills beyond work_mem land in pgsql_tmp, which lives on the same volume as
# pgdata (single mount since PG18, docker-compose.yml). Unlimited spill from a
# runaway analysis query (e.g. a grouped dissolve over millions of rows) can
# fill that volume and stop the whole cluster. The per-session ceiling below
# converts that outage into one failed query: SQLSTATE 53400, 'temporary file
# size exceeds "temp_file_limit"'. See RUNBOOK.md §4 for the operator response.
temp_file_limit = 4GB               # fix(#959): per-session ceiling on spill to pgsql_tmp
log_temp_files = 64MB               # fix(#959): log spills above this, to see pressure coming
effective_cache_size = 1536MB
maintenance_work_mem = 128MB

# ---------------------------------------------------------------------------
# WAL
# ---------------------------------------------------------------------------
wal_buffers = 16MB
min_wal_size = 100MB
max_wal_size = 1GB                  # Explicit PG default (db-audit #529). Bulk GDAL/ogr2ogr
                                    # ingests can hit checkpoint storms at 1GB — raise to 2GB on
                                    # ingest-heavy hosts if `checkpoints are occurring too frequently`
                                    # warnings appear in $PGDATA/log/.

# ---------------------------------------------------------------------------
# Logging (slow queries)
# ---------------------------------------------------------------------------
log_min_duration_statement = 1000   # Log queries slower than 1s

# ---------------------------------------------------------------------------
# Autovacuum tuning for many tables
# ---------------------------------------------------------------------------
autovacuum_max_workers = 2          # Conservative default; raise for many-table catalogs on bigger hosts.
autovacuum_naptime = 30
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
