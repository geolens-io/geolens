manifest_version: "1"
catalog:
  title: Bad publication catalog
datasets:
  - key: roads
    title: Road centerlines
    sources:
      - type: vector
        uri: ./data/roads.geojson
    publication:
      # `intent` is an open set (the server's workflow extension
      # owns it), so an unrecognized word is no longer a CLI-side error. An
      # empty intent still is — it can never name a status.
      intent: ""
