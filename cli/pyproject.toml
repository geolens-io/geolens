[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geolens-cli"
version = "1.18.0"
description = "Apache-2.0 command-line interface for the GeoLens API. Login, scan, publish, and export STAC against any GeoLens instance."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Carto Concepts, LLC", email = "noreply@getgeolens.com" }]
keywords = ["geolens", "geospatial", "cli", "stac", "openapi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "typer>=0.25.0,<0.26.0",
  "rich>=14.0.0,<16.0.0",
  "keyring>=25.0.0,<26.0.0",
  "jsonschema>=4.19.0,<5.0.0",
  "PyYAML>=6.0.0,<7.0.0",
  "tomli_w>=1.0.0,<2.0.0",
  "platformdirs>=4.0.0,<5.0.0",
  "structlog>=25.0.0,<26.0.0",
  # fix(#685 review): 1.5.0 is the first SDK carrying
  # geolens.api.datasets_analysis; `geolens analysis` raises
  # ModuleNotFoundError against anything older, and 1.2.0 satisfied the old
  # floor.
  # fix(#1107 review): 1.7.0 is the first SDK whose analysis request models
  # define join_dataset_id/join_fields; the builders pass those keywords
  # unconditionally, so a 1.5/1.6 SDK raises TypeError on every analysis
  # command, not just spatial_join.
  # feat(#1227): 1.10.0 adds the generated one-request dataset refresh method
  # and the source freshness/health/origin fields consumed by CLI status.
  "geolens>=1.10.0,<2.0.0",
  # PYSEC-2026-215 (idna.encode DoS, fixed 3.15): keep this floor in step with
  # backend's; without it a re-lock resolves idna back to a vulnerable 3.13.
  "idna>=3.18",
  # GHSA-537c-gmf6-5ccf + CVE-2026-69247/69248/69249 (all fixed by 50.0.0),
  # reached via keyring -> secretstorage on Linux only — hence the marker,
  # so non-Linux installs don't grow a cryptography requirement they never
  # had. The published wheel builds from these deps, so the floor is what
  # protects an install whose environment already satisfies an older release.
  "cryptography>=50.0.0 ; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0,<10.0.0",
]

# Source map for uv-managed development environments. uv honors this when
# it resolves dependencies from `cli/`; standard pip + the published wheel
# ignore the [tool.uv] table entirely (this stays a dev/CI-only override).
#
# Pre-Phase-228 publish, `geolens` is not yet on PyPI — so a bare
# `uv sync` / `uv run` from `cli/` would fail to resolve the dependency
# declared above. Pointing it at the local sibling tree lets uv-managed
# tooling (CI, contributors, pre-publish smoke) succeed without first
# uploading the SDK to PyPI. Once the SDK is on PyPI, this entry stays
# safe — uv prefers the local source for development workflows but
# published artifacts (which only carry the `dependencies` list) resolve
# from PyPI for end-users.
[tool.uv.sources]
geolens = { path = "../sdks/python", editable = true }

[project.scripts]
geolens = "geolens_cli.main:app"

[project.urls]
Homepage = "https://github.com/geolens-io/geolens"
Repository = "https://github.com/geolens-io/geolens"
Documentation = "https://docs.getgeolens.com/"

[tool.hatch.build.targets.wheel]
packages = ["geolens_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
